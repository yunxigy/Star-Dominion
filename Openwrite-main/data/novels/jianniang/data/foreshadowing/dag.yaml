  f011:
    id: f011
    content: 舰娘并非被创造的兵器，而是能打破因果律的"高维投影"（系统BUG）。信浓的异常记忆"记忆中的海不是这片天空"暗示舰娘来自另一个维度。
    weight: 9
    layer: 主线
    status: 埋伏
