  f010:
    id: f010
    content: 灵汐父母留下的黑色方块——实为窃取自高维文明"观察者"的"作弊码"，能屏蔽观察者的干涉。父母的死并非意外，而是为了保护方块不被夺走。
    weight: 10
    layer: 主线
    status: 埋伏
