    content: 万族争霸的真相是高维文明"观察者"的残酷兵棋推演，异族只是棋子。灵汐的黑色方块让她的舰娘成为棋盘上的"变数"。
    weight: 10
    layer: 主线
    status: 埋伏
    created_at: ch_001
