brief: 灵汐召唤的第一位舰娘——驱逐舰。性格慵懒软糯，声音带着刚睡醒的依赖感。称灵汐为"指挥官"，对灵能燃油有天然渴望（"好香的味道……拉菲……想喝"）。目前半苏醒状态，通过心智魔方与灵汐进行心灵通讯。经典台词："哈啊……指挥官？终于见面了……虽然现在很困……但是，如果是为了指挥官的话，拉菲……随时可以战斗哦。"
