chapters:
- id: ch_001
  title: 第1章 裁员
  section_id: sec_008
  summary: 陈默被星辰科技裁员，拒绝在含有模糊责任条款的文件上签字，系统绑定并发布第一个任务。
- id: ch_002
  title: 第2章 第一个任务
  section_id: sec_008
  summary: 他选择不上班、睡到自然醒，得到公寓首付；生活第一次出现安全垫，但前公司已经开始用电话和规则追着他。
- id: ch_003
  title: 第3章 因祸得福
  section_id: sec_008
  summary: 星辰科技发生办公区事故，陈默因没有去上班避开风险，也第一次意识到“按要求服从”并不等于安全。
- id: ch_004
  title: 第4章 滨江花园
  section_id: sec_008
  summary: 陈默处理公寓、租房和现金流，把系统奖励从惊喜变成可计算的生活底线。
- id: ch_005
  title: 第5章 反转
  section_id: sec_008
  summary: 前领导试图用威胁和背调吓住他，系统要求他挂断电话；陈默决定注册一家不靠加班撑住的公司，暂定名为“摆烂科技”。
- id: ch_006
  title: 第6章 证据清单
  section_id: sec_008
  summary: 周正律师帮助他把工资、考勤、解除流程和录音分开整理；陈默放弃口头争执，开始建立自己的证据和经营清单。
- id: ch_007
  title: 第7章 申请立案
  section_id: sec_008
  summary: 劳动仲裁申请被受理，星辰科技从拖延转为试探；陈默收到第一份看似合理、实则要求放弃后续权利的方案。
- id: ch_008
  title: 第8章 先问清楚
  section_id: sec_008
  summary: 他回公司逐条核对协议，发现对方真正担心的不是赔一笔钱，而是裁员流程被更多人看见。
- id: ch_009
  title: 第9章 集体行动
  section_id: sec_008
  summary: 几名被裁员工找到陈默，他只提供证据整理和律师联系方式，不替别人做决定；匿名帖子却把他推成“煽动集体仲裁的人”。
- id: ch_010
  title: 第10章 书面条件
  section_id: sec_008
  summary: 星辰科技愿意谈公开道歉和合规承诺，陈默提出违约责任和书面执行条件，约定次日签署，个人赔偿与公司未来承诺仍未落地。
- id: ch_011
  title: 第11章 先签哪一页
  section_id: sec_009
  summary: 签约前，陈默发现协议把公开道歉写成内部通告，且把未来承诺做成“尽力而为”；他坚持把关键条款改成可执行的文字。
- id: ch_012
  title: 第12章 赔偿到账以前
  section_id: sec_009
  summary: 星辰科技用延迟打款和“今天不签就没有方案”施压，陈默面临现金流焦虑，却没有拿系统奖励去替公司填旧账。
- id: ch_013
  title: 第13章 47个人的名单
  section_id: sec_009
  summary: 周正整理出更多历史裁员记录，陈默把每个人的选择和风险讲清楚；有人接受和解，有人继续仲裁，团队第一次出现意见分歧。
- id: ch_014
  title: 第14章 一笔钱的用途
  section_id: sec_009
  summary: 协议终于签署并按约付款，但陈默把钱分成生活底线、法律成本和创业预算三部分，没有把一次胜利当成无限资本。
- id: ch_015
  title: 第15章 摆烂科技
  section_id: sec_009
  summary: 公司完成注册。陈默在章程里写入准时下班、加班需自愿且付费、紧急任务轮值和拒绝伪造数据等原则，朋友们觉得他是在给自己增加麻烦。
- id: ch_016
  title: 第16章 第一份预算
  section_id: sec_009
  summary: 李静帮他算出办公、薪酬、税务和设备成本，发现只靠赔偿金最多撑半年；陈默必须先找到能产生现金流的业务，而不是先装修办公室。
- id: ch_017
  title: 第17章 便宜的办公室
  section_id: sec_009
  summary: 一个中介推荐地下层和无合同的低价场地，条件是随时加班配合房东活动；陈默拒绝这笔“便宜生意”，系统发布写字楼链式任务的第一步。
- id: ch_018
  title: 第18章 写字楼的第一盏灯
  section_id: sec_009
  summary: 他重新核查产权、消防、网络和租约，选定一层不大的旧办公区。系统奖励三年稳定使用权，但装修和日常成本仍由公司承担。
- id: ch_019
  title: 第19章 下班铃
  section_id: sec_010
  summary: 陈默公布工作制度：六点下班不是表演，项目风险要在白天暴露，紧急事项由轮值和补休承担。第一个客户听完后直接取消了会面。
- id: ch_020
  title: 第20章 被裁的人不便宜
  section_id: sec_010
  summary: 他开始招募被裁员工，发现真正有能力的人要的是清晰边界和按时发薪，不是口号；林薇提出用流程证明制度，而不是用福利吸引人。
- id: ch_021
  title: 第21章 第一份合同
  section_id: sec_010
  summary: 摆烂科技接到一个小型流程优化项目，客户要求周末免费改三轮。陈默拒绝无底线修改，改成分阶段交付，收入因此变少但责任变清楚。
- id: ch_022
  title: 第22章 没人愿意为理想加班
  section_id: sec_010
  summary: 新员工质疑陈默：“如果公司最后还是让大家累，今天的制度有什么意义？”陈默承认公司可能失败，要求大家用一周时间验证流程，而不是先表忠心。
- id: ch_023
  title: 第23章 点子王来应聘
  section_id: sec_010
  summary: 陆野带着一份被前公司否掉的产品构想来面试，三十分钟说了十个方向，却拿不出一个可验收的原型。
- id: ch_024
  title: 第24章 一个点子不值钱
  section_id: sec_010
  summary: 陈默没有被宏大叙事打动，只给陆野七天，让他从十个点子里选一个做出最小版本；陆野第一次遇到不靠熬夜逼结果的考核。
- id: ch_025
  title: 第25章 第一场内部争论
  section_id: sec_010
  summary: 张伟认为应该先做稳定的工具，陆野想一步解决所有问题，林薇担心客户交付；陈默砍掉一半功能，团队暂时不满。
- id: ch_026
  title: 第26章 六点以后的空办公室
  section_id: sec_010
  summary: 项目出现技术故障，陆野提议留下通宵。陈默允许自愿轮值，但不许全员陪同；第二天大家发现真正的漏洞来自白天没有写清楚的接口。
- id: ch_027
  title: 第27章 客户把截止日期提前
  section_id: sec_010
  summary: 客户临时把验收提前五天，摆烂科技面临违约。陈默拒绝用无偿加班填坑，改为缩小交付范围、公开风险并争取分批验收。
- id: ch_028
  title: 第28章 交付日
  section_id: sec_010
  summary: 团队在正常工作时间内完成核心功能，边缘功能延期；客户没有立刻满意，反而因为陈默主动写出缺陷清单而愿意继续谈。
- id: ch_029
  title: 第29章 漏洞不是失败
  section_id: sec_010
  summary: 一个关键漏洞在演示前暴露，张伟承担责任，林薇重排流程，陆野第一次把自己的点子拆成测试项。团队没有庆祝，却形成了第一套真正能复用的工作方法。
- id: ch_030
  title: 第30章 第一张订单
  section_id: sec_010
  summary: '客户签下正式合同，金额不大，却证明了准时下班可以和交付质量同时成立。系统结算写字楼链式奖励，并把下一阶段任务指向“让员工主动把事情做好”。

    **第一卷卷末结果：** 摆烂科技拥有稳定办公场地、第一批员工、第一份可复制的服务合同和一个尚未成熟的点子王。公司能活下来，但离“赚钱”和“技术”仍有距离。

    ---'
- id: ch_031
  title: 第31章 不加班的第二个月
  section_id: sec_011
  summary: 项目按时交付，现金流却比预期紧张。李静要求冻结招聘，陆野认为不扩团队就无法接更大的单。
- id: ch_032
  title: 第32章 工时表
  section_id: sec_011
  summary: 林薇把每个人的有效工作时间、等待时间和返工时间列出来，员工第一次看见问题不在“谁走得早”，而在流程没人负责。
- id: ch_033
  title: 第33章 会议只留一半
  section_id: sec_011
  summary: 陈默砍掉没有决策权的会议，老员工觉得效率提高，新员工却担心信息断层；公司开始建立书面记录和异步确认制度。
- id: ch_034
  title: 第34章 第一个拒绝加班的人
  section_id: sec_011
  summary: 客户现场出现小故障，张伟按轮值处理到晚上，另一名员工按规定回家。外部人嘲笑摆烂科技，陈默公开说明两者都是制度允许的选择。
- id: ch_035
  title: 第35章 一次不漂亮的延期
  section_id: sec_011
  summary: 产品交付延期两天，客户扣款。陈默不找替罪羊，决定把扣款当作流程成本，要求团队查清延误是否能被预防。
- id: ch_036
  title: 第36章 复盘不是批斗
  section_id: sec_011
  summary: 复盘会上，陆野承认自己临时改需求导致返工；陈默把“承认问题”写入奖励与晋升标准，团队开始敢于提前暴露风险。
- id: ch_037
  title: 第37章 订单变多以后
  section_id: sec_011
  summary: 口碑带来三家客户，摆烂科技第一次同时面对多项目并行；不加班的制度开始承受真正压力。
- id: ch_038
  title: 第38章 六点钟的选择
  section_id: sec_011
  summary: 一名客户以取消合同相威胁，要求全员连做三天。陈默保住原则，却失去订单，摆烂科技迎来成立以来第一次明显的营收下滑。
- id: ch_039
  title: 第39章 陆野的十个方案
  section_id: sec_012
  summary: 陆野提出自动整理客户需求、预测返工风险的工具，陈默要求他选一个最小场景，不能用“未来平台”逃避验收。
- id: ch_040
  title: 第40章 七天原型
  section_id: sec_012
  summary: 张伟提供底层接口，陆野负责交互，林薇拿真实项目做测试。原型很丑，却第一次让团队少开了两个无效会议。
- id: ch_041
  title: 第41章 失败的演示
  section_id: sec_012
  summary: 工具在客户面前崩溃，陆野想把责任推给环境。陈默让他自己向客户解释，陆野失去一个潜在订单，却学会面对产品后果。
- id: ch_042
  title: 第42章 不是所有需求都要满足
  section_id: sec_012
  summary: 客户提出十七项功能，团队按价值和风险排序，只承诺其中五项；陈默第一次拒绝大合同里的“免费定制”。
- id: ch_043
  title: 第43章 把重复工作交给机器
  section_id: sec_012
  summary: 张伟把工具接入公司内部，返工率下降。员工没有因此被裁，省出的时间被用于测试、学习和客户沟通，制度开始产生可量化的收益。
- id: ch_044
  title: 第44章 点子王的第一张路线图
  section_id: sec_012
  summary: 陆野把散乱想法整理成产品路线图，第一次从“会想”变成“会取舍”。系统奖励一次行业专家匹配，但专家提出的方向与团队原计划相反。
- id: ch_045
  title: 第45章 便宜的捷径
  section_id: sec_012
  summary: 有人建议购买一套盗版数据接口来赶进度，陈默拒绝，宁愿放慢产品上线；李静指出公司可能撑不到合法接口谈妥。
- id: ch_046
  title: 第46章 第一版产品
  section_id: sec_012
  summary: 工具以“摆烂协作”名义对外试用，效果不惊艳，却能减少返工和无效会议。它成为摆烂科技第一个可复制的产品，而不是一次性服务。
- id: ch_047
  title: 第47章 反内卷培训班
  section_id: sec_013
  summary: 极昼科技推出高价“准时下班管理课程”，把摆烂科技的制度拆成漂亮海报，却没有解决交付责任。
- id: ch_048
  title: 第48章 同样的口号
  section_id: sec_013
  summary: 客户把两家公司放在一起比较，陆野急着证明自己，陈默要求先查产品和交付数据，不参加口水战。
- id: ch_049
  title: 第49章 挖人的报价
  section_id: sec_013
  summary: 极昼科技开出两倍薪资挖张伟。张伟没有立刻拒绝，而是把家庭、收入和技术成长的真实考虑告诉陈默。
- id: ch_050
  title: 第50章 留人不是加钱
  section_id: sec_013
  summary: 陈默重新设计股权、奖金和学习时间，但不要求张伟留下。张伟最终选择留下，因为他看见了自己的决定不会成为老板的道德绑架。
- id: ch_051
  title: 第51章 被截走的客户
  section_id: sec_013
  summary: 极昼科技用低价抢走摆烂科技的大客户，团队收入下降。陈默停止无效宣传，转而把产品使用数据和服务边界写进合同。
- id: ch_052
  title: 第52章 一次公开对比
  section_id: sec_013
  summary: 两家公司同时承接一项交付，极昼科技靠加人加班抢先上线，摆烂科技晚两天却没有返工；客户第一次公开比较总成本而不是上线时间。
- id: ch_053
  title: 第53章 不好看的胜利
  section_id: sec_013
  summary: 摆烂科技拿回部分订单，但没有完成全面翻盘。陈默接受这个结果，把“少返工、少离职、可预测交付”定为核心指标。
- id: ch_054
  title: 第54章 旧领导的邀请
  section_id: sec_013
  summary: 王建国代表星辰科技提出合作，希望借摆烂科技的名义修复声誉。陈默答应听方案，却拒绝替旧公司洗白。
- id: ch_055
  title: 第55章 资本的第一杯酒
  section_id: sec_014
  summary: 投资人看中摆烂科技的反内卷标签，提出高估值和快速扩张方案，条件是压低福利、提高人效和三年上市。
- id: ch_056
  title: 第56章 李静的现金流表
  section_id: sec_014
  summary: 李静证明公司若不融资只能慢慢增长，融资则能立刻招人和买设备；两种选择都有代价，陈默没有用系统替他决定。
- id: ch_057
  title: 第57章 把选择交给全员
  section_id: sec_014
  summary: 陈默公开融资方案和风险，让核心员工参与讨论。陆野想抓住机会，周正提醒合同里的回购条款会让公司失去主动权。
- id: ch_058
  title: 第58章 不融资的条件
  section_id: sec_014
  summary: 陈默拒绝当前投资，但和投资人保留技术合作窗口。摆烂科技选择用客户收入扩张，短期被媒体写成“不识抬举”。
- id: ch_059
  title: 第59章 行业峰会
  section_id: sec_014
  summary: 极昼科技在峰会上宣称“真正的效率来自服从”。陈默没有演讲稿式反击，只展示项目延期、返工和离职数据，陆野补充产品演示。
- id: ch_060
  title: 第60章 反内卷公约
  section_id: sec_014
  summary: '三家客户愿意试行摆烂科技的交付标准，但公约没有改变整个行业，只给公司带来一批更难服务的客户。系统结算“长期选择”奖励，下一阶段任务指向更重的技术研发。

    **第二卷卷末结果：** 摆烂科技拥有自己的产品、稳定客户和一套可验证的工作方式，但营收规模仍有限。陆野成为真正的产品负责人，资本和同行都开始认真观察他们。

    ---'
- id: ch_061
  title: 第61章 三个部门
  section_id: sec_015
  summary: 公司把服务、产品和研发拆开，原本互相帮忙的同事开始争资源，陈默第一次面对组织变大后的隔阂。
- id: ch_062
  title: 第62章 谁负责结果
  section_id: sec_015
  summary: 一个项目出了问题，三个部门都能拿出理由。林薇推动责任矩阵，陈默发现自己习惯亲自收拾残局，正在阻碍组织成长。
- id: ch_063
  title: 第63章 不靠老板盯着
  section_id: sec_015
  summary: 系统发布阶段任务：连续一个月不在晚上处理内部管理消息。陈默必须把授权、流程和判断标准交出去。
- id: ch_064
  title: 第64章 第一次失控
  section_id: sec_015
  summary: 他减少干预后，产品上线出现严重排期错误。团队没有加班掩盖，先暂停交付，客户因此不满。
- id: ch_065
  title: 第65章 失控的代价
  section_id: sec_015
  summary: 公司赔付违约金，陈默没有收回所有权限，而是让责任人参与修复。李静警告现金流开始变薄。
- id: ch_066
  title: 第66章 让流程替人背锅
  section_id: sec_015
  summary: 陆野把研发排期和客户承诺放进同一套系统，张伟补上权限审计。摆烂科技第一次用产品解决自己的管理问题。
- id: ch_067
  title: 第67章 第一笔研发预算
  section_id: sec_015
  summary: 陈默决定拿出两年利润投入基础技术，短期利润会下降。投资人和部分员工都认为他不该在公司刚站稳时冒险。
- id: ch_068
  title: 第68章 慢一步的人
  section_id: sec_015
  summary: 竞争对手凭借融资快速推出类似产品，摆烂科技暂时失去市场热度。陈默选择继续做底层能力，集团化道路由此开始。
- id: ch_069
  title: 第69章 工厂的夜班
  section_id: sec_016
  summary: 摆烂科技接触到一家制造企业，那里真正存在不能停的生产线。陈默第一次面对“反内卷”与生产安全的边界。
- id: ch_070
  title: 第70章 不能靠口号停机器
  section_id: sec_016
  summary: 团队设计轮班、预警和故障升级机制，允许必要的夜间值守，同时保证付费、补休和交接。系统不奖励逃避，而奖励把责任做成制度。
- id: ch_071
  title: 第71章 第一次现场故障
  section_id: sec_016
  summary: 试点系统误报，工厂停线半小时。客户要求解除合同，张伟和陆野必须在现场完成排查，但陈默不允许无关人员陪着熬夜。
- id: ch_072
  title: 第72章 赔钱的试点
  section_id: sec_016
  summary: 摆烂科技承担损失，获得继续试运行的机会。团队把故障记录开放给客户，换来对方更完整的数据。
- id: ch_073
  title: 第73章 工业软件不是PPT
  section_id: sec_016
  summary: 陆野意识到产品不能只在会议室里好用，开始跟着工程师学习工艺、设备和现场语言。
- id: ch_074
  title: 第74章 第一条产业链
  section_id: sec_016
  summary: 李静找到三家国内供应商，陈默拒绝低价压款，转而签长期订单。公司利润进一步下降，却掌握了稳定的设备和数据来源。
- id: ch_075
  title: 第75章 点子王的硬仗
  section_id: sec_016
  summary: 陆野提出把企业协作工具延伸到生产调度，没人相信一个产品经理能解决现场问题。他带队做出小范围方案，却在验收前发现关键指标算错。
- id: ch_076
  title: 第76章 重新开始的验收
  section_id: sec_016
  summary: 团队放弃赶工上线，重新定义指标，第二次试点只覆盖一条产线。结果不够漂亮，但可以稳定运行，摆烂科技第一次真正进入产业技术。
- id: ch_077
  title: 第77章 收购还是合作
  section_id: sec_017
  summary: 一家拥有关键算法的小团队濒临解散，资本想低价收购后拆卖。陈默提出保留原团队和研发权，价格因此更高。
- id: ch_078
  title: 第78章 不能把人当资产
  section_id: sec_017
  summary: 收购谈判中，创始人要求员工不被强制搬迁。李静认为条件过于昂贵，陈默必须在现金安全和组织信任之间选择。
- id: ch_079
  title: 第79章 第一家子公司
  section_id: sec_017
  summary: 团队完成并购，成立工业智能子公司。原公司员工担心被架空，陈默让子公司独立核算，自己只设技术和合规底线。
- id: ch_080
  title: 第80章 两套文化
  section_id: sec_017
  summary: 子公司习惯临时救火，摆烂科技习惯提前规划，双方在一次客户项目中互相指责。林薇设计跨团队协作规则，但规则一开始被两边同时抵制。
- id: ch_081
  title: 第81章 研发方向之争
  section_id: sec_017
  summary: 一边主张追逐热门大模型，一边主张继续做工业基础工具。陈默要求用客户真实问题排优先级，不让市场热词决定研发。
- id: ch_082
  title: 第82章 设备厂的拒绝
  section_id: sec_017
  summary: 国内设备厂担心数据被平台控制，拒绝接入。陈默把接口标准和数据归属写进合同，放弃一部分短期收益。
- id: ch_083
  title: 第83章 第一份共同标准
  section_id: sec_017
  summary: 三家设备厂接受开放接口，摆烂科技从单一产品供应商变成产业协作方，影响力第一次超过营收规模。
- id: ch_084
  title: 第84章 集团成立
  section_id: sec_017
  summary: 摆烂科技完成集团化重组，陈默不再亲自审批每个项目。系统奖励新的办公和实验场地，但同时冻结一部分现金奖励，迫使公司学会靠经营维持扩张。
- id: ch_085
  title: 第85章 没有掌声的实验室
  section_id: sec_018
  summary: 集团实验室开始研发国产工业边缘计算模块，连续两个月没有可展示成果，媒体开始质疑陈默“从反内卷跑去烧钱”。
- id: ch_086
  title: 第86章 第一次样机
  section_id: sec_018
  summary: 样机功耗达标，却在高温环境下失效。陆野提出修改产品方向，张伟坚持先解决可靠性，团队再次发生路线冲突。
- id: ch_087
  title: 第87章 失败报告
  section_id: sec_018
  summary: 陈默要求把失败原因写成公开内部报告，不许用“环境问题”带过。报告让一位供应商退出，也吸引另一家愿意共同攻关的企业。
- id: ch_088
  title: 第88章 核心器件断供
  section_id: sec_018
  summary: 海外供应商突然停止供货，项目被迫暂停。公司可以花高价买库存，也可以转向国产替代，李静计算出后者可能让集团亏损一年。
- id: ch_089
  title: 第89章 不追求一次成功
  section_id: sec_018
  summary: 集团分阶段替换器件，先保住客户可用版本，再做完整替代。陈默拒绝把员工推入无期限加班，建立有偿轮值和休整制度。
- id: ch_090
  title: 第90章 第一台真正属于自己的设备
  section_id: sec_018
  summary: '国产边缘模块通过现场测试，性能不是世界最好，却能稳定服务真实工厂。集团获得首批长期订单，外界第一次把摆烂科技视为技术公司，而不是职场营销号。

    **第三卷卷末结果：** 摆烂科技成为拥有软件、工业应用和研发能力的科技集团，陆野从点子王成长为产品与技术负责人。规模带来管理难题，海外供应链也正式把他们推到更大的竞争场。

    ---'
- id: ch_091
  title: 第91章 断供通知
  section_id: sec_019
  summary: 集团收到关键器件断供和技术许可限制通知，多个客户生产线可能受影响。媒体把责任归到陈默的“慢节奏管理”上。
- id: ch_092
  title: 第92章 紧急会议
  section_id: sec_019
  summary: 陈默没有召集所有人通宵，而是按产品、客户、安全和供应链分组，建立真正的应急轮值；愿意参与的人有明确报酬、权限和退出时间。
- id: ch_093
  title: 第93章 谁愿意留下
  section_id: sec_019
  summary: 部分员工主动报名，部分员工选择照常休息。陈默不评判两种选择，结果团队反而更愿意承担关键岗位。
- id: ch_094
  title: 第94章 第二条供应链
  section_id: sec_019
  summary: 李静和供应商在全国范围内寻找替代器件，发现质量、产能和认证都存在缺口。集团必须决定先保哪一类客户。
- id: ch_095
  title: 第95章 先救谁
  section_id: sec_019
  summary: 一个大客户愿意支付高价抢走全部库存，小客户则会因此停产。陈默拒绝单纯按价格分配，提出按生产风险和替代难度分层供货。
- id: ch_096
  title: 第96章 公开名单
  section_id: sec_019
  summary: 竞争方指责集团搞垄断，陈默公开供货规则和缺口数据，短期失去一笔大订单，却让更多供应商愿意提供产能。
- id: ch_097
  title: 第97章 轮值表上的名字
  section_id: sec_019
  summary: 陈默发现自己为了维持制度，把所有难题都推给了核心员工。系统任务要求他在不牺牲休息制度的前提下完成授权，逼他面对领导者的责任。
- id: ch_098
  title: 第98章 不是老板一个人的战争
  section_id: sec_019
  summary: 集团各部门在没有陈默逐项批准的情况下完成第一次应急交付，结果仍有小故障，但客户没有停产。组织开始证明自己能独立运转。
- id: ch_099
  title: 第99章 国产方案的价格
  section_id: sec_020
  summary: 替代器件成本高、性能不稳定，客户要求集团降价。陈默选择与供应商共同承担研发费用，集团利润大幅下降。
- id: ch_100
  title: 第100章 失败的联合测试
  section_id: sec_020
  summary: 三家企业联合测试失败，外界抓住机会宣布国产方案“不可靠”。张伟要求暂停宣传，先把失败样本全部拆开。
- id: ch_101
  title: 第101章 供应商会议
  section_id: sec_020
  summary: 陈默把竞争企业、设备厂和高校实验室请到同一张桌子上，过去互相保密的企业不愿共享数据，会议差点结束。
- id: ch_102
  title: 第102章 数据归谁
  section_id: sec_020
  summary: 陆野提出开放接口，李静担心集团失去商业壁垒。双方围绕数据权、商业秘密和行业标准争论数日，最终形成分层开放方案。
- id: ch_103
  title: 第103章 第二次样机
  section_id: sec_020
  summary: 新样机在实验室通过，却在真实工厂出现延迟。团队不再把实验室成绩当成胜利，转而扩大现场测试。
- id: ch_104
  title: 第104章 没有人能保证成功
  section_id: sec_020
  summary: 陈默在客户会议上承认仍有风险，客户要求把风险写进合同并保留退出权。集团因此失去一部分订单，但留下来的客户愿意共同测试。
- id: ch_105
  title: 第105章 国产替代的第一条线
  section_id: sec_020
  summary: 一条生产线完成连续运行，不能立刻替代全国市场，却让供应商拿到下一轮产能投资。系统结算“让资源流向长期价值”的奖励。
- id: ch_106
  title: 第106章 不能只救自己
  section_id: sec_020
  summary: 陈默提出把部分基础接口开放给国内产业链，遭到集团内部反对。技术团队担心被抄，财务担心利润，员工担心集团承担太多责任。
- id: ch_107
  title: 第107章 反内卷联盟
  section_id: sec_021
  summary: 陈默不再用口号宣传准时下班，而是邀请客户和供应商共同制定交付、值守、数据和人员安全标准。
- id: ch_108
  title: 第108章 谁会签字
  section_id: sec_021
  summary: 大企业怕承担责任，小企业怕得罪客户。林薇逐家沟通，发现真正的阻力不是不认可，而是没人愿意先承担改变的成本。
- id: ch_109
  title: 第109章 第一个公开试点
  section_id: sec_021
  summary: 一家工厂愿意试行新标准，却在第一个月出现产能下降。陈默必须接受“制度正确但短期不好看”的质疑。
- id: ch_110
  title: 第110章 公开账本
  section_id: sec_021
  summary: 集团公布试点的工时、返工、事故和产量数据，证明效率不一定立刻上升，但长期波动和离职率明显下降。
- id: ch_111
  title: 第111章 对手的反击
  section_id: sec_021
  summary: 极昼科技发起舆论战，称摆烂集团用行业标准排斥小企业。陈默不要求平台删帖，改用公开接口和第三方审计回应。
- id: ch_112
  title: 第112章 一份不完美的标准
  section_id: sec_021
  summary: 联盟把标准拆为基础安全、付费值守、数据责任和交付质量四部分，允许不同规模的企业分阶段加入。
- id: ch_113
  title: 第113章 集团内部的反对票
  section_id: sec_021
  summary: 一部分股东认为开放标准会削弱集团优势，要求陈默转向高利润封闭平台。陈默第一次面对来自自己人而不是竞争对手的挑战。
- id: ch_114
  title: 第114章 不把未来卖掉
  section_id: sec_021
  summary: 陈默拒绝用行业影响力换短期估值，接受集团增长放缓。陆野和李静分别用产品和现金流证明开放策略可以持续，但不会马上带来漂亮报表。
- id: ch_115
  title: 第115章 中国方案
  section_id: sec_022
  summary: 国内多家设备厂基于开放接口完成协作，集团的工业软件、边缘模块和供应链方案形成完整链路，海外客户开始主动询问。
- id: ch_116
  title: 第116章 最后一份任务
  section_id: sec_022
  summary: 系统发布最终任务：在陈默不亲自审批、不要求任何人牺牲休息的情况下，让集团完成一次跨区域技术交付。
- id: ch_117
  title: 第117章 没有陈默的会议
  section_id: sec_022
  summary: 陈默只能旁听，不能替任何部门拍板。团队在利益冲突和技术风险中做出自己的决定，过程并不完美，却没有回到靠老板吼叫推进的旧路。
- id: ch_118
  title: 第118章 交付前夜
  section_id: sec_022
  summary: 海外客户临时改变验收条件，集团可以用一次高强度突击换取签约，也可以坚持合同边界、承担延期风险。陆野提出第三种方案：缩小首期范围，按阶段交付。
- id: ch_119
  title: 第119章 六点下班
  section_id: sec_022
  summary: 跨区域交付完成，仍有两项功能延期，但核心系统稳定运行。陈默在最后一次轮值结束后准时关掉电脑，系统提示任务进入结算。
- id: ch_120
  title: 第120章 摆烂，我是认真的
  section_id: sec_022
  summary: '系统奖励不再是钱、房子或称号，而是一段不再需要系统证明的生活。摆烂科技成为引领中国科技产业升级的重要集团，陈默把更多决策交给团队，周五六点走出办公室，发现楼里仍有人工作，却没人需要用熬夜证明忠诚。

    **全书终点：** 陈默没有把“摆烂”变成逃避，而是把它翻译成有边界的责任、可持续的效率和不依赖牺牲个人生活的技术进步。

    ---'
