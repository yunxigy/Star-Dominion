story_info:
  title: 《我有一个摆烂系统》
arcs:
- id: arc_001
  title: 一句话主线
  sections: []
  chapters: []
  summary: 被裁员的陈默绑定“摆烂系统”，从拒绝无意义加班开始，先拿到活下去的钱和房，再用自己的判断力招来一群被内卷淘汰的人。他们把准时下班做成效率，把一个个点子做成产品，最后从一家小公司成长为解决中国关键技术问题的科技集团。
- id: arc_002
  title: 故事承诺
  sections: []
  chapters: []
  summary: '这不是“主角什么都不做，系统替他发财”的故事。系统只奖励陈默拒绝无意义消耗、坚持长期价值的选择；钱、住房、办公场地和研发资源只能解决门槛，真正的产品、客户、人才和技术成果必须由陈默与团队完成。

    故事的核心爽点有三层：'
