sections:
- id: sec_001
  title: 陈默
  arc_id: arc_003
  chapters: []
  summary: 前星辰科技项目主管，工作五年，做过项目、交付和客户沟通。他不是天才发明家，但擅长看出流程里的浪费、判断一个承诺是否可信、把复杂问题拆成可执行的步骤。系统出现后，他最大的变化不是变聪明，而是不再把时间交给恐惧。
- id: sec_002
  title: 陆野——点子王
  arc_id: arc_003
  chapters: []
  summary: 前产品经理，脑子里有一堆不按常规走的想法，曾因“想得太多、落地太少”被团队排斥。他不是搞笑工具人，前期要学会把点子写成需求、做成原型，后期成长为负责产品与研发方向的核心负责人。陈默给他的不是无限试错的钱，而是明确的验证期限和不被加班绑架的工作环境。
- id: sec_003
  title: 周正
  arc_id: arc_003
  chapters: []
  summary: 劳动律师，最早帮助陈默处理星辰科技的裁员争议。后期负责合同、知识产权、员工权益和集团合规，是团队里经常提醒陈默“赢了情绪不等于赢了公司”的人。
- id: sec_004
  title: 林薇
  arc_id: arc_003
  chapters: []
  summary: 第一批加入摆烂科技的运营负责人，曾经在大公司负责流程，却因为拒绝伪造数据被边缘化。她把“准时下班”变成排班、交付、复盘和责任边界，而不是一句口号。
- id: sec_005
  title: 张伟与李静
  arc_id: arc_003
  chapters: []
  summary: 张伟是工程师，擅长把重复工作工具化；李静负责财务和供应商管理，最早质疑陈默把钱花在员工福利和基础设施上的决定，后来成为集团里最严格的现金流守门人。
- id: sec_006
  title: 王建国、李薇
  arc_id: arc_003
  chapters: []
  summary: 星辰科技的旧管理层。王建国代表“用承诺换加班、用背调吓退员工”的旧职场逻辑，李薇负责公司的人事和危机公关。两人不是脸谱化坏人，他们也会在压力下做出正确选择，但不会轻易放弃维护公司利益。
- id: sec_007
  title: 竞争方
  arc_id: arc_003
  chapters: []
  summary: 前期是星辰科技及其客户圈，中期是把“反内卷”当营销口号的极昼科技，后期扩展为资本、供应链和海外技术许可构成的多重压力。对手的手段包括挖人、抹黑、压价、抢客户、卡设备和改变规则，不能只靠一次公开打脸解决。
- id: sec_008
  title: 第一阶段：被裁员的人先把账算清（第1—10章）
