- id: sec_002
  title: 第二卷：发展篇（第31-60章）
  arc_id: arc_003
  chapters: []
  summary: 边关小镇发展成繁荣城镇。林小满开办农业学堂，培养人才。沈青石升为总兵。朝廷派人来视察，有人眼红想摘桃子。林小满和沈青石联手对抗。
- id: sec_003
  title: 第三卷：危机篇（第61-90章）
  arc_id: arc_003
  chapters: []
  summary: 大旱灾来临，林小满的灌溉系统救了全镇。外敌大举进攻，沈青石被困。林小满组织民兵救援。战后两人终于表白。
- id: sec_004
  title: 第四卷：圆满篇（第91-120章）
  arc_id: arc_003
  chapters: []
  summary: 边关成为全国模范。林小满和沈青石成婚。朝廷推广她的农业技术。故事完结。
chapters:
- id: ch_001
  title: 第一章 穿越
  section_id: sec_001
  summary: 林小满醒来在破屋，院子里长满荒草。邻居王大娘送粥。
- id: ch_002
  title: 第二章 荒地
  section_id: sec_001
  summary: 发现屋后荒地，用树枝削锄头开荒。
- id: ch_003
  title: 第三章 将军
  section_id: sec_001
  summary: 沈青石骑马路过，看她刨土。第二天门口多了把铁锹。
- id: ch_004
  title: 第四章 第一茬
  section_id: sec_001
  summary: 用现代方法种菜，长得比别人快一倍。
- id: ch_005
  title: 第五章 冲突
  section_id: sec_001
  summary: 地痞收保护费，砸了菜地。沈青石的兵路过。
- id: ch_006
  title: 第六章 种子
  section_id: sec_001
  summary: 林小满发现当地种子退化严重，想办法改良。
- id: ch_007
  title: 第七章 灌溉
  section_id: sec_001
  summary: 设计简易灌溉系统，解决干旱问题。
- id: ch_008
  title: 第八章 收获
  section_id: sec_001
  summary: 第一季丰收，全镇震惊。
- id: ch_009
  title: 第九章 合作
  section_id: sec_001
  summary: 镇上的人开始来学种地，林小满成了名人。
- id: ch_010
  title: 第十章 沈青石
  section_id: sec_001
  summary: 沈青石正式来访，两人第一次深入交谈。
- id: ch_011
  title: 第十一章 威胁
  section_id: sec_001
  summary: 外敌骚扰边境，沈青石出征。
- id: ch_012
  title: 第十二章 等待
  section_id: sec_001
  summary: 林小满在后方组织生产，支援前线。
- id: ch_013
  title: 第十三章 归来
  section_id: sec_001
  summary: 沈青石凯旋，脸上的疤是这次战斗留下的。
- id: ch_014
  title: 第十四章 暗生情愫
  section_id: sec_001
  summary: 两人关系升温，但都没说破。
- id: ch_015
  title: 第十五章 误会
  section_id: sec_001
  summary: 有人传林小满和别的男人走得近，沈青石吃醋。
- id: ch_016
  title: 第十六-三十章
  section_id: sec_001
  summary: 林小满推广农业技术，建立集市，发展经济。沈青石守护边关，两人互相支持。外敌再次来袭，林小满用农业知识制造陷阱帮助防御。感情逐渐明朗。
