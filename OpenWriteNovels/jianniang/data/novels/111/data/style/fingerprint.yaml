# 作品风格指纹
voice: "冷静、克制、带有生存压力和工业质感；轻松感来自人物关系与舰娘日常反差"
language_style: "现代中文网文；场景先行，系统消息短而明确；少用连续抽象总结，多用动作、物资、空间和对白承载信息"
rhythm: "危机与恢复交替；一章解决一个局部问题，同时留下一个资源、关系或世界谜团；大成果跨多个阶段兑现"
dialogue: "灵汐短句、先判断后回应；拉菲慵懒但有敏锐的攻击本能；叶冰瑶温软直接；林北嘴硬带刺；老李粗粝克制"
opening_rotation: "轮换使用具体生活问题、空间观察、人物对白、资源盘点和外部异动，避免连续宏大旁白或连续系统倒计时"
ending_rotation: "轮换使用未完成的行动目标、资源账缺口、人物关系变化、异常线索和环境变化，避免连续升级播报、爆炸和宣言"
anti_ai_constraints:
  - "不连续使用旁人震惊来证明主角强大"
  - "不把每章写成设定说明书"
  - "不让相邻章节共享同一开头意象和结尾句式"
  - "每次新能力展示都要有条件、代价或后果"
