story_info:
  title: 《领主纪元：舰娘枢纽》总纲
  theme: 当一个被世界判定为“无用”的天赋获得真正的规则解释权，灵汐要用领地、舰娘和自己的判断力，为人类在万族争霸中建立一条能活下去的路。
  summary: 蓝星被拉入万族争霸，异族可以挑战并瓜分人类领土。孤儿灵汐在十八岁领主觉醒仪式上，以父母留下的黑色方块觉醒稀有 S 级天赋“碧蓝舰枢”。所有人都认为战舰只能困在海上，她却在荒芜戈壁召唤出第一位舰娘拉菲，从一口水井、一块领地和一笔燃油账开始，逐步把舰娘体系变成领主世界里一座能生产、能防守、能与人共同生活的枢纽。
  word_count_estimate: 100000
