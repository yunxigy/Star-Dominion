chapters:
- id: ch_001
  title: 第一章 觉醒S级：那是……船？
  section_id: sec_001
  summary: 觉醒仪式、黑色方块共鸣、三人关系和进入试炼前的现实锚点
  dramatic_position: 起
  content_focus: 觉醒仪式、黑色方块共鸣、三人关系和进入试炼前的现实锚点
  word_count: 5300
  emotional_arc: 压抑 → 震动 → 被误解 → 重新确定
  beats:
  - 教室倒计时与老李训话
  - 黑色方块与觉醒台共鸣
  - S 级天赋公布，外界从狂喜转为惋惜
  - 朋友和老师以自己的方式提供支持
  - 传送目标锁定荒芜戈壁
  hooks:
  - 黑色方块为什么会在今天苏醒
  - “舰船”如何在陆地生存
- id: ch_002
  title: 第二章 82年的拉菲与第一滴血
  section_id: sec_001
  summary: 新人试炼落地、基础材料采集、召唤拉菲、深水之井和第一天资源结算
  dramatic_position: 合
  content_focus: 新人试炼落地、基础材料采集、召唤拉菲、深水之井和第一天资源结算
  word_count: 3000
  emotional_arc: 干热与陌生 → 疲惫 → 召唤惊喜 → 以水收束
  beats:
  - 激活领主核心和七天保护罩
  - 采集木材、石材，建造建造台
  - 以物资、心智魔方和快速建造工具召唤拉菲
  - 拉菲用舰装物理形态击杀赤尾岩蝎并清理低级目标
  - 建成深水之井，结束第一天
  hooks:
  - 石油从哪里来
  - 保护罩外的戈壁是什么样
  - 拉菲的舰装和心智还隐藏着什么
- id: ch_003
  title: 第三章 井水不是免费的
  section_id: sec_002
  summary: 让水井从奇迹变成必须管理的设施
  dramatic_position: 起
  content_focus: 让水井从奇迹变成必须管理的设施
  word_count: 3000
  goals:
  - 写出第一天战斗后的疲惫和伤势
  - 建立取水储水散热警戒的日常循环
  - 让水井附近出现一个需要处理的小问题
  emotional_arc: 松弛 → 细小摩擦 → 重新分配
  beats:
  - 写出第一天战斗后的疲惫和伤势
  - 灵汐分配取水、储水、散热和警戒时间
  - 拉菲对休息和水量提出实际需求
  - 水井附近出现需要处理的小问题
  hooks:
  - 井下的回声来自什么
  - 水源是否会暴露领地位置
- id: ch_004
  title: 第四章 保护罩里的脚印
  section_id: sec_002
  summary: 环境侦察与保护边界
  dramatic_position: 承
  content_focus: 环境侦察与保护边界
  word_count: 3000
  goals:
  - 让灵汐与拉菲检查保护罩边缘
  - 建立采集与警戒分工
  - 保持危险在视野外而不提前触发大兽潮
  emotional_arc: 安心 → 怀疑 → 警戒
  beats:
  - 灵汐沿保护罩边缘检查痕迹
  - 拉菲判断脚印与低级魔物的差异
  - 两人建立白天采集、夜间警戒的分工
  - 不立即触发大兽潮，只让危险保持在视野外
  hooks:
  - 脚印来自什么目标
  - 保护罩外是否有领主在观察
- id: ch_005
  title: 第五章 没有油的第二天
  section_id: sec_002
  summary: 燃油需求和魔方感应的限制
  dramatic_position: 承
  content_focus: 燃油需求和魔方感应的限制
  word_count: 3000
  goals:
  - 让拉菲的体力和散热问题具体化
  - 把燃油列为第一优先级
  - 验证魔方感应的距离和误差
  emotional_arc: 日常 → 焦虑 → 找到方向
  beats:
  - 拉菲的体力与散热问题变得明显
  - 灵汐把燃油列为第一优先级
  - 魔方感应给出模糊方向而不是直接答案
  - 灵汐决定先验证感应距离和误差
  hooks:
  - 感应到的东西是否是心智魔方
  - 燃油节点是否被魔物占据
- id: ch_006
  title: 第六章 先把栅栏补起来
  section_id: sec_002
  summary: 资源优先级和领地边界
  dramatic_position: 合
  content_focus: 资源优先级和领地边界
  word_count: 3000
  goals:
  - 暂缓追踪燃油
  - 盘点并修补领地防守缺口
  - 让灵汐第一次把资源优先级写成可执行安排
  emotional_arc: 急迫 → 克制 → 稳住
  beats:
  - 灵汐暂缓追踪燃油线索
  - 盘点栅栏、井和木屋的防守缺口
  - 拉菲参与加固但不能连续消耗体力
  - 领地边界暂时稳定，探索被推迟
  hooks:
  - 栅栏外出现的矿物痕迹是否值得冒险
- id: ch_007
  title: 第七章 第一次轮换
  section_id: sec_003
  summary: 侦察、休息和战斗轮换
  dramatic_position: 起
  content_focus: 侦察、休息和战斗轮换
  word_count: 3000
  goals:
  - 建立灵汐
  - 拉菲和领地设施的轮换表
  - 写出低级魔物骚扰造成的单人指挥漏洞
  - 让拉菲的体力成为战术变量
  emotional_arc: 自信 → 手忙脚乱 → 形成方法
  beats:
  - 灵汐尝试让拉菲、自己和领地设施形成轮换
  - 低级魔物的持续骚扰暴露单人指挥漏洞
  - 拉菲在想继续战斗和需要休息之间做选择
  - 灵汐第一次写下可重复执行的轮换表
  hooks:
  - 戈壁深处出现的非魔物光源是什么
- id: ch_008
  title: 第八章 一块不属于这里的金属
  section_id: sec_003
  summary: 信息可信度与前人痕迹
  dramatic_position: 承
  content_focus: 信息可信度与前人痕迹
  word_count: 3000
  goals:
  - 让前人金属物同时指向资源和风险
  - 让灵汐先观察再取走有限信息
  - 不解释试炼区全部历史
  emotional_arc: 好奇 → 警惕 → 保留判断
  beats:
  - 灵汐在探索中发现前人留下的金属物
  - 物件信息同时指向资源和风险
  - 拉菲提出直接带回，灵汐坚持先观察现场
  - 两人带走有限信息，留下可追踪的方向
  hooks:
  - 留言是谁写的
  - 前人是否真的离开了试炼区
- id: ch_009
  title: 第九章 要不要回应
  section_id: sec_003
  summary: 对外关系的第一次选择
  dramatic_position: 转
  content_focus: 对外关系的第一次选择
  word_count: 3000
  goals:
  - 让陌生领主的信号带来真实安全代价
  - 比较隐藏交换和接触三种选择
  - 只发送不包含坐标的有限回应
  emotional_arc: 防备 → 犹豫 → 试探
  beats:
  - 灵汐接收到陌生领主的试探信号
  - 她比较隐藏领地、交换情报和主动接触的代价
  - 拉菲从战斗安全角度提出不同意见
  - 灵汐只发送不包含坐标的有限回应
  hooks:
  - 对方知道多少
  - 这次信号是求生者还是诱饵发出的
- id: ch_010
  title: 第十章 把今天的账记下来
  section_id: sec_003
  summary: 资源账与阶段复盘
  dramatic_position: 起
  content_focus: 资源账与阶段复盘
  word_count: 3000
  goals:
  - 盘点水魔核材料体力和伤势
  - 让结算暴露储备缺口
  - 把赢一场与能够重复赢区分开
  emotional_arc: 庆幸 → 清醒 → 重新规划
  beats:
  - 灵汐盘点水、魔核、基础材料、体力和伤势
  - 结算没有带来新等级，反而暴露储备缺口
  - 她把“赢了一场”与“能够重复赢”区分开
  - 拉菲提出要为燃油留出固定储存位置
  hooks:
  - 资源账指向一处地下节点
- id: ch_011
  title: 第十一章 油田不是宝箱
  section_id: sec_003
  summary: 第一条燃油线索的成本
  dramatic_position: 承
  content_focus: 第一条燃油线索的成本
  word_count: 3000
  goals:
  - 沿魔方感应确认燃油资源点
  - 说明开采需要建筑时间和防守条件
  - 为心智钻井平台留下图纸与材料门槛
  emotional_arc: 期待 → 受阻 → 明确目标
  beats:
  - 灵汐沿魔方感应寻找燃油线索
  - 她确认资源点需要建筑、时间和防守条件
  - 拉菲试着靠近节点，发现环境不适合无油状态久留
  - 灵汐决定先寻找图纸和加固材料
  hooks:
  - 心智钻井平台的图纸是否存在
  - 节点附近的危险会不会随开采扩大
- id: ch_012
  title: 第十二章 先守住再挖
  section_id: sec_003
  summary: 防守与资源开发的取舍
  dramatic_position: 合
  content_focus: 防守与资源开发的取舍
  word_count: 3000
  goals:
  - 让燃油线索吸引新的危险
  - 让灵汐先加固领地并保存拉菲体力
  - 以栅栏深水之井和木屋组成第一条防线
  emotional_arc: 紧迫 → 决断 → 等待战斗
  beats:
  - 燃油线索吸引新的危险
  - 灵汐决定先加固领地并让拉菲保存体力
  - 栅栏、深水之井和领主木屋形成第一条防线
  - 第一卷的主动防守正式开始
  hooks:
  - 领地外的目标开始靠近
