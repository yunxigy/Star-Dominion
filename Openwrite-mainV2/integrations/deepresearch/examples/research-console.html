<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepResearch</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap");

    :root {
      color-scheme: dark;
      --bg-0: #0B1220;
      --bg-1: #0F172A;
      --panel: #111C2E;
      --panel-2: #1E293B;
      --line: #223149;
      --line-2: #334155;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --muted-2: #64748B;
      --green: #22C55E;
      --blue: #38BDF8;
      --amber: #F59E0B;
      --red: #EF4444;
      --violet: #A78BFA;
      --teal: #2DD4BF;
      --shadow: 0 18px 48px rgba(2, 6, 23, 0.55);
      --shadow-sm: 0 6px 18px rgba(2, 6, 23, 0.4);
      --ring: rgba(56, 189, 248, 0.14);
      --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "PingFang SC", "Microsoft YaHei", monospace;
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.55;
    }

    * { box-sizing: border-box; }

    * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--line-2);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: #42536e; border: 2px solid transparent; background-clip: padding-box; }

    ::selection { background: rgba(56, 189, 248, 0.28); }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1100px 520px at 72% -12%, rgba(56, 189, 248, 0.07), transparent 62%),
        radial-gradient(900px 480px at 8% 110%, rgba(167, 139, 250, 0.05), transparent 60%),
        var(--bg-0);
      color: var(--text);
    }

    button, textarea, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    :focus-visible {
      outline: 2px solid rgba(56, 189, 248, 0.75);
      outline-offset: 2px;
    }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
      60% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    }

    @keyframes pulse-dot-amber {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
      60% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--side-width, 420px);
    }

    .app.side-collapsed {
      grid-template-columns: minmax(0, 1fr) 48px;
    }

    .main {
      min-width: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    /* ---------- 顶栏 ---------- */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 18, 32, 0.72);
      backdrop-filter: blur(14px) saturate(1.35);
      -webkit-backdrop-filter: blur(14px) saturate(1.35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font: 600 14px/1.2 var(--font-mono);
      letter-spacing: 0.04em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .run-hint {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted-2);
      font: 12px/1.4 var(--font-mono);
    }

    .orb {
      width: 29px;
      height: 29px;
      border-radius: 999px;
      background: linear-gradient(135deg, #38BDF8, #A78BFA);
      color: #0B1220;
      display: grid;
      place-items: center;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
      font: 700 14px/1 var(--font-mono);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      padding: 5px 11px;
      color: var(--muted);
      background: rgba(30, 41, 59, 0.55);
      font: 500 12px/1.4 var(--font-mono);
      transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: currentColor;
      flex: 0 0 auto;
    }

    .status[data-state="running"] {
      color: #4ADE80;
      border-color: rgba(34, 197, 94, 0.45);
      background: rgba(34, 197, 94, 0.1);
    }

    .status[data-state="running"]::before {
      animation: pulse-dot 1.6s ease-out infinite;
    }

    .status[data-state="succeeded"],
    .status[data-state="completed"],
    .status[data-state="finished"] {
      color: #4ADE80;
      border-color: rgba(34, 197, 94, 0.4);
      background: rgba(34, 197, 94, 0.08);
    }

    .status[data-state="loaded"] {
      color: #7DD3FC;
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.08);
    }

    .status[data-state="needs_human_review"],
    .status[data-state="interrupted"] {
      color: #FBBF24;
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
    }

    .status[data-state="needs_human_review"]::before {
      animation: pulse-dot-amber 1.8s ease-out infinite;
    }

    .status[data-state="error"],
    .status[data-state="failed"] {
      color: #F87171;
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.09);
    }

    /* ---------- 消息流 ---------- */

    .scroll {
      min-height: 0;
      overflow: auto;
      padding: 12px 24px 30px;
    }

    .messages {
      width: min(880px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .user-bubble {
      justify-self: end;
      max-width: min(680px, 92%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      padding: 11px 16px;
      line-height: 1.55;
      box-shadow: var(--shadow-sm);
    }

    .assistant-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .assistant-icon {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.9), rgba(167, 139, 250, 0.9));
      color: #0B1220;
      display: grid;
      place-items: center;
      font: 800 13px/1 var(--font-mono);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.28);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .assistant-icon:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
    }

    .assistant-message {
      min-width: 0;
      color: var(--text);
    }

    .message-text {
      margin: 0 0 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-meta {
      margin-top: -4px;
      color: var(--muted-2);
      font: 11px/1.4 var(--font-mono);
    }

    .step-card {
      border: 1px solid var(--line);
      border-left: 3px solid var(--blue);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
      margin: 10px 0;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 180ms ease, background 180ms ease;
    }

    .step-card:hover {
      border-color: var(--line-2);
      border-left-color: var(--blue);
      background: #14213a;
    }

    .step-head {
      min-height: 46px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 18px;
      gap: 9px;
      align-items: center;
      color: var(--muted);
    }

    .step-icon {
      color: var(--blue);
      display: grid;
      place-items: center;
    }

    .step-icon svg {
      width: 17px;
      height: 17px;
    }

    .step-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font: 500 14px/1.45 var(--font-mono);
      cursor: pointer;
    }

    .chevron {
      color: var(--muted-2);
      font-size: 22px;
      line-height: 1;
    }

    .step-lines {
      border-top: 1px solid var(--line);
      padding: 8px 12px 10px 38px;
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .step-line {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) 18px;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--blue);
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.55);
      justify-self: center;
    }

    .line-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- 子代理集群 ---------- */

    .cluster-card {
      border: 1px solid var(--line);
      border-left: 3px solid var(--violet);
      border-radius: 12px;
      background: var(--panel);
      padding: 0;
      overflow: hidden;
      margin: 12px 0;
      box-shadow: var(--shadow-sm);
    }

    .cluster-head {
      min-height: 42px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    .cluster-head svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: var(--violet);
    }

    .cluster-grid {
      padding: 8px 10px 10px;
      display: grid;
      gap: 8px;
    }

    .cluster-cycle-group {
      display: grid;
      gap: 8px;
    }

    .cluster-cycle-group + .cluster-cycle-group {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      margin-top: 2px;
    }

    .cluster-cycle-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font: 500 12px/1.4 var(--font-mono);
      padding: 0 2px;
    }

    .cluster-cycle-summary {
      border-bottom: 1px solid var(--line);
      padding: 9px 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .cycle-chip {
      border: 1px solid var(--line-2);
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.55);
      color: var(--muted);
      padding: 3px 8px;
      font: 11px/1.4 var(--font-mono);
    }

    .cycle-chip.current {
      border-color: rgba(34, 197, 94, 0.45);
      background: rgba(34, 197, 94, 0.1);
      color: #4ADE80;
    }

    .agent-card {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.45);
      padding: 11px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      gap: 10px;
      text-align: left;
      color: var(--text);
      transition: background 180ms ease, border-color 180ms ease, transform 160ms ease;
    }

    .agent-card:hover {
      background: var(--panel-2);
      border-color: var(--line-2);
      transform: translateY(-1px);
    }

    .agent-card.selected {
      background: rgba(167, 139, 250, 0.09);
      border-color: rgba(167, 139, 250, 0.5);
    }

    .agent-main {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .agent-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--text);
      font-size: 14px;
    }

    .face {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(167, 139, 250, 0.16);
      border: 1px solid rgba(167, 139, 250, 0.4);
      display: grid;
      place-items: center;
      color: #C4B5FD;
      font: 700 11px/1 var(--font-mono);
      flex: 0 0 auto;
    }

    .agent-name span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agent-task {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-left: 28px;
    }

    .agent-meta {
      padding-left: 28px;
      color: var(--muted-2);
      font-size: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .agent-index {
      justify-self: end;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .mini-bars {
      grid-column: 1 / -1;
      justify-self: end;
      display: grid;
      grid-template-columns: repeat(var(--progress-count, 24), 3px);
      gap: 2px;
      margin-top: -2px;
    }

    .mini-bars span {
      width: 3px;
      height: 3px;
      background: var(--line-2);
      border-radius: 1px;
      opacity: 1;
    }

    .mini-bars span.done {
      background: var(--green);
      box-shadow: 0 0 4px rgba(34, 197, 94, 0.6);
    }

    .mini-bars span.final {
      background: var(--blue);
      box-shadow: 0 0 4px rgba(56, 189, 248, 0.6);
    }

    .mini-bars span.failed {
      background: var(--red);
      box-shadow: 0 0 4px rgba(239, 68, 68, 0.6);
    }

    /* ---------- Composer ---------- */

    .composer {
      padding: 14px 24px 18px;
      background: linear-gradient(to top, var(--bg-0) 78%, rgba(11, 18, 32, 0));
    }

    .composer-inner {
      width: min(880px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 8px;
      box-shadow: var(--shadow);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .composer-inner:focus-within {
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 0 3px var(--ring), var(--shadow);
    }

    textarea {
      min-height: 42px;
      max-height: 130px;
      resize: vertical;
      border: 0;
      outline: none;
      padding: 9px 10px;
      color: var(--text);
      background: transparent;
      line-height: 1.5;
      font: inherit;
    }

    textarea:focus-visible { outline: none; }

    .controls {
      display: flex;
      align-items: end;
      gap: 7px;
      position: relative;
    }

    select, input {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg-1);
      color: var(--text);
      padding: 0 8px;
      font: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    select:focus, input:focus {
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 0 3px var(--ring);
    }

    input {
      width: 58px;
      font-family: var(--font-mono);
    }

    input::placeholder {
      color: var(--muted-2);
      font-family: var(--font-ui);
    }

    .btn {
      height: 36px;
      min-width: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 11px;
      font: inherit;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, box-shadow 180ms ease, transform 120ms ease;
    }

    .btn:hover:not(:disabled) {
      background: #26364f;
      border-color: var(--line-2);
      color: var(--text);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-primary {
      background: rgba(34, 197, 94, 0.14);
      color: #4ADE80;
      border-color: rgba(34, 197, 94, 0.45);
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      background: rgba(34, 197, 94, 0.22);
      border-color: rgba(34, 197, 94, 0.65);
      color: #86EFAC;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.22);
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    /* ---------- 高级参数（折叠） ---------- */

    .advanced {
      position: relative;
      margin-top: 0;
      border-top: 0;
      padding-top: 0;
    }

    .advanced summary {
      list-style: none;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .advanced summary::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 1.6px solid currentColor;
      border-bottom: 1.6px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      transition: transform 180ms ease;
    }

    .advanced[open] summary::after {
      transform: rotate(225deg) translateY(-1px);
    }

    .advanced summary::-webkit-details-marker {
      display: none;
    }

    .advanced summary:hover {
      background: #26364f;
      border-color: var(--line-2);
      color: var(--text);
    }

    .advanced[open] summary {
      background: #26364f;
      color: var(--text);
      border-color: var(--line-2);
    }

    .advanced-pop {
      position: absolute;
      right: 0;
      bottom: 46px;
      z-index: 40;
      width: min(380px, calc(100vw - 24px));
      border: 1px solid var(--line-2);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .advanced-pop label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .advanced-pop select, .advanced-pop input {
      width: 100%;
    }

    .advanced-pop input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--green);
    }

    .advanced-pop .toggle-label {
      min-height: 36px;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      grid-column: span 2;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .advanced-pop .settings-note {
      grid-column: span 2;
      border-top: 1px solid var(--line);
      padding-top: 8px;
      color: var(--muted-2);
      font: 11px/1.5 var(--font-mono);
    }

    .advanced-pop .debug-only[hidden] {
      display: none;
    }

    /* ---------- 筛源视图 ---------- */

    .source-audit-summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(72px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .source-audit-stat {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 9px 10px;
    }

    .source-audit-stat strong,
    .source-audit-stat span {
      display: block;
    }

    .source-audit-stat strong {
      color: var(--text);
      font: 700 18px/1.1 var(--font-mono);
    }

    .source-audit-stat span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .source-audit-list {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .source-audit-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      border-top: 1px solid var(--line);
      padding-top: 9px;
    }

    .source-audit-item:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .source-audit-index {
      min-width: 28px;
      height: 24px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #7DD3FC;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: 600 11px/1 var(--font-mono);
    }

    .source-audit-main {
      min-width: 0;
    }

    .source-audit-title {
      color: var(--text);
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .source-audit-url {
      display: block;
      margin-top: 3px;
      color: #7DD3FC;
      font: 11px/1.4 var(--font-mono);
      overflow-wrap: anywhere;
    }

    .source-audit-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .source-tag {
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: rgba(30, 41, 59, 0.55);
      color: var(--muted);
      padding: 2px 6px;
      font: 500 10px/1.3 var(--font-mono);
    }

    .source-tag.high { border-color: rgba(34, 197, 94, 0.45); color: #4ADE80; background: rgba(34, 197, 94, 0.08); }
    .source-tag.selected { border-color: rgba(56, 189, 248, 0.45); color: #7DD3FC; background: rgba(56, 189, 248, 0.08); }
    .source-tag.fallback { border-color: rgba(245, 158, 11, 0.45); color: #FBBF24; background: rgba(245, 158, 11, 0.08); }
    .source-tag.demoted { border-color: rgba(239, 68, 68, 0.45); color: #F87171; background: rgba(239, 68, 68, 0.08); }

    .source-audit-reason {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    /* ---------- 右侧详情面板 ---------- */

    .side {
      height: 100vh;
      border-left: 1px solid var(--line);
      background: var(--bg-1);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      position: relative;
      min-width: 0;
      overflow: hidden;
    }

    .side-resizer {
      position: absolute;
      left: -6px;
      top: 0;
      bottom: 0;
      width: 12px;
      cursor: col-resize;
      z-index: 5;
    }

    .side-resizer::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 2px;
      background: transparent;
      transition: background 160ms ease;
    }

    .side-resizer:hover::after,
    body.resizing-side .side-resizer::after {
      background: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.35);
    }

    .side-head {
      height: 56px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .side-head-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .side-head-actions .btn {
      height: 32px;
      padding: 0 9px;
      font-size: 12px;
    }

    .side-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: 700 13px/1.4 var(--font-mono);
      letter-spacing: 0.02em;
    }

    .side-body {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;
      overscroll-behavior: contain;
    }

    .app.side-collapsed .side {
      border-left-color: var(--line);
    }

    .app.side-collapsed .side-resizer,
    .app.side-collapsed .side-title,
    .app.side-collapsed .side-body,
    .app.side-collapsed #reportBtn,
    .app.side-collapsed #graphBtn,
    .app.side-collapsed #sourcesBtn,
    .app.side-collapsed #debugCopyBtn {
      display: none;
    }

    .app.side-collapsed .side-head {
      padding: 0;
      justify-content: center;
    }

    .detail-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }

    /* ---------- 图谱视图 ---------- */

    .graph-shell {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .graph-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 8px;
    }

    .graph-stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 9px 10px;
      display: grid;
      gap: 2px;
    }

    .graph-stat strong {
      font: 700 18px/1.2 var(--font-mono);
      color: var(--text);
    }

    .graph-stat span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .graph-toolbar {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 10px;
      display: grid;
      gap: 9px;
    }

    .graph-search {
      width: 100%;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-1);
    }

    .graph-filter-row,
    .graph-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .graph-filter {
      border: 1px solid var(--line-2);
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.55);
      color: var(--muted);
      padding: 5px 10px;
      font: 500 12px/1.3 var(--font-mono);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .graph-filter:hover {
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--text);
    }

    .graph-filter.active {
      color: #7DD3FC;
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.12);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--legend-color, #999);
      box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.12);
    }

    .legend-line {
      width: 18px;
      height: 2px;
      border-radius: 999px;
      background: var(--legend-color, #999);
      opacity: 0.75;
    }

    .graph-stage {
      border: 1px solid var(--line);
      border-radius: 12px;
      background-color: var(--bg-0);
      background-image: radial-gradient(circle, rgba(148, 163, 184, 0.13) 1px, transparent 1px);
      background-size: 22px 22px;
      overflow: hidden;
      min-height: 560px;
      max-height: 1120px;
      height: min(920px, calc(100vh - 170px));
      position: relative;
      touch-action: none;
    }

    .graph-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    .graph-svg:active {
      cursor: grabbing;
    }

    .graph-edge {
      fill: none;
      stroke: #475569;
      stroke-width: 1.25;
      opacity: 0.6;
      pointer-events: none;
    }

    .graph-edge.hierarchy {
      stroke: #38BDF8;
      stroke-width: 1.8;
      opacity: 0.8;
    }

    .graph-edge.task {
      stroke: #2DD4BF;
      stroke-width: 1.55;
      opacity: 0.75;
    }

    .graph-edge.reportlet {
      stroke: #FBBF24;
      stroke-width: 1.35;
      opacity: 0.72;
    }

    .graph-edge.writeback {
      stroke: #F59E0B;
      stroke-width: 1.2;
      stroke-dasharray: 2 5;
      opacity: 0.66;
    }

    .graph-edge.cites {
      stroke: #FBBF24;
      stroke-dasharray: 4 4;
      opacity: 0.62;
    }

    .graph-edge.supports {
      stroke: #22C55E;
    }

    .graph-edge.contradicts {
      stroke: #EF4444;
      stroke-width: 1.8;
    }

    .graph-edge.qualifies {
      stroke: #F59E0B;
      stroke-dasharray: 5 4;
    }

    .graph-edge.background {
      stroke: #64748B;
      stroke-dasharray: 3 5;
    }

    .graph-edge.gap {
      stroke: #EF4444;
      stroke-dasharray: 2 5;
    }

    .graph-node {
      cursor: pointer;
    }

    .graph-node circle {
      transition: stroke-width 180ms ease, filter 180ms ease, opacity 180ms ease;
    }

    .graph-node .node-core {
      fill: var(--panel-2);
      stroke: #64748B;
      stroke-width: 2;
    }

    .graph-node:hover .node-core,
    .graph-node.selected .node-core {
      stroke-width: 3.2;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.35));
    }

    .graph-node text {
      fill: #E2E8F0;
      font-size: 12px;
      pointer-events: none;
      stroke: rgba(11, 18, 32, 0.85);
      stroke-width: 3px;
      paint-order: stroke;
    }

    .graph-node .node-halo {
      fill: var(--node-stroke, #64748B);
      stroke: none;
      opacity: 0.12;
    }

    .graph-node .node-glint {
      fill: rgba(241, 245, 249, 0.5);
      stroke: none;
      opacity: 0.6;
      pointer-events: none;
    }

    .node-tooltip {
      opacity: 0;
      transition: opacity 160ms ease, transform 160ms ease;
      transform: translateY(4px);
      pointer-events: none;
    }

    .graph-node:hover .node-tooltip,
    .graph-node:focus .node-tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    .node-tooltip rect {
      fill: rgba(15, 23, 42, 0.96);
      stroke: var(--line-2);
      stroke-width: 1;
      filter: drop-shadow(0 10px 22px rgba(2, 6, 23, 0.6));
    }

    .graph-node .node-kicker {
      fill: var(--muted);
      font-size: 10px;
      letter-spacing: 0;
      stroke: none;
    }

    .graph-node .node-label {
      font-weight: 700;
    }

    .graph-node .node-meta {
      fill: var(--muted);
      font-size: 10px;
      stroke: none;
    }

    .graph-node.root .node-core {
      fill: var(--bg-0);
      stroke: #F1F5F9;
    }

    .graph-node.root .node-halo {
      fill: #F1F5F9;
      opacity: 0.14;
    }

    .graph-node.aspect .node-core { fill: rgba(56, 189, 248, 0.13); stroke: #38BDF8; }
    .graph-node.hypothesis .node-core { fill: rgba(167, 139, 250, 0.13); stroke: #A78BFA; }
    .graph-node.task .node-core { fill: rgba(45, 212, 191, 0.13); stroke: #2DD4BF; }
    .graph-node.internalReportTask .node-core { fill: rgba(52, 211, 153, 0.13); stroke: #34D399; }
    .graph-node.reportlet .node-core { fill: rgba(251, 191, 36, 0.13); stroke: #FBBF24; }
    .graph-node.knowledge .node-core { fill: rgba(34, 197, 94, 0.13); stroke: #22C55E; }
    .graph-node.gap .node-core { fill: rgba(239, 68, 68, 0.13); stroke: #EF4444; }

    .graph-svg[data-large-graph="true"] .graph-edge {
      stroke-width: 0.85;
      opacity: 0.42;
    }

    .graph-svg[data-large-graph="true"] .graph-edge.hierarchy {
      stroke-width: 1.25;
    }

    .graph-svg[data-large-graph="true"] .graph-node circle {
      stroke-width: 1.45;
      transition: none;
    }

    .graph-svg[data-large-graph="true"] .graph-node:hover circle,
    .graph-svg[data-large-graph="true"] .graph-node.selected circle {
      stroke-width: 2.4;
      filter: none;
    }

    .graph-inspector {
      display: grid;
      gap: 10px;
    }

    .graph-inspector-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font: 700 13px/1.4 var(--font-mono);
    }

    .graph-type-pill {
      border-radius: 999px;
      color: var(--node-stroke, var(--muted));
      border: 1px solid color-mix(in srgb, var(--node-stroke, #334155) 48%, transparent);
      background: color-mix(in srgb, var(--node-stroke, #334155) 12%, transparent);
      padding: 3px 9px;
      font: 600 11px/1.5 var(--font-mono);
      white-space: nowrap;
    }

    .graph-description {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      word-break: break-word;
    }

    .graph-list {
      display: grid;
      gap: 6px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }

    .graph-list-panel {
      padding: 0;
      overflow: hidden;
    }

    .graph-list-panel summary {
      list-style: none;
      min-height: 42px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text);
      cursor: pointer;
    }

    .graph-list-panel summary::-webkit-details-marker {
      display: none;
    }

    .graph-list-panel summary span {
      color: var(--muted);
      font-size: 12px;
    }

    .graph-list-panel .graph-list {
      border-top: 1px solid var(--line);
      padding: 8px;
    }

    .graph-list-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.45);
      padding: 8px;
      display: grid;
      gap: 3px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .graph-list-item:hover {
      border-color: var(--line-2);
      background: var(--panel-2);
    }

    .graph-list-item.selected {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.09);
    }

    .graph-list-item strong {
      font-size: 13px;
      color: var(--text);
    }

    .graph-list-item span {
      font-size: 12px;
      color: var(--muted);
    }

    /* ---------- 子代理详情 ---------- */

    .agent-hero {
      display: grid;
      gap: 10px;
    }

    .agent-hero-title {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font: 700 14px/1.4 var(--font-mono);
    }

    .agent-hero-title span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agent-summary {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      word-break: break-word;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid var(--line-2);
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.55);
      color: #CBD5E1;
      padding: 4px 9px;
      font: 500 11px/1.4 var(--font-mono);
    }

    .kv {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 7px 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .kv strong {
      color: var(--text);
      min-width: 0;
      word-break: break-word;
      font-weight: 600;
    }

    .agent-chat {
      display: grid;
      gap: 14px;
      padding-bottom: 8px;
    }

    .agent-chat-head {
      position: sticky;
      top: -14px;
      z-index: 2;
      background: linear-gradient(to bottom, var(--bg-1) 82%, rgba(15, 23, 42, 0));
      padding-top: 2px;
      padding-bottom: 8px;
    }

    .agent-chat-stream {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .agent-chat-message {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .agent-chat-message.user {
      grid-template-columns: minmax(0, 1fr) 30px;
    }

    .agent-chat-message.user .agent-chat-avatar {
      grid-column: 2;
    }

    .agent-chat-message.user .agent-chat-bubble {
      grid-column: 1;
      grid-row: 1;
      justify-self: end;
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .agent-chat-avatar {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.9), rgba(167, 139, 250, 0.9));
      color: #0B1220;
      font: 800 11px/1 var(--font-mono);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.24);
    }

    .agent-chat-avatar svg {
      width: 15px;
      height: 15px;
    }

    .agent-chat-message.tool .agent-chat-avatar {
      background: var(--panel-2);
      border: 1px solid var(--line-2);
      color: var(--muted);
      box-shadow: none;
    }

    .agent-chat-message.thinking .agent-chat-avatar {
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #FBBF24;
      box-shadow: none;
    }

    .agent-chat-message.error .agent-chat-avatar {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #F87171;
      box-shadow: none;
    }

    .agent-chat-bubble {
      min-width: 0;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 10px 12px;
      display: grid;
      gap: 8px;
    }

    .agent-chat-message.tool .agent-chat-bubble {
      background: rgba(30, 41, 59, 0.4);
      border-color: var(--line);
    }

    .agent-chat-message.thinking .agent-chat-bubble {
      background: rgba(245, 158, 11, 0.06);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .agent-chat-message.error .agent-chat-bubble {
      background: rgba(239, 68, 68, 0.07);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .agent-chat-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .agent-chat-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font: 700 12px/1.4 var(--font-mono);
    }

    .agent-chat-time {
      flex: 0 0 auto;
      color: var(--muted-2);
      font: 11px/1.4 var(--font-mono);
    }

    .agent-chat-text {
      margin: 0;
      color: #E2E8F0;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .agent-chat-detail {
      border-left: 2px solid rgba(34, 197, 94, 0.45);
      padding-left: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      word-break: break-word;
    }

    .agent-chat-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .agent-chat-action {
      border: 1px solid var(--line-2);
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.55);
      color: var(--muted);
      padding: 4px 9px;
      font: 500 12px/1.2 var(--font-mono);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .agent-chat-action:hover {
      border-color: rgba(56, 189, 248, 0.45);
      color: var(--text);
    }

    .agent-chat-action.selected {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.12);
      color: #7DD3FC;
    }

    .agent-chat-empty {
      border: 1px dashed var(--line-2);
      border-radius: 12px;
      background: rgba(17, 28, 46, 0.6);
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }

    .step-btn {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.45);
      color: var(--muted);
      padding: 9px 10px;
      text-align: left;
      margin-bottom: 7px;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .step-btn:hover {
      background: var(--panel-2);
      border-color: var(--line-2);
    }

    .step-btn.selected {
      background: rgba(56, 189, 248, 0.09);
      border-color: rgba(56, 189, 248, 0.55);
    }

    .step-btn strong {
      display: block;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .step-btn span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .step-list-card {
      padding: 0;
      overflow: hidden;
    }

    .section-head {
      min-height: 38px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text);
      font: 700 12px/1.4 var(--font-mono);
      letter-spacing: 0.02em;
    }

    .section-head span:last-child {
      color: var(--muted-2);
      font-weight: 500;
      font-size: 12px;
    }

    .step-list {
      padding: 10px 10px 4px;
    }

    .timeline-card {
      padding: 0;
      overflow: hidden;
      min-height: 180px;
    }

    .agent-timeline {
      padding: 8px 10px 12px;
      display: grid;
      gap: 8px;
      max-height: min(42vh, 520px);
      min-height: 132px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .timeline-item {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.45);
      color: var(--text);
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto;
      gap: 9px;
      padding: 9px 10px;
      text-align: left;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .timeline-item:hover {
      background: var(--panel-2);
      border-color: var(--line-2);
    }

    .timeline-item.selected {
      background: rgba(56, 189, 248, 0.09);
      border-color: rgba(56, 189, 248, 0.55);
    }

    .timeline-icon {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line-2);
      color: var(--blue);
      display: grid;
      place-items: center;
    }

    .timeline-icon svg {
      width: 15px;
      height: 15px;
    }

    .timeline-copy {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .timeline-title {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timeline-summary {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timeline-time {
      color: var(--muted-2);
      font: 11px/1.4 var(--font-mono);
      white-space: nowrap;
      padding-top: 2px;
    }

    .frame-card {
      display: grid;
      gap: 10px;
    }

    .frame-title {
      margin: 0 0 8px;
      font: 700 15px/1.4 var(--font-mono);
    }

    .frame-summary {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .detail-lines {
      display: grid;
      gap: 6px;
      margin: 2px 0;
    }

    .detail-line {
      border-left: 2px solid rgba(34, 197, 94, 0.45);
      padding-left: 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }

    .clip-note {
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.07);
      color: #FBBF24;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    .fold-panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(17, 28, 46, 0.6);
    }

    .fold-toggle {
      width: 100%;
      border: 0;
      background: rgba(30, 41, 59, 0.55);
      color: var(--text);
      min-height: 36px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      transition: background 160ms ease;
    }

    .fold-toggle:hover {
      background: var(--panel-2);
    }

    .fold-content {
      border-top: 1px solid var(--line);
      padding: 0 10px 10px;
    }

    .fold-content.collapsed {
      display: none;
    }

    pre {
      margin: 10px 0 0;
      max-height: none;
      overflow: visible;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg-0);
      padding: 12px;
      color: #CBD5E1;
      font: 12px/1.55 var(--font-mono);
    }

    /* ---------- 报告视图 ---------- */

    .report {
      color: #E2E8F0;
      display: grid;
      gap: 10px;
    }

    .report h1, .report h2, .report h3 {
      margin: 8px 0 2px;
      line-height: 1.25;
      font-family: var(--font-mono);
      color: var(--text);
    }

    .report h1 { font-size: 21px; }
    .report h2 { font-size: 17px; border-top: 1px solid var(--line); padding-top: 12px; }
    .report h3 { font-size: 15px; }
    .report p { margin: 0; }
    .report ul { margin: 0; padding-left: 18px; }
    .report a { color: var(--blue); }
    .report code {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg-0);
      padding: 1px 5px;
      font: 12px/1.5 var(--font-mono);
    }

    /* ---------- 历史 ---------- */

    .history-list {
      display: grid;
      gap: 8px;
    }

    .history-item {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      padding: 10px 11px;
      display: grid;
      gap: 7px;
      text-align: left;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .history-item:hover {
      background: var(--panel-2);
      border-color: var(--line-2);
    }

    .history-item.selected {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.55);
    }

    .history-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .history-prompt {
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .history-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      color: var(--muted-2);
      font: 11px/1.4 var(--font-mono);
    }

    .status-pill {
      border: 1px solid var(--line-2);
      border-radius: 999px;
      padding: 2px 8px;
      background: rgba(30, 41, 59, 0.55);
      color: var(--muted);
      font: 500 11px/1.5 var(--font-mono);
    }

    .status-pill.running,
    .status-pill.succeeded,
    .status-pill.completed,
    .status-pill.finished {
      color: #4ADE80;
      border-color: rgba(34, 197, 94, 0.45);
      background: rgba(34, 197, 94, 0.09);
    }

    .status-pill.loaded {
      color: #7DD3FC;
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.09);
    }

    .status-pill.failed,
    .status-pill.error {
      color: #F87171;
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.09);
    }

    .status-pill.interrupted,
    .status-pill.needs_human_review,
    .status-pill.cancelled {
      color: #FBBF24;
      border-color: rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.09);
    }

    /* ---------- 诊断 ---------- */

    .diagnostic-grid {
      display: grid;
      gap: 10px;
    }

    .diagnostic-item {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr);
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .diagnostic-item strong {
      color: var(--text);
      min-width: 0;
      word-break: break-word;
      font-weight: 600;
    }

    .empty {
      color: var(--muted-2);
      padding: 20px 14px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- 人工复核决策面板 ---------- */

    .hil-panel {
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-left: 3px solid var(--amber);
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(245, 158, 11, 0.08), rgba(245, 158, 11, 0.02) 42%),
        var(--panel);
      padding: 14px;
      display: grid;
      gap: 12px;
      box-shadow: 0 0 28px rgba(245, 158, 11, 0.09), var(--shadow-sm);
    }

    .hil-head {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #FBBF24;
      font: 700 14px/1.4 var(--font-mono);
      letter-spacing: 0.02em;
    }

    .hil-head svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .hil-head .status::before {
      animation: pulse-dot-amber 1.8s ease-out infinite;
    }

    .hil-summary {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      word-break: break-word;
    }

    .hil-question {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.55);
      padding: 12px;
      display: grid;
      gap: 9px;
    }

    .hil-q-head {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .hil-q-index {
      min-width: 24px;
      height: 22px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #FBBF24;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: 700 11px/1 var(--font-mono);
      padding: 0 6px;
    }

    .hil-q-title {
      min-width: 0;
      color: var(--text);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .hil-q-issue {
      margin-left: auto;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.55);
      color: var(--muted-2);
      padding: 2px 8px;
      font: 500 10px/1.5 var(--font-mono);
      white-space: nowrap;
    }

    .hil-q-text {
      margin: 0;
      color: #E2E8F0;
      line-height: 1.6;
      word-break: break-word;
    }

    .hil-q-why {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }

    .hil-q-options {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      display: grid;
      gap: 3px;
    }

    .hil-reco {
      display: inline-block;
      margin-left: 6px;
      border: 1px solid rgba(34, 197, 94, 0.45);
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.1);
      color: #4ADE80;
      padding: 1px 7px;
      font: 600 10px/1.5 var(--font-mono);
      white-space: nowrap;
    }

    .hil-q-reco-line {
      margin: 0;
      color: #4ADE80;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    .hil-q-controls {
      display: grid;
      gap: 7px;
      border-top: 1px solid var(--line);
      padding-top: 9px;
    }

    .hil-q-controls label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .hil-q-controls select {
      width: 100%;
    }

    .hil-panel textarea {
      width: 100%;
      min-height: 56px;
      max-height: 180px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg-1);
      color: var(--text);
      padding: 8px 10px;
      font: 13px/1.55 var(--font-ui);
      resize: vertical;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .hil-panel textarea:focus {
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .hil-panel textarea.hil-urls {
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .hil-action-hint {
      margin: 0;
      color: var(--muted-2);
      font: 11px/1.5 var(--font-mono);
    }

    .hil-urls-wrap[hidden] {
      display: none;
    }

    .hil-error {
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.09);
      color: #F87171;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    .hil-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hil-note {
      color: var(--muted-2);
      font: 11px/1.5 var(--font-mono);
    }

    /* ---------- 响应式 ---------- */

    @media (max-width: 1180px) {
      .app { grid-template-columns: 1fr; }
      .app.side-collapsed { grid-template-columns: 1fr; }
      .side {
        height: 540px;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .side-resizer { display: none; }
      .app.side-collapsed .side {
        height: 56px;
      }
      .app.side-collapsed .side-title,
      .app.side-collapsed #reportBtn,
      .app.side-collapsed #debugCopyBtn {
        display: block;
      }
      .app.side-collapsed .side-head {
        padding: 0 16px;
        justify-content: space-between;
      }
    }

    @media (max-width: 720px) {
      .topbar { padding: 0 12px; }
      .brand span { display: none; }
      .run-hint { display: none; }
      .scroll { padding: 8px 12px 24px; }
      .composer { padding: 12px; }
      .composer-inner { grid-template-columns: 1fr; }
      .controls { flex-wrap: wrap; align-items: center; }
      .advanced-pop { right: auto; left: 0; }
      .side-head { padding: 0 12px; gap: 8px; }
      .side-head-actions { gap: 5px; }
      .side-head-actions .btn { padding-left: 9px; padding-right: 9px; }
      #debugCopyBtn { display: none; }
      .source-audit-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .user-bubble { max-width: 100%; }
    }

    /* ---------- 动效降级 ---------- */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <main class="main">
      <header class="topbar">
        <div class="brand">
          <div class="orb">D</div>
          <span>DeepResearch</span>
        </div>
        <div class="top-actions">
          <span id="runHint" class="run-hint">未开始</span>
          <button id="historyBtn" class="btn" type="button">历史</button>
          <button id="diagnosticsBtn" class="btn" type="button">诊断</button>
          <span id="status" class="status" data-state="idle">空闲</span>
        </div>
      </header>

      <section id="scroll" class="scroll">
        <div id="messages" class="messages">
          <div class="empty">输入研究任务后，这里会像对话一样显示研究过程。</div>
        </div>
      </section>

      <form id="researchForm" class="composer">
        <div class="composer-inner">
          <textarea id="prompt" required>帮我做一份研究马克思主义在中国的发展路线的研究</textarea>
          <div class="controls">
            <details class="advanced">
              <summary>设置</summary>
              <div class="advanced-pop">
                <label>语言
                  <select id="language" title="输出语言">
                    <option value="zh-CN">中文</option>
                    <option value="en">英文</option>
                  </select>
                </label>
                <label>流模式
                  <select id="streamMode" title="流式显示模式">
                    <option value="transcript">对话输入输出</option>
                    <option value="full">完整事件</option>
                    <option value="steps">关键步骤</option>
                  </select>
                </label>
                <label>轮次上限
                  <input id="cycles" type="number" min="1" max="48" value="6" title="证据探索与修复轮次上限" />
                </label>
                <label>报告调用
                  <input id="reportCalls" type="number" min="1" max="300" value="96" title="报告写作调用上限" />
                </label>
                <label>代理目标步数
                  <input id="agentTargetSteps" type="number" min="4" max="200" value="24" title="证据子代理尽量在该步数内结束；硬上限为两倍" />
                </label>
                <label>网页目标读取
                  <input id="agentTargetFetchCalls" type="number" min="0" max="120" value="8" title="证据子代理尽量在该网页读取次数内结束；硬上限为两倍" />
                </label>
                <label>费用上限（USD）
                  <input id="maxEpisodeCostUsd" type="number" min="0.5" max="100" step="0.5" placeholder="不限" title="单次研究的模型与搜索估算费用上限；留空表示不设上限" />
                </label>
                <label>Token 上限
                  <input id="maxEpisodeTokens" type="number" min="100000" max="50000000" step="100000" placeholder="不限" title="单次研究累计 Token 上限；留空表示不设上限" />
                </label>
                <label>LLM 请求上限
                  <input id="maxLlmRequests" type="number" min="10" max="100000" step="10" placeholder="不限" title="单次研究模型请求上限；留空表示不设上限" />
                </label>
                <label class="toggle-label">人工复核
                  <input id="humanReview" type="checkbox" title="开启后，自动修复失败时由 AI 生成需要你决定和回答的问题；关闭时会在修复上限后自动降级或跳过" />
                </label>
                <label class="toggle-label">限量调试
                  <input id="debugSingleBranch" type="checkbox" title="限制报告树规模，降低调图和调 prompt 的成本" />
                </label>
                <label class="debug-only" hidden>调试方面数
                  <input id="debugMaxAspects" type="number" min="1" max="2" value="2" title="测试版最多创建 2 个报告方面" />
                </label>
                <label class="debug-only" hidden>每方面分支
                  <input id="debugMaxBranchesPerAspect" type="number" min="1" max="2" value="2" title="测试版每个方面最多创建 2 个报告子分支" />
                </label>
                <label class="debug-only" hidden>Agent总上限
                  <input id="debugMaxInitialAgentNodes" type="number" min="1" max="4" value="4" title="测试版每个报告分支对应 1 个 Agent，因此最多 4 个" />
                </label>
                <label class="debug-only" hidden>调试子任务数
                  <input id="debugMaxAgentNodeParts" type="number" min="1" max="8" value="2" title="每个 Agent 节点最多规划的报告任务数" />
                </label>
                <div class="settings-note">正式模式 · 费用不限 · Token 不限 · 请求不限</div>
              </div>
            </details>
            <button id="startBtn" class="btn btn-primary" type="submit">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5v14l11-7L8 5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              开始
            </button>
            <button id="cancelBtn" class="btn" type="button" disabled title="取消运行">
              <span class="sr-only">取消</span>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7h10v10H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </button>
            <button id="replayBtn" class="btn" type="button" disabled title="重放当前运行">
              <span class="sr-only">重放</span>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66M4 5v5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="resumeBtn" class="btn" type="button" disabled title="从 checkpoint 继续">
              继续
            </button>
          </div>
        </div>
      </form>
    </main>

    <aside class="side">
      <div id="sideResizer" class="side-resizer" title="拖拽调整详情宽度"></div>
      <header class="side-head">
        <div id="sideTitle" class="side-title">子代理详情</div>
        <div class="side-head-actions">
          <button id="debugCopyBtn" class="btn" type="button" disabled>复制诊断</button>
          <button id="sourcesBtn" class="btn" type="button" disabled>筛源</button>
          <button id="graphBtn" class="btn" type="button" disabled>图谱</button>
          <button id="reportBtn" class="btn" type="button" disabled>报告</button>
          <button id="sideToggle" class="btn" type="button" title="折叠详情">
            <span class="sr-only">切换详情面板</span>
            <svg id="sideToggleIcon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>
      <section id="sideBody" class="side-body">
        <div class="empty">点击子代理集群里的小卡，右侧会打开独立详情页。</div>
      </section>
    </aside>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const GRAPH_FORCE_NODE_LIMIT = 70;
    const GRAPH_FORCE_EDGE_LIMIT = 100;
    const GRAPH_LARGE_NODE_LIMIT = 180;
    const GRAPH_LARGE_EDGE_LIMIT = 260;
    const GRAPH_MAX_SIMULATION_FRAMES = 160;
    const state = {
      runId: "",
      runInfo: null,
      runHistory: [],
      result: null,
      promptText: "",
      frames: [],
      agents: new Map(),
      selectedAgentKey: "",
      selectedFrameId: "",
      reportMarkdown: "",
      evidenceIndex: [],
      selectedGraphNodeId: "",
      graphSearch: "",
      graphFilters: {
        report: true,
        task: true,
        reportlet: true,
        knowledge: true,
        gap: true,
      },
      graphNodeState: new Map(),
      graphSimulation: null,
      graphViewTransform: null,
      resumeCheckpointPath: "",
      hilDraft: { decisions: {}, error: "", submitting: false },
      currentCycleId: "",
      currentCycleTaskIds: [],
      dispatchCycles: [],
      mode: "agent",
      sideWidth: clampNumber(Number(localStorage.getItem("deepresearch.sideWidth")), 320, 720, 420),
      sideCollapsed: localStorage.getItem("deepresearch.sideCollapsed") === "true",
      sidePanels: {
        transcript: localStorage.getItem("deepresearch.panel.transcript") !== "false",
        raw: localStorage.getItem("deepresearch.panel.raw") === "true",
      },
      abortController: null,
      reader: null,
      cancelling: false,
      lastFrameAt: "",
    };

    async function apiFetch(input, init = {}) {
      const headers = new Headers(init.headers || {});
      const savedToken = sessionStorage.getItem("deepresearch.apiToken") || "";
      if (savedToken) headers.set("authorization", `Bearer ${savedToken}`);
      let response = await fetch(input, { ...init, headers });
      if (response.status !== 401) return response;

    async function readSse(reader) {
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split("\n\n");
        buffer = chunks.pop() || "";
        for (const chunk of chunks) handleSseChunk(chunk);
      }
      if (buffer.trim()) handleSseChunk(buffer);
    }

    function handleSseChunk(chunk) {
      if (!chunk.trim() || chunk.trim().startsWith(":")) return;
      const lines = chunk.split(/\r?\n/);
      const eventName = lines.find((line) => line.startsWith("event:"))?.slice(6).trim() || "message";
      const data = lines.filter((line) => line.startsWith("data:")).map((line) => line.slice(5).trimStart()).join("\n");
      if (!data) return;
      const payload = JSON.parse(data);
      if (eventName === "run") {
        state.runId = payload.runId || state.runId;
        state.runInfo = { ...(state.runInfo || {}), ...payload };
        state.resumeCheckpointPath = checkpointFromRun(state.runInfo);
        $("debugCopyBtn").disabled = !state.runId;
        setResumeButtonEnabled();
        renderRunHint();
        return;
      }
      if (eventName === "frame") {
        addFrame(payload.frame);
        return;
      }
      if (eventName === "result") {
        state.result = payload.result || null;
        state.runInfo = { ...(state.runInfo || {}), result: state.result, summary: payload.summary };
        state.resumeCheckpointPath = checkpointFromRun(state.runInfo);
        setStatus(state.result?.status || "succeeded");
        $("reportBtn").disabled = false;
        $("graphBtn").disabled = !state.frames.length;
        $("debugCopyBtn").disabled = !state.runId;
        setResumeButtonEnabled();
        loadHistory().catch(() => {});
        loadArtifacts().then(() => {
          state.mode = "report";
          render();
        }).catch(pushClientError);
        return;
      }
      if (eventName === "error") pushClientError(payload.error || payload);
    }

    function addFrame(frame) {
      if (!frame) return;
      const shouldFollow = isNearBottom($("scroll"));
      const nextAgentKey = agentKey(frame);
      state.frames.push(frame);
      $("graphBtn").disabled = false;
      setSourceButtonEnabled();
      state.lastFrameAt = frameTimestamp(frame) || state.lastFrameAt;
      updateCycleState(frame);
      upsertAgent(frame);
      if (!state.selectedFrameId || (shouldFollow && (!state.selectedAgentKey || state.selectedAgentKey === nextAgentKey))) {
        state.selectedFrameId = frameId(frame);
      }
      render();
      renderRunHint();
      if (shouldFollow) requestAnimationFrame(() => scrollToBottom($("scroll")));
    }

    function upsertAgent(frame) {
      const visual = frame.visual || {};
      const actor = visual.actor || {};
      const ui = visual.ui || {};
      const key = agentKey(frame);
      const current = state.agents.get(key) || {
        key,
        title: displayAgentTitle(actor.title || labelForLane(ui.lane || "system")),
        lane: ui.lane || "system",
        role: actor.role || "system",
        taskId: actor.taskId || "",
        reportNodeId: actor.reportNodeId || "",
        cycleId: "",
        frames: [],
        tools: 0,
        thinking: 0,
        issues: 0,
        maxSteps: 48,
        targetSteps: 24,
        completedSteps: 0,
        done: false,
        status: "running",
        last: "",
        lastAt: "",
      };
      current.frames.push(frame);
      current.lane = ui.lane || current.lane;
      current.title = displayAgentTitle(current.title);
      const cycleId = frameCycleId(frame);
      if (current.lane === "agent" && cycleId && (!current.cycleId || isAgentStartFrame(frame))) current.cycleId = cycleId;
      current.last = zhUiText(ui.summary || ui.title || frame.line || current.last);
      current.lastAt = frameTimestamp(frame) || current.lastAt;
      if (visual.kind === "tool_started") current.tools += 1;
      if (visual.kind === "agent_thinking") current.thinking += 1;
      if (visual.kind === "error" || ui.severity === "warning" || ui.severity === "error") current.issues += 1;
      current.maxSteps = inferMaxSteps(frame, current.maxSteps);
      current.targetSteps = inferTargetSteps(frame, current.targetSteps, current.maxSteps);
      current.completedSteps = Math.min(current.maxSteps, Math.max(current.completedSteps, actualAgentSteps(current)));
      if (isClusterAgent(current) && isAgentFinishedFrame(frame)) {
        current.done = true;
        current.status = "completed";
        current.completedSteps = Math.min(current.maxSteps, Math.max(1, actualAgentSteps(current)));
      }
      if (isClusterAgent(current) && isAgentFailedFrame(frame)) {
        current.done = true;
        current.status = "failed";
        current.completedSteps = Math.min(current.maxSteps, Math.max(1, actualAgentSteps(current)));
      }
      state.agents.set(key, current);
      if (!state.selectedAgentKey && current.lane === "agent") state.selectedAgentKey = key;
    }

    function frameCycleId(frame) {
      const payload = frame.event?.payload || frame.visual?.payload || {};
      const explicit = payload.cycleId || payload.cycle;
      if (explicit) return String(explicit).startsWith("C_") ? String(explicit) : `C_${String(explicit).padStart(3, "0")}`;
      const agentRunId = frame.agentRunId || frame.event?.agentRunId || frame.visual?.agentRunId || "";
      const match = String(agentRunId).match(/(?:^|_)(C_\d{3,})(?:_|$)/);
      if (match) return match[1];
      return state.currentCycleId || "";
    }

    function rebuildAgents() {
      state.agents.clear();
      state.currentCycleId = "";
      state.currentCycleTaskIds = [];
      state.dispatchCycles = [];
      state.frames.forEach((frame) => {
        updateCycleState(frame);
        upsertAgent(frame);
      });
    }

    function updateCycleState(frame) {
      const eventType = frame.event?.eventType || "";
      const payload = frame.event?.payload || frame.visual?.payload || {};
      if (eventType !== "dispatch_cycle_started") return;
      state.currentCycleId = String(payload.cycleId || payload.cycle || "");
      state.currentCycleTaskIds = Array.isArray(payload.queuedTaskIds)
        ? payload.queuedTaskIds.filter((taskId) => typeof taskId === "string" && taskId !== "T_root")
        : [];
      const existingIndex = state.dispatchCycles.findIndex((cycle) => cycle.cycleId === state.currentCycleId);
      const cycle = {
        cycleId: state.currentCycleId || `第 ${state.dispatchCycles.length + 1} 轮`,
        taskIds: state.currentCycleTaskIds,
        startedAt: frameTimestamp(frame),
      };
      if (existingIndex >= 0) state.dispatchCycles[existingIndex] = cycle;
      else state.dispatchCycles.push(cycle);
    }

    function renderMessages() {
      const parts = [];
      if (state.promptText) parts.push(`<div class="user-bubble">${escapeHtml(state.promptText)}</div>`);
      if (state.frames.length === 0 && !state.promptText) {
        $("messages").innerHTML = `<div class="empty">输入研究任务后，这里会像对话一样显示研究过程。</div>`;
        return;
      }

      const cluster = renderCluster();
      let clusterInserted = false;
      const visibleFrames = state.frames.filter(shouldShowFrameInMain);
      for (let i = 0; i < visibleFrames.length; i++) {
        const frame = visibleFrames[i];
        if (!clusterInserted && cluster && shouldInsertClusterBefore(frame, i)) {
          parts.push(cluster);
          clusterInserted = true;

        parts.push(renderFrame(frame));
      }
      if (!clusterInserted && cluster) parts.push(cluster);
      const reviewPanel = renderHumanReviewPanel();
      if (reviewPanel) parts.push(reviewPanel);
      $("messages").innerHTML = parts.join("");
      bindClicks($("messages"));
      bindHumanReviewPanel($("messages"));
