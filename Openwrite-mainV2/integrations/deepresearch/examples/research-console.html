    const HIL_ACTIONS = [
      { value: "continue_research", label: "补充材料继续研究", hint: "围绕该问题创建补充研究任务继续查证；可在下方每行一个提供参考 URL。" },
      { value: "downplay", label: "降级：不计入审计", hint: "保留内容但标记为降级，相关缺口不计入质量审计。" },
      { value: "omit", label: "删除该分支", hint: "从报告中移除该问题对应的分支。" },
      { value: "accept_risk", label: "接受风险继续", hint: "记录豁免，按现状继续完成报告。" },
    ];

    function hilActionMeta(value) {
      return HIL_ACTIONS.find((action) => action.value === value) || HIL_ACTIONS[3];
    }

    function currentHumanReview() {
      const review = state.result?.humanReview;
      if (!review || !Array.isArray(review.questions) || !review.questions.length) return null;
      const reviewing = $("status").dataset.state === "needs_human_review"
        || state.runInfo?.status === "needs_human_review"
        || state.result?.status === "needs_human_review";
      return reviewing ? review : null;
    }

    function renderHumanReviewPanel() {
      const review = currentHumanReview();
      if (!review) return "";
      const draft = state.hilDraft;
      const questions = review.questions.map((question, index) => {
        const d = draft.decisions[question.id] || {};
        const action = HIL_ACTIONS.some((item) => item.value === d.action) ? d.action : "accept_risk";
        const rationale = d.rationale ?? question.recommendedAnswer ?? "";
        const sourceUrls = d.sourceUrls ?? "";
        const recommended = String(question.recommendedAnswer || "").trim();
        let recommendedMatched = false;
        const optionsMarkup = Array.isArray(question.options) && question.options.length
          ? `<ol class="hil-q-options">${question.options.map((option) => {
              const isRecommended = recommended && String(option).trim() === recommended;
              if (isRecommended) recommendedMatched = true;
              return `<li>${escapeHtml(option)}${isRecommended ? `<span class="hil-reco">建议</span>` : ""}</li>`;
            }).join("")}</ol>`
          : "";
        return `<div class="hil-question" data-hil-question="${escapeAttr(question.id)}">
          <div class="hil-q-head">
            <span class="hil-q-index">Q${index + 1}</span>
            <span class="hil-q-title">${escapeHtml(question.title || question.id)}</span>
            ${question.issueCode ? `<span class="hil-q-issue">${escapeHtml(question.issueCode)}</span>` : ""}
          </div>
          <p class="hil-q-text">${escapeHtml(question.question || "")}</p>
          ${question.whyNeeded ? `<p class="hil-q-why">为什么需要你：${escapeHtml(question.whyNeeded)}</p>` : ""}
          ${optionsMarkup}
          ${recommended && !recommendedMatched ? `<p class="hil-q-reco-line">建议回答：${escapeHtml(recommended)}</p>` : ""}
          <div class="hil-q-controls">
            <label>决定
              <select data-hil-action="${escapeAttr(question.id)}">
                ${HIL_ACTIONS.map((item) => `<option value="${item.value}"${item.value === action ? " selected" : ""}>${escapeHtml(item.label)}</option>`).join("")}
              </select>
            </label>
            <p class="hil-action-hint" data-hil-hint="${escapeAttr(question.id)}">${escapeHtml(hilActionMeta(action).hint)}</p>
            <div class="hil-urls-wrap" data-hil-urls-wrap="${escapeAttr(question.id)}"${action === "continue_research" ? "" : " hidden"}>
              <label>参考 URL（每行一个，可选，最多 20 个）
                <textarea class="hil-urls" data-hil-urls="${escapeAttr(question.id)}" placeholder="https://example.com/source" spellcheck="false">${escapeHtml(sourceUrls)}</textarea>
              </label>
            </div>
            <label>决定理由（必填）
              <textarea data-hil-rationale="${escapeAttr(question.id)}" placeholder="说明你的决定理由">${escapeHtml(rationale)}</textarea>
            </label>
          </div>
        </div>`;
      }).join("");
      return `<div class="assistant-row">
        <div class="assistant-icon">H</div>
        <div class="assistant-message">
          <div class="hil-panel" data-hil-panel="true">
            <div class="hil-head">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4 2.8 20h18.4L12 4zm0 6v4.6m0 3.2v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>运行已暂停，等待你的决定（${review.questions.length} 个问题）</span>
              <span class="status" data-state="needs_human_review">阻塞中</span>
            </div>
            ${review.summary ? `<p class="hil-summary">${escapeHtml(review.summary)}</p>` : ""}
            ${questions}
            ${draft.error ? `<div class="hil-error">${escapeHtml(draft.error)}</div>` : ""}
            <div class="hil-foot">
              <button class="btn btn-primary" type="button" data-hil-submit="true"${draft.submitting ? " disabled" : ""}>${draft.submitting ? "提交中…" : "提交决定"}</button>
              <span class="hil-note">每题需填写理由；提交后会从 checkpoint 恢复并切换到新运行。</span>
            </div>
          </div>
        </div>
      </div>`;
    }

    function bindHumanReviewPanel(root) {
      const panel = root.querySelector("[data-hil-panel]");
      if (!panel) return;
      panel.querySelectorAll("[data-hil-action]").forEach((select) => {
        select.addEventListener("change", () => {
          const questionId = select.dataset.hilAction;
          const draft = state.hilDraft.decisions[questionId] || (state.hilDraft.decisions[questionId] = {});
          draft.action = select.value;
          const wrap = panel.querySelector(`[data-hil-urls-wrap="${CSS.escape(questionId)}"]`);
          if (wrap) wrap.hidden = select.value !== "continue_research";
          const hint = panel.querySelector(`[data-hil-hint="${CSS.escape(questionId)}"]`);
          if (hint) hint.textContent = hilActionMeta(select.value).hint;
        });
      });
      panel.querySelectorAll("[data-hil-rationale]").forEach((textarea) => {
        textarea.addEventListener("input", () => {
          const questionId = textarea.dataset.hilRationale;
          const draft = state.hilDraft.decisions[questionId] || (state.hilDraft.decisions[questionId] = {});
          draft.rationale = textarea.value;
        });
      });
      panel.querySelectorAll("[data-hil-urls]").forEach((textarea) => {
        textarea.addEventListener("input", () => {
          const questionId = textarea.dataset.hilUrls;
          const draft = state.hilDraft.decisions[questionId] || (state.hilDraft.decisions[questionId] = {});
          draft.sourceUrls = textarea.value;
        });
      });
      panel.querySelector("[data-hil-submit]")?.addEventListener("click", () => {
        submitHumanReviewDecisions().catch((err) => {
          state.hilDraft.submitting = false;
          state.hilDraft.error = `提交失败：${err?.message || err}`;
          renderMessages();
        });
      });
    }

    async function submitHumanReviewDecisions() {
      const review = currentHumanReview();
      if (!review || state.hilDraft.submitting) return;
      const decisions = [];
      for (const question of review.questions) {
        const d = state.hilDraft.decisions[question.id] || {};
        const action = HIL_ACTIONS.some((item) => item.value === d.action) ? d.action : "accept_risk";
        const rationale = String(d.rationale ?? question.recommendedAnswer ?? "").trim();
        if (!rationale) {
          state.hilDraft.error = `请为问题「${question.title || question.id}」填写决定理由。`;
          renderMessages();
          return;
        }
        const decision = { questionId: question.id, action, rationale };
        if (action === "continue_research") {
          const urls = String(d.sourceUrls || "").split(/\n+/).map((url) => url.trim()).filter((url) => /^https?:\/\//i.test(url));
          if (urls.length) decision.sourceUrls = urls.slice(0, 20);
        }
        decisions.push(decision);
      }
      const checkpoint = state.resumeCheckpointPath || checkpointFromRun(state.runInfo);
      if (!checkpoint) {
        state.hilDraft.error = "缺少 checkpoint，无法提交决定。";
        renderMessages();
        return;
      }
      state.hilDraft.submitting = true;
      state.hilDraft.error = "";
      renderMessages();

      const body = {
        prompt: state.promptText || $("prompt").value.trim() || "继续历史研究",
        resumeCheckpointPath: checkpoint,
        humanReviewResponse: { submittedBy: "console-user", decisions },
        language: $("language").value,
        maxCycles: resumeMaxCycles(),
        completionRepairCycles: 0,
        reportMaxCalls: Number($("reportCalls").value),
        evidenceTargetSteps: Number($("agentTargetSteps").value),
        evidenceTargetFetchCalls: Number($("agentTargetFetchCalls").value),
        maxEpisodeCostUsd: $("maxEpisodeCostUsd").value ? Number($("maxEpisodeCostUsd").value) : undefined,
        maxEpisodeTokens: $("maxEpisodeTokens").value ? Number($("maxEpisodeTokens").value) : undefined,
        maxLlmRequests: $("maxLlmRequests").value ? Number($("maxLlmRequests").value) : undefined,
        adaptiveBudget: true,
        humanReview: $("humanReview").checked,
        debugSingleBranch: $("debugSingleBranch").checked,
        debugMaxAspects: $("debugSingleBranch").checked ? Number($("debugMaxAspects").value) : undefined,
        debugMaxBranchesPerAspect: $("debugSingleBranch").checked ? Number($("debugMaxBranchesPerAspect").value) : undefined,
        debugMaxInitialAgentNodes: $("debugSingleBranch").checked ? Number($("debugMaxInitialAgentNodes").value) : undefined,
        debugMaxAgentNodeParts: $("debugSingleBranch").checked ? Number($("debugMaxAgentNodeParts").value) : undefined,
        traceLevel: "full",
        streamMode: $("streamMode").value,
        streamMaxChars: 80000,
      };

      let response;
      try {
        response = await apiFetch("/research", {
          method: "POST",
          headers: { "content-type": "application/json", accept: "text/event-stream" },
          body: JSON.stringify(body),
        });
      } catch (err) {
        state.hilDraft.submitting = false;
        state.hilDraft.error = `提交失败：${err?.message || err}`;
        renderMessages();
        return;
      }
      if (!response.ok || !response.body) {
        const text = await response.text().catch(() => "");
        state.hilDraft.submitting = false;
        state.hilDraft.error = `提交失败（HTTP ${response.status}）：${oneLine(text, 260)}`;
        renderMessages();
        return;
      }

      const keepPrompt = state.promptText;
      resetRun();
      state.promptText = keepPrompt;
      setStatus("running");
      $("startBtn").disabled = true;
      $("cancelBtn").disabled = false;
      $("replayBtn").disabled = true;
      $("resumeBtn").disabled = true;
      $("reportBtn").disabled = true;
      $("graphBtn").disabled = true;
      $("debugCopyBtn").disabled = true;
      render();
      state.abortController = new AbortController();
      try {
        state.reader = response.body.getReader();
        await readSse(state.reader);
      } catch (err) {
        if (!state.cancelling) pushClientError(err);
      } finally {
        state.reader = null;
        state.abortController = null;
        $("startBtn").disabled = false;
        $("cancelBtn").disabled = true;
        $("replayBtn").disabled = !state.runId;
        setResumeButtonEnabled();
        $("debugCopyBtn").disabled = !state.runId;
        $("graphBtn").disabled = !state.frames.length;
        setSourceButtonEnabled();
        loadHistory().catch(() => {});
        if ($("status").dataset.state === "running") setStatus(state.result?.status || "finished");
      }
    }

    function shouldShowFrameInMain(frame) {
      const eventType = frame.event?.eventType || "";
      const kind = frame.visual?.kind || "";
      const lane = frame.visual?.ui?.lane || "";
      if (eventType === "cycle_reflection_parse_repair" || eventType === "structure_review_parse_repair") return false;
      if (eventType === "full.fetch.error") return false;
      if (lane === "agent" && kind !== "error") return false;
      if (kind === "tool_finished") return false;
      if (lane === "system" && kind !== "error" && kind !== "artifact_ready") return false;
      return true;
    }

    function shouldInsertClusterBefore(frame, index) {
      return index > 0 && (frame.visual?.ui?.lane === "agent" || frame.visual?.kind === "reflection_decision");
    }

    function renderFrame(frame) {
      const visual = frame.visual || {};
      const ui = visual.ui || {};
      const actor = visual.actor || {};
      const kind = visual.kind || frame.kind || "";
      const title = zhUiText(ui.title || frame.line || eventTypeLabel(frame.event?.eventType || "event"));
      const summary = zhUiText(ui.summary || frame.line || "");
      const lane = ui.lane || "";
      const card = false;
      const time = shortTime(frameTimestamp(frame));
      return `<div class="assistant-row">
        <button class="assistant-icon" type="button" data-agent-key="${escapeAttr(agentKey(frame))}" title="打开对应详情">${escapeHtml(initialsFor(displayAgentTitle(actor.title || labelForLane(ui.lane) || "代理")))}</button>
        <div class="assistant-message">
          ${card ? renderStepCard(frame, title, summary) : `<p class="message-text">${escapeHtml(summary || title)}</p>`}
          <div class="message-meta">${escapeHtml(time)} · ${escapeHtml(labelForLane(lane))}</div>
        </div>
      </div>`;
    }

    function renderStepCard(frame, title, summary) {
      const visual = frame.visual || {};
      const ui = visual.ui || {};
      return `<div class="step-card" data-frame-id="${escapeAttr(frameId(frame))}">
        <div class="step-head">
          <span class="step-icon">${iconSvg(visual.kind || frame.kind)}</span>
          <button type="button" class="step-title" data-frame-id="${escapeAttr(frameId(frame))}" style="border:0;background:transparent;text-align:left;padding:0">${escapeHtml(title)}</button>
          <span class="chevron">›</span>
        </div>
        <div class="step-lines">
          <div class="step-line"><span class="dot"></span><span class="line-text">${escapeHtml(summary || ui.lane || "")}</span><span class="chevron">›</span></div>
        </div>
      </div>`;
    }

    function renderCluster() {
      const allAgents = Array.from(state.agents.values()).filter(isClusterAgent);
      if (allAgents.length === 0) return "";
      const running = allAgents.filter((agent) => !agent.done).length;
      const currentCycle = state.dispatchCycles.at(-1);
      const firstCycle = state.dispatchCycles[0];
      const cycleLabel = currentCycle?.cycleId || state.currentCycleId || "当前批次";
      const initialCount = firstCycle?.taskIds?.length || allAgents.length;
      const cycleSummary = renderCycleSummary();
      const groups = buildAgentCycleGroups(allAgents);
      let globalIndex = 0;
      return `<div class="assistant-row">
        <div class="assistant-icon">A</div>
        <div class="assistant-message">
          <p class="message-text">子代理批次已创建。当前批次 <strong>${escapeHtml(cycleLabel)}</strong>；右侧列表保留本次运行全部 <strong>${allAgents.length} 个</strong> 子代理${running ? `，${running} 个进行中` : "，已全部结束"}。初始批次 ${initialCount} 个。</p>
          <div class="cluster-card">
            <div class="cluster-head">${iconSvg("agent_started")} <span>子代理集群</span><span>｜累计 ${allAgents.length} 个任务</span></div>
            ${cycleSummary}
            <div class="cluster-grid">
              ${groups.map((group) => {
                const cards = group.agents.map((agent) => renderAgentCard(agent, globalIndex++)).join("");
                return `<div class="cluster-cycle-group">
                  <div class="cluster-cycle-title"><strong>${escapeHtml(group.label)}</strong><span>${group.agents.length} 个任务</span></div>
                  ${cards}
                </div>`;
              }).join("")}
            </div>
          </div>
        </div>
      </div>`;
    }

    function buildAgentCycleGroups(allAgents) {
      const byTaskId = new Map(allAgents.map((agent) => [agent.taskId, agent]));
      const seen = new Set();
      const groups = [];
      for (let i = 0; i < state.dispatchCycles.length; i++) {
        const cycle = state.dispatchCycles[i];
        let agents = allAgents.filter((agent) => agent.cycleId === cycle.cycleId);
        if (!agents.length) agents = (cycle.taskIds || []).map((taskId) => byTaskId.get(taskId)).filter(isClusterAgent);
        agents.forEach((agent) => seen.add(agent.taskId));
        if (agents.length) groups.push({ label: cycle.cycleId || `第 ${i + 1} 轮`, agents });
      }
      const uncategorized = allAgents.filter((agent) => !seen.has(agent.taskId));
      if (uncategorized.length) groups.push({ label: state.dispatchCycles.length ? "未归入批次" : "全部子代理", agents: uncategorized });
      return groups;
    }

    function renderCycleSummary() {
      if (!state.dispatchCycles.length) return "";
      const recent = state.dispatchCycles.slice(-8);
      return `<div class="cluster-cycle-summary">
        ${recent.map((cycle, index) => {
          const isCurrent = cycle.cycleId === state.currentCycleId || index === recent.length - 1;
          const label = cycle.cycleId || `第 ${index + 1} 轮`;
          return `<span class="cycle-chip${isCurrent ? " current" : ""}" title="${escapeAttr(cycle.taskIds.join(", "))}">${escapeHtml(label)}：${cycle.taskIds.length} 个</span>`;
        }).join("")}
        ${state.dispatchCycles.length > recent.length ? `<span class="cycle-chip">前面还有 ${state.dispatchCycles.length - recent.length} 轮</span>` : ""}
      </div>`;
    }

    function renderAgentCard(agent, index) {
      const bars = renderProgressDots(agent);
      return `<button class="agent-card${state.selectedAgentKey === agent.key ? " selected" : ""}" type="button" data-agent-key="${escapeAttr(agent.key)}">
        <div class="agent-main">
          <div class="agent-name"><span class="face">${escapeHtml(String(index + 1).padStart(2, "0"))}</span><span>${escapeHtml(displayAgentTitle(agent.title))}</span></div>
          <div class="agent-task">${escapeHtml(cleanAgentSummary(agent.last || agent.taskId || "等待输出"))}</div>
          <div class="agent-meta"><span>${agent.completedSteps} 步 / 上限 ${agent.maxSteps}</span><span>目标 ${agent.targetSteps}</span><span>${agent.tools} 次工具</span><span>${agentStatusLabel(agent)}</span>${agent.lastAt ? `<span>${escapeHtml(shortTime(agent.lastAt))}</span>` : ""}</div>
        </div>
        <div class="agent-index">${escapeHtml(String(index + 1).padStart(2, "0"))}</div>
        <div class="mini-bars" style="--progress-count:${agent.maxSteps}">${bars}</div>
      </button>`;
    }

    function renderSide() {
      $("debugCopyBtn").disabled = !state.runId;
      if (state.mode === "report") {
        $("sideTitle").textContent = "报告";
        $("sideBody").innerHTML = state.reportMarkdown
          ? `<div class="detail-card"><strong>${state.evidenceIndex.length}</strong> 条引用</div><div class="detail-card report">${markdownToHtml(state.reportMarkdown)}</div>`
          : `<div class="empty">报告完成后显示。</div>`;
        return;
      }
      if (state.mode === "history") {
        $("sideTitle").textContent = "历史记录";
        $("sideBody").innerHTML = renderHistory();
        bindClicks($("sideBody"));
        return;
      }
      if (state.mode === "diagnostics") {
        $("sideTitle").textContent = "运行诊断";
        $("sideBody").innerHTML = renderDiagnostics();
        bindClicks($("sideBody"));
        return;
      }
      if (state.mode === "graph") {
        $("sideTitle").textContent = "研究图谱";
        $("sideBody").innerHTML = renderKnowledgeGraph();
        bindClicks($("sideBody"));
        requestAnimationFrame(initGraphSimulation);
        return;
      }
      if (state.mode === "sources") {
        $("sideTitle").textContent = "来源筛选审计";
        $("sideBody").innerHTML = renderSourceSelectionAudit();
        return;
      }
      const agent = state.agents.get(state.selectedAgentKey) || Array.from(state.agents.values()).find((item) => item.lane === "agent") || Array.from(state.agents.values())[0];
      if (!agent) {
        $("sideTitle").textContent = "子代理详情";
        $("sideBody").innerHTML = `<div class="empty">点击子代理集群里的小卡，右侧会打开独立详情页。</div>`;
        return;
      }
      $("sideTitle").textContent = displayAgentTitle(agent.title);
      const timeline = readableTimeline(agent);
      $("sideBody").innerHTML = renderAgentChat(agent, timeline);
      bindClicks($("sideBody"));
    }

    function renderSourceSelectionAudit() {
      const frames = sourceSelectionFrames();
      if (!frames.length) return `<div class="empty">初步探索完成候选筛选后，这里会显示筛选依据和最终选择。</div>`;
      return frames.slice().reverse().map((frame, frameIndex) => {
        const payload = frame.event?.payload || {};
        const candidates = Array.isArray(payload.candidates) ? payload.candidates : [];
        const high = new Set(debugNumberArray(payload.highConfidenceIndices));
        const fallback = new Set(debugNumberArray(payload.fallbackIndices));
        const demoted = new Set(debugNumberArray(payload.policyDemotedIndices));
        const selected = new Set(debugNumberArray(payload.selectedIndices));
        const selectedCandidates = candidates.filter((candidate) => selected.has(Number(candidate?.index)));
        const renderCandidate = (candidate) => {
          const index = Number(candidate?.index);
          const title = oneLine(candidate?.title || candidate?.url || `候选 ${index}`, 180);
          const url = safeExternalUrl(candidate?.url);
          const tags = [
            high.has(index) ? `<span class="source-tag high">高可信</span>` : "",
            fallback.has(index) ? `<span class="source-tag fallback">回退候选</span>` : "",
            demoted.has(index) ? `<span class="source-tag demoted">规则降级</span>` : "",
            selected.has(index) ? `<span class="source-tag selected">最终选择</span>` : "",
          ].filter(Boolean).join("");
          return `<div class="source-audit-item">
            <span class="source-audit-index">#${Number.isFinite(index) ? index : "-"}</span>
            <div class="source-audit-main">
              <div class="source-audit-title">${escapeHtml(title)}</div>
              ${url ? `<a class="source-audit-url" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(candidate.url)}</a>` : candidate?.url ? `<span class="source-audit-url">${escapeHtml(candidate.url)}</span>` : ""}
              ${tags ? `<div class="source-audit-tags">${tags}</div>` : ""}
            </div>
          </div>`;
        };
        return `<div class="detail-card">
          ${frames.length > 1 ? `<div class="section-head"><strong>筛选 ${frames.length - frameIndex}</strong><span>${escapeHtml(shortTime(frameTimestamp(frame)))}</span></div>` : ""}
          <div class="source-audit-summary">
            ${renderSourceAuditStat(payload.candidateCount ?? candidates.length, "候选")}
            ${renderSourceAuditStat(high.size, "高可信")}
            ${renderSourceAuditStat(fallback.size, "回退")}
            ${renderSourceAuditStat(demoted.size, "规则降级")}
            ${renderSourceAuditStat(selected.size, "最终选择")}
          </div>
          ${payload.reasoningSummary ? `<p class="source-audit-reason">${escapeHtml(payload.reasoningSummary)}</p>` : ""}
          <div class="source-audit-list">${selectedCandidates.length ? selectedCandidates.map(renderCandidate).join("") : `<div class="empty">这一轮没有记录最终选择的来源。</div>`}</div>
          <details class="fold-panel">
            <summary class="fold-toggle">全部候选（${candidates.length}）</summary>
            <div class="fold-content"><div class="source-audit-list">${candidates.map(renderCandidate).join("")}</div></div>
          </details>
        </div>`;
      }).join("");
    }

    function renderSourceAuditStat(value, label) {
      return `<div class="source-audit-stat"><strong>${Number(value) || 0}</strong><span>${escapeHtml(label)}</span></div>`;
    }

    function safeExternalUrl(value) {
      try {
        const url = new URL(String(value || ""));
        return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
      } catch {
        return "";
      }
    }

    function renderHistory() {
      if (!state.runHistory.length) {
        return `<div class="detail-card">还没有历史记录。运行一次研究后会显示在这里。</div>`;
      }
      return `<div class="history-list">
        ${state.runHistory.map((run) => `<button class="history-item${run.runId === state.runId ? " selected" : ""}" type="button" data-run-id="${escapeAttr(run.runId)}">
          <div class="history-top">
            <span class="status-pill ${escapeAttr(run.status || "")}">${escapeHtml(statusLabel(run.status))}</span>
            <span>${escapeHtml(formatDateTime(run.updatedAt || run.createdAt))}</span>
          </div>
          <div class="history-prompt">${escapeHtml(oneLine(run.prompt || "无标题任务", 180))}</div>
          <div class="history-meta">
            <span>${escapeHtml(run.runId)}</span>
            <span>${Number(run.counts?.frames || 0)} 帧</span>
            <span>${Number(run.counts?.events || 0)} 事件</span>
            ${checkpointFromRun(run) ? `<span>可继续</span>` : ""}
            <span>耗时 ${escapeHtml(durationBetween(run.createdAt, run.updatedAt))}</span>
          </div>
          ${run.lastFrame?.summary ? `<div class="agent-chat-detail">最后：${escapeHtml(oneLine(run.lastFrame.summary, 160))}</div>` : ""}
        </button>`).join("")}
      </div>`;
    }

      return `<div class="diagnostic-grid">

          <div class="chips">

          <div class="diagnostic-item"><span>时间</span><strong>${escapeHtml(diag.lastTime)}</strong></div>
          <div class="diagnostic-item"><span>摘要</span><strong>${escapeHtml(diag.lastSummary)}</strong></div>
          <div class="diagnostic-item"><span>事件类型</span><strong>${escapeHtml(diag.lastEventType)}</strong></div>

    }

      if (!state.selectedGraphNodeId || !graph.nodes.some((node) => node.id === state.selectedGraphNodeId)) {

        <div class="graph-toolbar">

            ${renderLegendDot("#0f9f8f", "Agent节点")}

            ${renderLegendLine("#b58b22", "回填合稿")}
