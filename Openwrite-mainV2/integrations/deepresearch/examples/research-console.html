    function buildResearchGraph() {
      const reportNodes = new Map();
      const taskNodes = new Map();
      const internalReportTaskNodes = new Map();
      const legacyPartTaskIndex = new Map();
      const reportletNodes = new Map();
      const knowledgeNodes = new Map();
      const evidenceLinks = new Map();
      const gaps = new Map();
      for (const frame of state.frames) {
        const eventType = frame.event?.eventType || "";
        const payload = frame.event?.payload || frame.visual?.payload || {};
        const meta = graphEventMeta(frame);
        if (eventType.includes("kg.") && (eventType.endsWith("upsertReportNode") || eventType.endsWith("updateReportNode"))) {
          const node = payload.node || payload.reportNode;
          if (node?.nodeId) mergeReportNode(reportNodes, node);
        }
        if (eventType === "report_node_draft_updated" && payload.reportNodeId) {
          mergeReportNode(reportNodes, {
            nodeId: payload.reportNodeId,
            nodeKind: "hypothesis",
            label: payload.reportNodeId,
            status: "partially_supported",
            coverage: {},
            draftSummary: payload.draftSummary || "",
          });
          for (const item of graphArray(payload.reportlets)) {
            const reportlet = normalizeGraphReportlet(item, payload.reportNodeId, meta);
            if (!reportlet.reportletId) continue;
            mergeGraphReportlet(reportletNodes, reportlet);
            if (reportlet.taskId && reportlet.plannedReportlet?.partId) {
              const parentTaskId = reportlet.plannedReportlet.parentAgentTaskId || reportlet.taskId;
              mergeInternalReportTask(internalReportTaskNodes, {
                id: internalReportTaskId(parentTaskId, reportlet.plannedReportlet.partId),
                parentTaskId,
                reportNodeId: reportlet.reportNodeId || meta.reportNodeId,
                partId: reportlet.plannedReportlet.partId,
                label: reportlet.plannedReportlet.expectedHeading || reportlet.title || "报告任务",
                summary: reportlet.plannedReportlet.researchQuestion || reportlet.markdown || "",
                searchGoal: reportlet.plannedReportlet.searchGoal || "",
                writingGoal: reportlet.plannedReportlet.writingGoal || "",
                evidenceNeeds: graphStringArray(reportlet.plannedReportlet.evidenceNeeds),
                status: "written",
                raw: reportlet.plannedReportlet,
              });
            }
            if (reportlet.taskId) {
              mergeGraphTask(taskNodes, {
                taskId: reportlet.taskId,
                reportNodeId: reportlet.reportNodeId || meta.reportNodeId,
                branchId: meta.branchId,
                title: reportlet.plannedReportlet?.expectedHeading || reportlet.title || `Agent节点 ${reportlet.taskId}`,
                status: "completed",
              });
            }
          }
        }
        if (eventType === "root_created" || eventType === "scout_started" || eventType === "scout_finished") {
          mergeGraphTask(taskNodes, {
            taskId: meta.taskId || "T_root",
            reportNodeId: meta.reportNodeId || "R_root",
            branchId: meta.branchId || "B_scout",
            title: eventType === "root_created" ? "根任务" : "初步探索",
            status: eventType === "scout_finished" ? "completed" : "running",
          });
        }
        if (eventType === "full.ledger.upsert") {
          const task = payload.task;
          if (task?.taskId) {
            if (isLegacyAtomicPartTask(task)) {
              mergeLegacyAtomicPartTask(taskNodes, internalReportTaskNodes, legacyPartTaskIndex, task, payload.parentTask);
            } else {
              mergeGraphTask(taskNodes, task);
            }
          }
        }
        if (eventType === "agent_node_parts_planned") {
          const parentTaskId = payload.originalTaskId || payload.taskId || meta.taskId;
          const reportNodeId = payload.reportNodeId || meta.reportNodeId;
          for (const part of graphArray(payload.parts)) {
            mergeInternalReportTask(internalReportTaskNodes, {
              id: internalReportTaskId(parentTaskId, part.partId),
              parentTaskId,
              reportNodeId,
              partId: part.partId || "",
              label: part.expectedHeading || part.researchQuestion || part.partId || "报告任务",
              summary: part.researchQuestion || part.writingGoal || part.searchGoal || "",
              searchGoal: part.searchGoal || "",
              writingGoal: part.writingGoal || "",
              evidenceNeeds: graphStringArray(part.evidenceNeeds),
              status: payload.mode === "internal_reportlet_plan" ? "planned" : "",
              raw: part,
            });
          }
        }
        if (eventType === "full.ledger.updateStatus") {
          const update = payload.update || payload;
          const taskId = update.taskId || payload.taskId || meta.taskId;
          if (taskId) {
            const internalId = legacyPartTaskIndex.get(taskId);
            if (internalId) {
              const existingInternalTask = internalReportTaskNodes.get(internalId) || {};
              mergeInternalReportTask(internalReportTaskNodes, {
                id: internalId,
                parentTaskId: existingInternalTask.parentTaskId || "",
                reportNodeId: meta.reportNodeId,
                status: update.newStatus || update.status || payload.status,
                summary: update.reason || payload.reason || "",
              });
            } else {
              mergeGraphTask(taskNodes, {
                taskId,
                reportNodeId: meta.reportNodeId,
                branchId: meta.branchId,
                status: update.newStatus || update.status || payload.status,
                statusReason: update.reason || payload.reason || "",
              });
            }
          }
        }
        if (eventType === "evidence_agent_started" || eventType === "evidence_agent_finished" || eventType === "evidence_agent_failed") {
          if (meta.taskId) {
            mergeGraphTask(taskNodes, {
              taskId: meta.taskId,
              reportNodeId: meta.reportNodeId,
              branchId: meta.branchId,
              title: `子代理 ${meta.taskId}`,
              status: eventType === "evidence_agent_started" ? "running" : eventType === "evidence_agent_failed" ? "failed" : "completed",
            });
          }
        }
        if (eventType === "main_planner_finished" && Array.isArray(payload.reportNodeIds)) {
          mergeReportNode(reportNodes, {
            nodeId: "R_root",
            nodeKind: "root",
            label: payload.titleHint || "报告根节点",
            parentNodeId: null,
            status: "planned",
            coverage: {},
          });
          let currentAspectId = "";
          for (const nodeId of payload.reportNodeIds.filter(Boolean)) {
            if (String(nodeId).startsWith("R_aspect_")) {
              currentAspectId = String(nodeId);
              mergeReportNode(reportNodes, {
                nodeId: currentAspectId,
                nodeKind: "aspect",
                label: currentAspectId,
                parentNodeId: "R_root",
                status: "planned",
                coverage: {},
              });
              continue;
            }
            if (String(nodeId).startsWith("R_hyp_")) {
              const inferredAspectId = currentAspectId || inferAspectIdForHypothesis(String(nodeId), reportNodes);
              mergeReportNode(reportNodes, {
                nodeId: String(nodeId),
                nodeKind: "hypothesis",
                label: String(nodeId),
                parentNodeId: inferredAspectId,
                status: "planned",
                coverage: {},
              });
            }
          }
        }
        if (eventType.includes("kg.") && (eventType.endsWith("upsertKnowledgeNode") || eventType.endsWith("reuseKnowledgeNode"))) {
          const node = payload.knowledge || payload.knowledgeNode || payload.node;
          if (node?.nodeId) {
            knowledgeNodes.set(node.nodeId, { ...knowledgeNodes.get(node.nodeId), ...node });
            const taskId = node.retrievedByTaskId || meta.taskId;
            if (taskId) {
              mergeGraphTask(taskNodes, {
                taskId,
                reportNodeId: meta.reportNodeId || node.reportNodeId || (taskId === "T_root" ? "R_root" : ""),
                branchId: meta.branchId || node.branchId,
                title: taskId === "T_root" ? "初步探索" : `探索任务 ${taskId}`,
                status: "observed",
              });
            }
          }
        }
        if (eventType.includes("kg.") && (eventType.endsWith("upsertEvidenceLink") || eventType.endsWith("updateEvidenceLink"))) {
          const link = payload.link || payload.evidenceLink;
          if (link?.linkId && link.reportNodeId && link.knowledgeNodeId) {
            evidenceLinks.set(link.linkId, { ...evidenceLinks.get(link.linkId), ...link });
            const taskId = link.createdByTaskId || meta.taskId;
            if (taskId) {
              mergeGraphTask(taskNodes, {
                taskId,
                reportNodeId: link.reportNodeId || meta.reportNodeId,
                branchId: meta.branchId || link.branchId,
                title: taskId === "T_root" ? "初步探索" : `探索任务 ${taskId}`,
                status: "observed",
              });
            }
          }
        }
        if (eventType.includes("kg.") && (eventType.endsWith("upsertReportlet") || eventType.endsWith("updateReportlet"))) {
          const reportlet = payload.reportlet;
          if (reportlet?.reportletId) {
            mergeGraphReportlet(reportletNodes, reportlet);
            if (reportlet.taskId && reportlet.plannedReportlet?.partId) {
              const parentTaskId = reportlet.plannedReportlet.parentAgentTaskId || reportlet.taskId;
              mergeInternalReportTask(internalReportTaskNodes, {
                id: internalReportTaskId(parentTaskId, reportlet.plannedReportlet.partId),
                parentTaskId,
                reportNodeId: reportlet.reportNodeId || meta.reportNodeId,
                partId: reportlet.plannedReportlet.partId,
                label: reportlet.plannedReportlet.expectedHeading || reportlet.title || "报告任务",
                summary: reportlet.plannedReportlet.researchQuestion || reportlet.markdown || "",
                searchGoal: reportlet.plannedReportlet.searchGoal || "",
                writingGoal: reportlet.plannedReportlet.writingGoal || "",
                evidenceNeeds: graphStringArray(reportlet.plannedReportlet.evidenceNeeds),
                status: "written",
                raw: reportlet.plannedReportlet,
              });
            }
            if (reportlet.taskId) {
              if (reportlet.plannedReportlet?.parentAgentTaskId && isLegacyAtomicPartTask({ taskId: reportlet.taskId, plannedReportlet: reportlet.plannedReportlet })) {
                legacyPartTaskIndex.set(reportlet.taskId, internalReportTaskId(reportlet.plannedReportlet.parentAgentTaskId, reportlet.plannedReportlet.partId));
              } else {
                mergeGraphTask(taskNodes, {
                  taskId: reportlet.taskId,
                  reportNodeId: reportlet.reportNodeId || meta.reportNodeId,
                  branchId: meta.branchId,
                  title: reportlet.plannedReportlet?.expectedHeading || reportlet.title || `Agent节点 ${reportlet.taskId}`,
                  status: "completed",
                });
              }
            }
          }
        }
        if (eventType.includes("kg.") && eventType.endsWith("addOpenGap")) {
          const gap = payload.gap || payload.openGap;
          const id = gap?.gapId || gap?.id || `${gap?.reportNodeId || "R_unknown"}_${gap?.taskId || "T_unknown"}_${gaps.size + 1}`;
          if (gap?.description) {
            gaps.set(id, { ...gap, gapId: id });
            const taskId = gap.taskId || meta.taskId;
            if (taskId) {
              mergeGraphTask(taskNodes, {
                taskId,
                reportNodeId: gap.reportNodeId || meta.reportNodeId,
                branchId: meta.branchId || gap.branchId,
                title: taskId === "T_root" ? "初步探索" : `探索任务 ${taskId}`,
                status: "observed",
              });
            }
          }
        }
        if (eventType.includes("kg.") && eventType.endsWith("closeOpenGaps")) {
          const reportNodeId = payload.reportNodeId;
          for (const [id, gap] of gaps.entries()) {
            if (reportNodeId && gap.reportNodeId !== reportNodeId) continue;
            gaps.set(id, {
              ...gap,
              status: "closed",
              closeReason: payload.reason || "缺口已由后续补证任务解决。",
            });
          }
        }
        if (eventType.includes("kg.") && (
          eventType.endsWith("acknowledgeOpenGaps")
          || eventType.endsWith("acknowledgeInfrastructureGaps")
          || eventType.endsWith("autoAcknowledgeResolvedGaps")
        )) {
          for (const match of acknowledgedGapMatches(payload)) {
            for (const [id, gap] of gaps.entries()) {
              if (!gapMatchesAcknowledgement(gap, match)) continue;
              gaps.set(id, {
                ...gap,
                status: "acknowledged",
                acknowledgeReason: match.reason || payload.reason || "该缺口已确认，不再触发补证。",
              });
            }
          }
        }
      }

      ensureReportHierarchy(reportNodes);

      for (const link of evidenceLinks.values()) {
        if (!knowledgeNodes.has(link.knowledgeNodeId)) {
          knowledgeNodes.set(link.knowledgeNodeId, {
            nodeId: link.knowledgeNodeId,
            title: link.knowledgeNodeId,
            summary: "该资料节点在证据关系中出现，但当前 trace 没有展开保存事件。",
          });
        }
      }
      for (const reportlet of reportletNodes.values()) {
        for (const knowledgeNodeId of graphStringArray(reportlet.citedKnowledgeNodeIds)) {
          if (!knowledgeNodes.has(knowledgeNodeId)) {
            knowledgeNodes.set(knowledgeNodeId, {
              nodeId: knowledgeNodeId,
              title: knowledgeNodeId,
              summary: "该资料节点被报告片段引用，但当前 trace 没有展开保存事件。",
            });
          }
        }
      }

      const mergedKnowledge = mergeGraphKnowledgeNodesBySource(Array.from(knowledgeNodes.values()));
      const remappedEvidenceLinks = Array.from(evidenceLinks.values()).map((link) => remapGraphEvidenceLink(link, mergedKnowledge.aliases));
      const visibleEvidenceLinks = mergeGraphEvidenceLinks(remappedEvidenceLinks.filter((link) => !isRootSystemEvidenceLink(link)));
      const hiddenEvidenceLinks = remappedEvidenceLinks.filter((link) => isRootSystemEvidenceLink(link));
      const visibleKnowledgeIds = new Set(visibleEvidenceLinks.map((link) => link.knowledgeNodeId));
      const remappedEvidenceById = new Map();
      for (const link of remappedEvidenceLinks) {
        if (link.linkId) remappedEvidenceById.set(link.linkId, link);
        for (const rawLink of link.rawLinks || []) {
          if (rawLink.linkId) remappedEvidenceById.set(rawLink.linkId, link);
        }
      }
      for (const reportlet of reportletNodes.values()) {
        for (const knowledgeNodeId of graphStringArray(reportlet.citedKnowledgeNodeIds)) {
          const canonicalId = mergedKnowledge.aliases.get(knowledgeNodeId) || knowledgeNodeId;
          if (canonicalId) visibleKnowledgeIds.add(canonicalId);
        }
        for (const linkId of graphStringArray(reportlet.citedEvidenceLinkIds)) {
          const linked = remappedEvidenceById.get(linkId);
          if (linked?.knowledgeNodeId) visibleKnowledgeIds.add(linked.knowledgeNodeId);
        }
      }
      const scoutKnowledgeIds = new Set([
        ...hiddenEvidenceLinks.filter((link) => isScoutEvidenceLink(link)).map((link) => link.knowledgeNodeId),
        ...Array.from(mergedKnowledge.nodes.values()).filter((node) => node.retrievedByTaskId === "T_root").map((node) => node.nodeId),
      ]);

      for (const link of visibleEvidenceLinks) {
        if (link.createdByTaskId) {
          mergeGraphTask(taskNodes, {
            taskId: link.createdByTaskId,
            reportNodeId: link.reportNodeId,
            branchId: link.branchId,
            title: link.createdByTaskId === "T_root" ? "初步探索" : `探索任务 ${link.createdByTaskId}`,
            status: "observed",
          });
        }
        if (!reportNodes.has(link.reportNodeId)) {
          mergeReportNode(reportNodes, {
            nodeId: link.reportNodeId,
            nodeKind: "hypothesis",
            label: link.reportNodeId,
            parentNodeId: inferAspectIdForHypothesis(link.reportNodeId, reportNodes),
            status: "unknown",
            coverage: {},
          });
        }
      }

      ensureReportHierarchy(reportNodes);
      ensureTaskReportLinks(taskNodes, reportNodes);

      const nodes = [];
      for (const node of reportNodes.values()) {
        const kind = node.nodeKind || (node.parentNodeId ? "hypothesis" : "root");
        nodes.push({
          id: node.nodeId,
          type: kind === "root" ? "root" : kind === "aspect" ? "aspect" : "hypothesis",
          group: "report",
          label: node.label || node.hypothesis?.statement || node.nodeId,
          summary: node.draftSummary || node.scopeNote || node.hypothesis?.researchBrief || node.hypothesis?.statement || "",
          parentId: node.parentNodeId || "",
          status: node.status || "",
          coverage: node.coverage || {},
          raw: node,
        });
      }
      for (const task of taskNodes.values()) {
        if (task.taskId === "T_root") continue;
        if (isLegacyAtomicPartTask(task)) continue;
        nodes.push({
          id: task.taskId,
          type: "task",
          group: "task",
          label: task.title || task.objective || task.taskId,
          summary: task.objective || task.reason || task.statusReason || "",
          parentId: task.parentTaskId || task.reportNodeId || "",
          status: task.status || "",
          branchId: task.branchId || "",
          reportNodeId: task.reportNodeId || "",
          raw: task,
        });
      }
      for (const task of internalReportTaskNodes.values()) {
        nodes.push({
          id: task.id,
          type: "internalReportTask",
          group: "task",
          label: task.label || task.partId || task.id,
          summary: task.summary || task.writingGoal || task.searchGoal || "",
          parentId: task.parentTaskId || "",
          status: task.status || "",
          reportNodeId: task.reportNodeId || "",
          raw: task.raw || task,
        });
      }
      for (const reportlet of reportletNodes.values()) {
        const internalParentId = reportletInternalTaskId(reportlet);
        nodes.push({
          id: reportlet.reportletId,
          type: "reportlet",
          group: "reportlet",
          label: reportlet.plannedReportlet?.expectedHeading || reportlet.title || reportlet.reportletId,
          summary: reportlet.markdown || reportlet.reasoningSummary || "",
          parentId: internalParentId || reportlet.taskId || reportlet.reportNodeId || "",
          taskId: reportlet.taskId || "",
          reportNodeId: reportlet.reportNodeId || "",
          status: `${graphStringArray(reportlet.citedEvidenceLinkIds).length} 条证据 / ${graphStringArray(reportlet.citedKnowledgeNodeIds).length} 个资料`,
          raw: reportlet,
        });
      }
      for (const node of mergedKnowledge.nodes.values()) {
        if (!visibleKnowledgeIds.has(node.nodeId)) continue;
        nodes.push({
          id: node.nodeId,
          type: "knowledge",
          group: "knowledge",
          label: node.title || node.url || node.nodeId,
          summary: node.summary || node.snippet || node.description || "",
          url: node.url || node.canonicalUrl || "",
          status: node.sourceTier || node.quality || "",
          sourceNodeIds: node.sourceNodeIds || [node.nodeId],
          sourceKeys: node.sourceKeys || [],
          raw: node,
        });
      }
      for (const gap of gaps.values()) {
        if (!gap.reportNodeId) continue;
        if (!shouldShowGapNode(gap)) continue;
        const taskId = gap.taskId && taskNodes.has(gap.taskId) ? gap.taskId : "";
        nodes.push({
          id: `G_${shortHash(`${gap.reportNodeId}_${gap.gapType || ""}_${gap.description}`)}`,
          type: "gap",
          group: "gap",
          label: gap.gapType || "证据缺口",
          summary: gap.description || "",
          parentId: taskId || gap.reportNodeId,
          reportNodeId: gap.reportNodeId,
          taskId,
          status: gap.impact || gap.status || "",
          raw: gap,
        });
      }

      const edges = [];
      for (const node of reportNodes.values()) {
        if (node.parentNodeId && reportNodes.has(node.parentNodeId)) {
          edges.push({ id: `H_${node.parentNodeId}_${node.nodeId}`, source: node.parentNodeId, target: node.nodeId, type: "hierarchy", label: "包含", raw: node });
        }
      }
      for (const task of taskNodes.values()) {
        if (task.taskId === "T_root") continue;
        if (isLegacyAtomicPartTask(task)) continue;
        const reportNodeId = task.reportNodeId && reportNodes.has(task.reportNodeId) ? task.reportNodeId : "R_root";
        if (reportNodes.has(reportNodeId)) {
          edges.push({ id: `T_${reportNodeId}_${task.taskId}`, source: reportNodeId, target: task.taskId, type: "task", label: "派发Agent", raw: task });
        }
      }
      for (const task of internalReportTaskNodes.values()) {
        if (task.parentTaskId && taskNodes.has(task.parentTaskId)) {
          edges.push({ id: `IRT_${task.parentTaskId}_${task.id}`, source: task.parentTaskId, target: task.id, type: "task", label: "规划报告任务", raw: task });
        }
      }
      for (const reportlet of reportletNodes.values()) {
        const internalParentId = reportletInternalTaskId(reportlet);
        const parentId = internalParentId && internalReportTaskNodes.has(internalParentId)
          ? internalParentId
          : reportlet.taskId && taskNodes.has(reportlet.taskId)
          ? reportlet.taskId
          : reportlet.reportNodeId && reportNodes.has(reportlet.reportNodeId)
            ? reportlet.reportNodeId
            : "";
        if (parentId) {
          edges.push({ id: `RL_PARENT_${parentId}_${reportlet.reportletId}`, source: parentId, target: reportlet.reportletId, type: "reportlet", label: "写成片段", raw: reportlet });
        }
        if (reportlet.reportNodeId && reportNodes.has(reportlet.reportNodeId)) {
          edges.push({ id: `RL_WRITEBACK_${reportlet.reportletId}_${reportlet.reportNodeId}`, source: reportlet.reportletId, target: reportlet.reportNodeId, type: "writeback", label: "回填子分支", raw: reportlet });
        }
      }
      for (const link of visibleEvidenceLinks) {
        const source = link.createdByTaskId && taskNodes.has(link.createdByTaskId) ? link.createdByTaskId : link.reportNodeId;
        edges.push({
          id: link.linkId,
          source,
          target: link.knowledgeNodeId,
          type: link.relation || "supports",
          label: relationLabel(link.relation),
          confidence: Number(link.confidence) || 0,
          raw: link,
        });
      }
      for (const reportlet of reportletNodes.values()) {
        const linkedKnowledgeIds = new Set();
        for (const linkId of graphStringArray(reportlet.citedEvidenceLinkIds)) {
          const linked = remappedEvidenceById.get(linkId);
          if (linked?.knowledgeNodeId) linkedKnowledgeIds.add(linked.knowledgeNodeId);
        }
        for (const knowledgeNodeId of graphStringArray(reportlet.citedKnowledgeNodeIds)) {
          linkedKnowledgeIds.add(mergedKnowledge.aliases.get(knowledgeNodeId) || knowledgeNodeId);
        }
        for (const knowledgeNodeId of linkedKnowledgeIds) {
          if (!knowledgeNodeId || !mergedKnowledge.nodes.has(knowledgeNodeId)) continue;
          const alreadyLinked = edges.some((edge) => edge.source === reportlet.reportletId && edge.target === knowledgeNodeId);
          if (!alreadyLinked) {
            edges.push({ id: `RL_CITE_${reportlet.reportletId}_${knowledgeNodeId}`, source: reportlet.reportletId, target: knowledgeNodeId, type: "cites", label: "引用资料", raw: reportlet });
          }
        }
      }
      for (const node of nodes.filter((item) => item.type === "gap")) {
        if (node.parentId) edges.push({ id: `E_${node.id}`, source: node.parentId, target: node.id, type: "gap", label: "缺口", raw: node.raw });
      }

      return {
        nodes,
        edges: dedupeGraphEdges(edges),
        counts: {
          report: nodes.filter((node) => node.group === "report").length,
          task: nodes.filter((node) => node.type === "task").length,
          internalReportTask: nodes.filter((node) => node.type === "internalReportTask").length,
          reportlet: nodes.filter((node) => node.group === "reportlet").length,
          knowledge: nodes.filter((node) => node.group === "knowledge").length,
          duplicateSources: mergedKnowledge.duplicateSources,
          evidence: visibleEvidenceLinks.length,
          gap: nodes.filter((node) => node.group === "gap").length,
          scout: scoutKnowledgeIds.size,
          system: hiddenEvidenceLinks.filter((link) => !isScoutEvidenceLink(link)).length,
        },
      };
    }

    function mergeGraphKnowledgeNodesBySource(nodes) {
      const merged = new Map();
      const aliases = new Map();
      const keyToCanonicalId = new Map();
      let duplicateSources = 0;
      for (const node of nodes) {
        if (!node?.nodeId) continue;
        const keys = canonicalGraphSourceKeys(node);
        const canonicalId = keys.map((key) => keyToCanonicalId.get(key)).find(Boolean) || node.nodeId;
        const existing = merged.get(canonicalId);
        const next = mergeGraphKnowledgeNode(existing, node, canonicalId, keys);
        if (existing && node.nodeId !== canonicalId && !next.sourceNodeIds.includes(node.nodeId)) duplicateSources += 1;
        merged.set(canonicalId, next);
        aliases.set(node.nodeId, canonicalId);
        for (const sourceNodeId of next.sourceNodeIds) aliases.set(sourceNodeId, canonicalId);
        for (const key of next.sourceKeys) keyToCanonicalId.set(key, canonicalId);
      }
      duplicateSources = Array.from(merged.values()).reduce((sum, node) => sum + Math.max(0, (node.sourceNodeIds?.length || 1) - 1), 0);
      return { nodes: merged, aliases, duplicateSources };
    }

    function mergeGraphKnowledgeNode(existing, node, canonicalId, keys) {
      const existingSourceIds = Array.isArray(existing?.sourceNodeIds) ? existing.sourceNodeIds : [];
      const nodeSourceIds = Array.isArray(node.sourceNodeIds) ? node.sourceNodeIds : [];
      const existingKeys = Array.isArray(existing?.sourceKeys) ? existing.sourceKeys : [];
      const nodeAliases = graphStringArray(node.metadata?.aliases);
      const existingAliases = graphStringArray(existing?.metadata?.aliases);
      const metadata = {
        ...(existing?.metadata || {}),
        ...(node.metadata || {}),
        aliases: uniqueGraphStrings([...existingAliases, ...nodeAliases, existing?.url, node.url, existing?.canonicalUrl, node.canonicalUrl]),
      };
      return {
        ...(existing || {}),
        ...node,
        nodeId: canonicalId,
        title: preferGraphText(existing?.title, node.title, canonicalId),
        url: preferGraphUrl(existing?.url || existing?.canonicalUrl, node.url || node.canonicalUrl),
        canonicalUrl: preferGraphUrl(existing?.canonicalUrl || existing?.url, node.canonicalUrl || node.url),
        summary: preferLongerGraphText(existing?.summary, node.summary),
        snippet: preferLongerGraphText(existing?.snippet, node.snippet),
        description: preferLongerGraphText(existing?.description, node.description),
        sourceTier: preferGraphSourceTier(existing?.sourceTier, node.sourceTier),
        qualityScore: Math.max(Number(existing?.qualityScore) || 0, Number(node.qualityScore) || 0),
        metadata,
        sourceNodeIds: uniqueGraphStrings([...existingSourceIds, ...nodeSourceIds, existing?.nodeId, node.nodeId, canonicalId]),
        sourceKeys: uniqueGraphStrings([...existingKeys, ...keys]),
      };
    }

    function canonicalGraphSourceKeys(node) {
      const urls = uniqueGraphStrings([
        node.metadata?.canonicalUrl,
        node.canonicalUrl,
        node.url,
        ...graphStringArray(node.metadata?.aliases),
      ]).map(normalizeGraphSourceUrl).filter(Boolean);
      const keys = urls.map((url) => `url:${url}`);
      if (node.contentHash) keys.push(`hash:${String(node.contentHash).trim()}`);
      if (!keys.length) {
        const title = normalizeGraphTitle(node.title || node.label);
        if (title) keys.push(`title:${title}`);
      }
      if (!keys.length && node.nodeId) keys.push(`id:${node.nodeId}`);
      return uniqueGraphStrings(keys);
    }

    function normalizeGraphSourceUrl(value) {
      let raw = String(value || "").trim();
      if (!raw) return "";
      try {
        let parsed = new URL(raw);
        if (parsed.hostname.toLowerCase() === "r.jina.ai") {
          const unwrapped = decodeURIComponent(parsed.pathname.replace(/^\/+/, ""));
          if (/^https?:\/\//i.test(unwrapped)) {
            raw = unwrapped;
            parsed = new URL(raw);
          }
        }
        parsed.hash = "";
        for (const key of Array.from(parsed.searchParams.keys())) {
          const lower = key.toLowerCase();
          if (lower.startsWith("utm_") || ["spm", "from", "source", "share", "ref", "ref_src"].includes(lower)) {
            parsed.searchParams.delete(key);
          }
        }
        parsed.hostname = parsed.hostname.toLowerCase();
        if (parsed.pathname !== "/" && parsed.pathname.endsWith("/")) parsed.pathname = parsed.pathname.slice(0, -1);
        if (!parsed.searchParams.toString()) parsed.search = "";
        return parsed.toString();
      } catch {
        return raw.replace(/#.*$/, "").replace(/\s+/g, " ");
      }
    }

    function normalizeGraphTitle(value) {
      return String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
    }

    function graphStringArray(value) {
      return Array.isArray(value) ? value.filter((item) => typeof item === "string" && item.trim()) : [];
    }

    function graphArray(value) {
      return Array.isArray(value) ? value.filter((item) => item && typeof item === "object") : [];
    }

    function uniqueGraphStrings(values) {
      return Array.from(new Set(values.filter((value) => typeof value === "string" && value.trim()).map((value) => value.trim())));
    }

    function preferGraphText(a, b, fallback = "") {
      const left = String(a || "").trim();
      const right = String(b || "").trim();
      if (!left || left === fallback) return right || left || fallback;
      if (!right || right === fallback) return left;
      return right.length > left.length ? right : left;
    }

    function preferLongerGraphText(a, b) {
      const left = String(a || "").trim();
      const right = String(b || "").trim();
      return right.length > left.length ? right : left;
    }

    function preferGraphUrl(a, b) {
      const left = String(a || "").trim();
      const right = String(b || "").trim();
      const leftNormalized = normalizeGraphSourceUrl(left);
      const rightNormalized = normalizeGraphSourceUrl(right);
      if (!leftNormalized) return rightNormalized || right || left;
      if (!rightNormalized) return leftNormalized || left;
      return leftNormalized.length <= rightNormalized.length ? leftNormalized : rightNormalized;
    }

    function preferGraphSourceTier(a, b) {
      const rank = { primary: 4, official: 3, academic: 3, secondary: 2, tertiary: 1 };
      const left = String(a || "");
      const right = String(b || "");
      return (rank[right] || 0) > (rank[left] || 0) ? right : left || right;
    }

    function remapGraphEvidenceLink(link, aliases) {
      const canonicalKnowledgeNodeId = aliases.get(link.knowledgeNodeId) || link.knowledgeNodeId;
      if (canonicalKnowledgeNodeId === link.knowledgeNodeId) return link;
      return {
        ...link,
        sourceKnowledgeNodeId: link.knowledgeNodeId,
        knowledgeNodeId: canonicalKnowledgeNodeId,
      };
    }

    function mergeGraphEvidenceLinks(links) {
      const merged = new Map();
      for (const link of links) {
        const key = [link.createdByTaskId || link.reportNodeId, link.reportNodeId, link.knowledgeNodeId, link.relation || "supports"].join("::");
        const existing = merged.get(key);
        if (!existing) {
          merged.set(key, { ...link, rawLinks: [link] });
          continue;
        }
        existing.confidence = Math.max(Number(existing.confidence) || 0, Number(link.confidence) || 0);
        existing.claimText = preferLongerGraphText(existing.claimText, link.claimText);
        existing.rawLinks = [...(existing.rawLinks || []), link];
        existing.linkId = `E_${shortHash(key)}`;
      }
      return Array.from(merged.values());
    }

    function shouldShowGapNode(gap) {
      if (gap.status === "closed") return false;
      if (gap.status === "acknowledged" && gap.impact !== "high") return false;
      return true;
    }

    function acknowledgedGapMatches(payload) {
      const candidates = [
        payload.matches,
        payload.gaps,
        payload.skipReasons,
        payload.acknowledgedGaps,
      ].find(Array.isArray);
      return (candidates || []).map((item) => ({
        reportNodeId: item.reportNodeId || item.nodeId,
        description: item.description || item.gap || item.summary || "",
        reason: item.reason || "",
      })).filter((item) => item.description || item.reportNodeId);
    }

    function gapMatchesAcknowledgement(gap, match) {
      if (match.reportNodeId && gap.reportNodeId !== match.reportNodeId) return false;
      if (!match.description) return Boolean(match.reportNodeId);
      const gapText = String(gap.description || "");
      const matchText = String(match.description || "");
      return gapText === matchText || gapText.includes(matchText) || matchText.includes(gapText);
    }

    function mergeReportNode(reportNodes, node) {
      if (!node?.nodeId) return;
      const existing = reportNodes.get(node.nodeId) || {};
      reportNodes.set(node.nodeId, {
        ...existing,
        ...node,
        label: preferGraphText(existing.label, node.label, node.nodeId),
        parentNodeId: node.parentNodeId ?? existing.parentNodeId ?? "",
        nodeKind: node.nodeKind || existing.nodeKind,
        coverage: node.coverage || existing.coverage || {},
        draftSummary: preferLongerGraphText(existing.draftSummary, node.draftSummary),
        draftMarkdown: preferLongerGraphText(existing.draftMarkdown, node.draftMarkdown),
      });
    }

    function mergeGraphTask(taskNodes, task) {
      if (!task?.taskId) return;
      const existing = taskNodes.get(task.taskId) || {};
      const nextStatus = task.status || task.newStatus || existing.status || "";
      taskNodes.set(task.taskId, {
        ...existing,
        ...task,
        taskId: task.taskId,
        parentTaskId: existing.parentTaskId || task.parentTaskId || "",
        reportNodeId: existing.reportNodeId || task.reportNodeId || "",
        branchId: existing.branchId || task.branchId || "",
        title: preferGraphText(existing.title, task.title, task.taskId),
        objective: preferLongerGraphText(existing.objective, task.objective),
        reason: preferLongerGraphText(existing.reason, task.reason),
        statusReason: preferLongerGraphText(existing.statusReason, task.statusReason),
        status: nextStatus,
      });
    }

    function internalReportTaskId(parentTaskId, partId) {
      return `IRT_${shortHash(`${parentTaskId || "T_unknown"}_${partId || "P_unknown"}`)}`;
    }

    function reportletInternalTaskId(reportlet) {
      if (!reportlet?.plannedReportlet?.partId) return "";
      const parentTaskId = reportlet.plannedReportlet.parentAgentTaskId || reportlet.taskId || "";
      return parentTaskId ? internalReportTaskId(parentTaskId, reportlet.plannedReportlet.partId) : "";
    }

    function isLegacyAtomicPartTask(task) {
      return Boolean(task?.plannedReportlet || String(task?.taskId || "").startsWith("T_part_"));
    }

    function mergeLegacyAtomicPartTask(taskNodes, internalReportTaskNodes, legacyPartTaskIndex, task, parentTask) {
      if (!task?.taskId) return;
      if (parentTask?.taskId) mergeGraphTask(taskNodes, parentTask);
      const part = task.plannedReportlet || {};
      const parentTaskId = part.parentAgentTaskId || task.parentTaskId || parentTask?.taskId || "";
      const partId = part.partId || inferLegacyPartId(task.taskId, parentTaskId) || task.taskId;
      const id = internalReportTaskId(parentTaskId || task.taskId, partId);
      legacyPartTaskIndex.set(task.taskId, id);
      mergeInternalReportTask(internalReportTaskNodes, {
        id,
        parentTaskId,
        reportNodeId: task.reportNodeId || part.parentReportNodeId || parentTask?.reportNodeId || "",
        partId,
        label: part.expectedHeading || task.title || part.researchQuestion || "报告任务",
        summary: part.researchQuestion || task.objective || "",
        searchGoal: part.searchGoal || "",
        writingGoal: part.writingGoal || "",
        evidenceNeeds: graphStringArray(part.evidenceNeeds),
        status: task.status || "",
        raw: part.partId ? part : task,
      });
    }

    function inferLegacyPartId(taskId, parentTaskId = "") {
      const raw = String(taskId || "");
      const parentPrefix = parentTaskId ? `T_part_${parentTaskId}_` : "";
      const scoped = parentPrefix && raw.startsWith(parentPrefix) ? raw.slice(parentPrefix.length) : raw.replace(/^T_part_/, "");
      const match = scoped.match(/^(\d+)(?:__|_|$)/);
      return match ? `P_${match[1]}` : "";
    }

    function mergeInternalReportTask(nodes, task) {
      if (!task?.id) return;
      const existing = nodes.get(task.id) || {};
      nodes.set(task.id, {
        ...existing,
        ...task,
        id: task.id,
        parentTaskId: existing.parentTaskId || task.parentTaskId || "",
        reportNodeId: existing.reportNodeId || task.reportNodeId || "",
        partId: existing.partId || task.partId || "",
        label: preferGraphText(existing.label, task.label, task.id),
        summary: preferLongerGraphText(existing.summary, task.summary),
        searchGoal: preferLongerGraphText(existing.searchGoal, task.searchGoal),
        writingGoal: preferLongerGraphText(existing.writingGoal, task.writingGoal),
        evidenceNeeds: uniqueGraphStrings([
          ...graphStringArray(existing.evidenceNeeds),
          ...graphStringArray(task.evidenceNeeds),
        ]),
        status: task.status || existing.status || "",
        raw: task.raw || existing.raw || task,
      });
    }

    function mergeGraphReportlet(reportletNodes, reportlet) {
      if (!reportlet?.reportletId) return;
      const existing = reportletNodes.get(reportlet.reportletId) || {};
      reportletNodes.set(reportlet.reportletId, {
        ...existing,
        ...reportlet,
        title: preferGraphText(existing.title, reportlet.title || reportlet.plannedReportlet?.expectedHeading, reportlet.reportletId),
        markdown: preferLongerGraphText(existing.markdown, reportlet.markdown),
        reasoningSummary: preferLongerGraphText(existing.reasoningSummary, reportlet.reasoningSummary),
        citedEvidenceLinkIds: uniqueGraphStrings([
          ...graphStringArray(existing.citedEvidenceLinkIds),
          ...graphStringArray(reportlet.citedEvidenceLinkIds),
        ]),
        citedKnowledgeNodeIds: uniqueGraphStrings([
          ...graphStringArray(existing.citedKnowledgeNodeIds),
          ...graphStringArray(reportlet.citedKnowledgeNodeIds),
        ]),
      });
    }

    function normalizeGraphReportlet(reportlet, fallbackReportNodeId = "", meta = {}) {
      if (!reportlet || typeof reportlet !== "object") return {};
      return {
        ...reportlet,
        reportNodeId: reportlet.reportNodeId || fallbackReportNodeId || meta.reportNodeId || "",
        taskId: reportlet.taskId || meta.taskId || "",
        markdown: reportlet.markdown || reportlet.markdownPreview || "",
      };
    }

    function ensureTaskReportLinks(taskNodes, reportNodes) {
      for (const [taskId, task] of taskNodes.entries()) {
        let reportNodeId = task.reportNodeId;
        if (!reportNodeId || !reportNodes.has(reportNodeId)) {
          const parent = task.parentTaskId ? taskNodes.get(task.parentTaskId) : null;
          reportNodeId = parent?.reportNodeId || (taskId === "T_root" ? "R_root" : "");
        }
        if (!reportNodeId || !reportNodes.has(reportNodeId)) reportNodeId = "R_root";
        taskNodes.set(taskId, { ...task, reportNodeId });
      }
    }

    function graphEventMeta(frame) {
      const event = frame.event || {};
      const actor = frame.visual?.actor || {};
      return {
        taskId: event.taskId || actor.taskId || "",
        reportNodeId: event.reportNodeId || actor.reportNodeId || "",
        branchId: event.branchId || actor.branchId || "",
      };
    }

    function ensureReportHierarchy(reportNodes) {
      if (!reportNodes.has("R_root")) {
        mergeReportNode(reportNodes, {
          nodeId: "R_root",
          nodeKind: "root",
          label: "报告根节点",
          parentNodeId: null,
          status: "planned",
          coverage: {},
        });
      }
      const ordered = Array.from(reportNodes.values()).sort((a, b) => String(a.nodeId).localeCompare(String(b.nodeId), undefined, { numeric: true }));
      for (const node of ordered) {
        if (!node?.nodeId || node.nodeId === "R_root") continue;
        const existingParent = node.parentNodeId && reportNodes.has(node.parentNodeId) ? node.parentNodeId : "";
        if (existingParent) continue;
        const nodeKind = node.nodeKind || (String(node.nodeId).startsWith("R_aspect_") ? "aspect" : "hypothesis");
        const parentNodeId = nodeKind === "aspect" ? "R_root" : inferAspectIdForHypothesis(node.nodeId, reportNodes);
        reportNodes.set(node.nodeId, {
          ...node,
          nodeKind,
          parentNodeId: parentNodeId && reportNodes.has(parentNodeId) ? parentNodeId : "R_root",
        });
      }
    }

    function isScoutEvidenceLink(link) {
      return link?.reportNodeId === "R_root" && link.createdByTaskId === "T_root";
    }

    function isRootSystemEvidenceLink(link) {
      if (!link || link.reportNodeId !== "R_root") return false;
      const taskId = String(link.createdByTaskId || "");
      if (isScoutEvidenceLink(link)) return true;
      return /^T_(publish_repair|completion|completion_gap|reflect|repair)_/.test(taskId);
    }

    function inferAspectIdForHypothesis(nodeId, reportNodes) {
      const direct = String(nodeId || "").match(/^R_hyp_(\d+)$/);
      if (direct) {
        const sameIndexAspect = `R_aspect_${direct[1]}`;
        if (reportNodes.has(sameIndexAspect)) return sameIndexAspect;
      }
      const aspects = Array.from(reportNodes.values())
        .filter((node) => node.nodeKind === "aspect" || String(node.nodeId || "").startsWith("R_aspect_"))
        .sort((a, b) => String(a.nodeId).localeCompare(String(b.nodeId), undefined, { numeric: true }));
      return aspects[aspects.length - 1]?.nodeId || "R_root";
    }

    function filterResearchGraph(graph) {
      const filters = state.graphFilters;
      const query = state.graphSearch.trim().toLowerCase();
      const allowed = (node) => {
        if (node.group === "report") return filters.report;
        if (node.group === "task") return filters.task;
        if (node.group === "reportlet") return filters.reportlet;
        if (node.group === "knowledge") return filters.knowledge;
        if (node.group === "gap") return filters.gap;
        return true;
      };
      let keep = new Set(graph.nodes.filter(allowed).map((node) => node.id));
      if (query) {
        const matched = new Set(graph.nodes
          .filter(allowed)
          .filter((node) => graphNodeText(node).toLowerCase().includes(query))
          .map((node) => node.id));
        keep = new Set(matched);
        for (const edge of graph.edges) {
          if (matched.has(edge.source)) keep.add(edge.target);
          if (matched.has(edge.target)) keep.add(edge.source);
        }
        keep = new Set(graph.nodes.filter((node) => allowed(node) && keep.has(node.id)).map((node) => node.id));
      }
      const nodes = graph.nodes.filter((node) => keep.has(node.id));
      const edges = graph.edges.filter((edge) => keep.has(edge.source) && keep.has(edge.target));
      return { ...graph, nodes, edges };
    }

    function layoutResearchGraph(graph) {
      const byId = new Map(graph.nodes.map((node) => [node.id, node]));
      const layout = layoutLayeredResearchGraph(graph, byId);
      if (shouldUseForceGraph(graph)) {
        return { ...layout, largeGraph: false, lockedLayout: false };
      }
      return layout;
    }

    function shouldUseForceGraph(graph) {
      return graph.nodes.length <= GRAPH_FORCE_NODE_LIMIT && graph.edges.length <= GRAPH_FORCE_EDGE_LIMIT;
    }

    function isLargeResearchGraph(graph) {
      return graph.nodes.length > GRAPH_LARGE_NODE_LIMIT || graph.edges.length > GRAPH_LARGE_EDGE_LIMIT;
    }

    function layoutLargeResearchGraph(graph, byId) {
      return layoutLayeredResearchGraph(graph, byId);
    }

    function layoutLayeredResearchGraph(graph, byId) {
      const reportNodes = graph.nodes.filter((node) => node.group === "report");
      const rootNodes = reportNodes.filter((node) => node.type === "root");
      const aspectNodes = reportNodes.filter((node) => node.type === "aspect");
      const hypothesisNodes = reportNodes.filter((node) => node.type === "hypothesis");
      const taskNodes = graph.nodes.filter((node) => node.group === "task");
      const agentTaskNodes = taskNodes.filter((node) => node.type === "task");
      const internalTaskNodes = taskNodes.filter((node) => node.type === "internalReportTask");
      const reportletNodes = graph.nodes.filter((node) => node.group === "reportlet");
      const knowledgeNodes = graph.nodes.filter((node) => node.group === "knowledge");
      const gapNodes = graph.nodes.filter((node) => node.group === "gap");
      const knowledgeRows = Math.max(1, Math.ceil(Math.sqrt(Math.max(1, knowledgeNodes.length) * 1.6)));
      const knowledgeCols = Math.max(1, Math.ceil(knowledgeNodes.length / knowledgeRows));
      const width = Math.max(1500, Math.min(5800, 1240 + knowledgeCols * 96));
      const height = Math.max(900, Math.min(3800, 760 + Math.max(aspectNodes.length, hypothesisNodes.length / 2, agentTaskNodes.length / 2, internalTaskNodes.length / 2, reportletNodes.length / 2, knowledgeRows) * 42));
      const positions = new Map();
      const degree = graphDegreeMap(graph.edges);
      const reportY = (index, total) => total <= 1 ? height / 2 : 90 + (index * (height - 180)) / Math.max(1, total - 1);
      const put = (node, x, y) => {
        const size = graphNodeSize(node, graph);
        positions.set(node.id, {
          ...size,
          x,
          y,
          vx: 0,
          vy: 0,
          fx: null,
          fy: null,
        });
      };

      rootNodes.forEach((node, index) => put(node, 90, reportY(index, rootNodes.length)));
      aspectNodes
        .sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }))
        .forEach((node, index) => put(node, 300, reportY(index, aspectNodes.length)));
      hypothesisNodes
        .sort((a, b) => {
          const parentCompare = String(a.parentId || "").localeCompare(String(b.parentId || ""), undefined, { numeric: true });
          return parentCompare || String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
        })
        .forEach((node, index) => put(node, 460, reportY(index, hypothesisNodes.length)));

      agentTaskNodes
        .sort((a, b) => {
          const reportCompare = String(a.reportNodeId || "").localeCompare(String(b.reportNodeId || ""), undefined, { numeric: true });
          const parentCompare = String(a.parentId || "").localeCompare(String(b.parentId || ""), undefined, { numeric: true });
          return reportCompare || parentCompare || String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
        })
        .forEach((node, index) => put(node, 650, reportY(index, agentTaskNodes.length)));

      internalTaskNodes
        .sort((a, b) => {
          const parentCompare = String(a.parentId || "").localeCompare(String(b.parentId || ""), undefined, { numeric: true });
          const reportCompare = String(a.reportNodeId || "").localeCompare(String(b.reportNodeId || ""), undefined, { numeric: true });
          return parentCompare || reportCompare || String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
        })
        .forEach((node, index) => put(node, 820, reportY(index, internalTaskNodes.length)));

      reportletNodes
        .sort((a, b) => {
          const taskCompare = String(a.taskId || "").localeCompare(String(b.taskId || ""), undefined, { numeric: true });
          const reportCompare = String(a.reportNodeId || "").localeCompare(String(b.reportNodeId || ""), undefined, { numeric: true });
          return taskCompare || reportCompare || String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
        })
        .forEach((node, index) => put(node, 990, reportY(index, reportletNodes.length)));

      knowledgeNodes
        .sort((a, b) => {
          const degreeCompare = (degree.get(b.id) || 0) - (degree.get(a.id) || 0);
          return degreeCompare || String(a.label || a.id).localeCompare(String(b.label || b.id), undefined, { numeric: true });
        })
        .forEach((node, index) => {
          const row = index % knowledgeRows;
          const col = Math.floor(index / knowledgeRows);
          const x = Math.min(width - 80, 1210 + col * 96);
          const y = reportY(row, knowledgeRows);
          put(node, x, y);
        });

      gapNodes
        .sort((a, b) => String(a.parentId || a.id).localeCompare(String(b.parentId || b.id), undefined, { numeric: true }))
        .forEach((node, index) => {
          const parent = positions.get(node.parentId);
          const offset = ((index % 5) - 2) * 28;
          put(node, parent ? parent.x + 90 : 660, parent ? parent.y + offset : reportY(index, gapNodes.length));
        });

      return { ...graph, byId, positions, width, height, largeGraph: isLargeResearchGraph(graph), lockedLayout: true };
    }

    function renderGraphSvg(layout) {
      const edgeMarkup = layout.edges.map((edge) => renderGraphEdge(edge, layout)).join("");
      const nodeMarkup = layout.nodes.map((node) => renderGraphNode(node, layout.positions.get(node.id), layout.largeGraph)).join("");
      return `<svg class="graph-svg" viewBox="0 0 ${layout.width} ${layout.height}" data-graph-width="${layout.width}" data-graph-height="${layout.height}" data-large-graph="${layout.largeGraph ? "true" : "false"}" data-locked-layout="${layout.lockedLayout ? "true" : "false"}" role="img" aria-label="报告节点、资料节点和证据关系图">
        ${layout.largeGraph ? "" : `<defs>${renderGraphGlowFilter()}</defs>`}
        <g class="graph-viewport">
          <g class="graph-links">${edgeMarkup}</g>
          <g class="graph-nodes">${nodeMarkup}</g>
        </g>
      </svg>`;
    }

    function renderGraphGlowFilter() {
      return `<filter id="graph-glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
        <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
      </filter>`;
    }

    function renderGraphEdge(edge, layout) {
      const source = layout.positions.get(edge.source);
      const target = layout.positions.get(edge.target);
      if (!source || !target) return "";
      const title = `${relationLabel(edge.type)}${edge.confidence ? ` · 置信度 ${edge.confidence.toFixed(2)}` : ""}`;
      const titleMarkup = layout.largeGraph ? "" : `<title>${escapeHtml(title)}</title>`;
      return `<line class="graph-edge ${escapeAttr(edge.type)}" data-graph-edge-id="${escapeAttr(edge.id)}" data-source-id="${escapeAttr(edge.source)}" data-target-id="${escapeAttr(edge.target)}" x1="${source.x}" y1="${source.y}" x2="${target.x}" y2="${target.y}">${titleMarkup}</line>`;
    }

    function renderGraphNode(node, pos, largeGraph = false) {
      if (!pos) return "";
      const cls = `${graphNodeClass(node.type)}${node.id === state.selectedGraphNodeId ? " selected" : ""}`;
      if (largeGraph) {
        return `<g class="graph-node ${escapeAttr(cls)}" tabindex="0" role="button" data-graph-node-id="${escapeAttr(node.id)}" transform="translate(${pos.x} ${pos.y})" aria-label="${escapeAttr(`${graphNodeTypeLabel(node.type)} ${node.label || node.id}`)}">
          <circle class="node-core" r="${pos.r}"></circle>
          <title>${escapeHtml(`${graphNodeTypeLabel(node.type)}\n${node.label || node.id}`)}</title>
        </g>`;
      }
      const lines = wrapGraphLabel(node.label || node.id, node.type === "knowledge" ? 18 : 20, 2);
      const tooltipWidth = Math.max(118, Math.min(230, Math.max(...lines.map((line) => line.length), graphNodeTypeLabel(node.type).length) * 12 + 26));
      const tooltipHeight = 46 + (lines.length - 1) * 14;
      const tooltipX = -tooltipWidth / 2;
      const tooltipY = -pos.r - tooltipHeight - 12;
      return `<g class="graph-node ${escapeAttr(cls)}" tabindex="0" role="button" data-graph-node-id="${escapeAttr(node.id)}" transform="translate(${pos.x} ${pos.y})" aria-label="${escapeAttr(`${graphNodeTypeLabel(node.type)} ${node.label || node.id}`)}">
          <circle class="node-halo" r="${pos.r + 9}"></circle>
          <circle class="node-core" r="${pos.r}" filter="url(#graph-glow)"></circle>
          <circle class="node-glint" cx="${(-pos.r * 0.28).toFixed(1)}" cy="${(-pos.r * 0.34).toFixed(1)}" r="${Math.max(2, pos.r * 0.22).toFixed(1)}"></circle>
          <g class="node-tooltip">
            <rect x="${tooltipX}" y="${tooltipY}" width="${tooltipWidth}" height="${tooltipHeight}" rx="8"></rect>
            <text class="node-kicker" x="0" y="${tooltipY + 16}" text-anchor="middle">${escapeHtml(graphNodeTypeLabel(node.type))}</text>
            ${lines.map((line, index) => `<text class="node-label" x="0" y="${tooltipY + 32 + index * 14}" text-anchor="middle">${escapeHtml(line)}</text>`).join("")}
          </g>
        <title>${escapeHtml(`${graphNodeTypeLabel(node.type)}\n${node.label || node.id}`)}</title>
      </g>`;
    }

    function initGraphSimulation() {
      stopGraphSimulation();
      if (state.mode !== "graph") return;
      const svg = $("sideBody").querySelector(".graph-svg");
      const viewport = svg?.querySelector(".graph-viewport");
      if (!svg || !viewport) return;
      const width = Number(svg.dataset.graphWidth) || 900;
      const height = Number(svg.dataset.graphHeight) || 560;
      const largeGraph = svg.dataset.largeGraph === "true";
      const lockedLayout = svg.dataset.lockedLayout === "true";
      const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
      const nodeEls = Array.from(svg.querySelectorAll(".graph-node"));
      const edgeEls = Array.from(svg.querySelectorAll(".graph-edge"));
      const nodes = nodeEls.map((el) => {
        const id = el.dataset.graphNodeId || "";
        const transform = String(el.getAttribute("transform") || "");
        const match = transform.match(/translate\(([-\d.]+)[ ,]([-\d.]+)\)/);
        const circle = el.querySelector(".node-core");
        return {
          id,
          el,
          r: Number(circle?.getAttribute("r")) || 10,
          x: Number(match?.[1]) || width / 2,
          y: Number(match?.[2]) || height / 2,
          vx: lockedLayout ? 0 : seededVelocity(id, "x"),
          vy: lockedLayout ? 0 : seededVelocity(id, "y"),
          fx: null,
          fy: null,
          pulse: (parseInt(shortHash(id).slice(0, 4), 16) || 1) / 65535,
        };
      }).filter((node) => node.id);
      const nodeById = new Map(nodes.map((node) => [node.id, node]));
      const links = edgeEls.map((el) => ({
        el,
        source: nodeById.get(el.dataset.sourceId || ""),
        target: nodeById.get(el.dataset.targetId || ""),
        type: Array.from(el.classList).find((cls) => ["hierarchy", "task", "reportlet", "writeback", "cites", "supports", "contradicts", "qualifies", "background", "gap"].includes(cls)) || "supports",
      })).filter((link) => link.source && link.target);
      if (!nodes.length) return;

      const savedTransform = state.graphViewTransform;
      let graphTransform = savedTransform && savedTransform.width === width && savedTransform.height === height
        ? { x: savedTransform.x, y: savedTransform.y, k: savedTransform.k }
        : fitGraphViewport(nodes, width, height, { padding: 92, minScale: 0.5, maxScale: largeGraph ? 1.15 : 2.8 });
      let draggingNode = null;
      let graphNodePointer = null;
      let panning = null;
      let frame = 0;

      const applyViewport = () => {
        viewport.setAttribute("transform", `translate(${graphTransform.x} ${graphTransform.y}) scale(${graphTransform.k})`);
      };

      // SVG 使用默认 preserveAspectRatio="xMidYMid meet"，viewBox 到元素像素存在
      // 缩放与上下/左右留白偏移；指针坐标必须按同一映射换算，否则缩放锚点会算错。
      const pointerToView = (event) => {
        const rect = svg.getBoundingClientRect();
        const scale = Math.min(rect.width / width, rect.height / height) || 1;
        const offsetX = (rect.width - width * scale) / 2;
        const offsetY = (rect.height - height * scale) / 2;
        return {
          x: (event.clientX - rect.left - offsetX) / scale,
          y: (event.clientY - rect.top - offsetY) / scale,
        };
      };

      const pointerToGraph = (event) => {
        const view = pointerToView(event);
        return {
          x: (view.x - graphTransform.x) / graphTransform.k,
          y: (view.y - graphTransform.y) / graphTransform.k,
        };
      };

      const onPointerMove = (event) => {
        if (draggingNode) {
          event.preventDefault();
          if (graphNodePointer && Math.hypot(event.clientX - graphNodePointer.clientX, event.clientY - graphNodePointer.clientY) > 4) {
            graphNodePointer.moved = true;
          }
          const p = pointerToGraph(event);
          draggingNode.fx = p.x;
          draggingNode.fy = p.y;
          draggingNode.x = p.x;
          draggingNode.y = p.y;
          draggingNode.vx *= 0.2;
          draggingNode.vy *= 0.2;
          updateGraphDom(nodes, links);
          return;
        }
        if (panning) {
          event.preventDefault();
          const rect = svg.getBoundingClientRect();
          const scale = Math.min(rect.width / width, rect.height / height) || 1;
          graphTransform.x = panning.x + (event.clientX - panning.clientX) / scale;
          graphTransform.y = panning.y + (event.clientY - panning.clientY) / scale;
          applyViewport();
        }
      };

      const onPointerUp = (event) => {
        const selectedNodeId = draggingNode && graphNodePointer && !graphNodePointer.moved
          ? graphNodePointer.nodeId
          : "";
        if (draggingNode) {
          draggingNode.fx = null;
          draggingNode.fy = null;
          draggingNode = null;
        }
        graphNodePointer = null;
        panning = null;
        if (state.graphSimulation?.pointerId !== undefined) {
          svg.releasePointerCapture?.(state.graphSimulation.pointerId);
          state.graphSimulation.pointerId = undefined;
        }
        if (selectedNodeId) {
          event.preventDefault();
          selectGraphNode(selectedNodeId, { scrollInspector: true });
        }
      };

      for (const node of nodes) {
        node.el.addEventListener("pointerenter", () => highlightGraphNeighborhood(node.id, nodes, links));
        node.el.addEventListener("pointerleave", () => resetGraphHighlight(nodes, links));
        if (!largeGraph && !lockedLayout) {
          node.el.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            event.stopPropagation();
            draggingNode = node;
            graphNodePointer = { nodeId: node.id, clientX: event.clientX, clientY: event.clientY, moved: false };
            const p = pointerToGraph(event);
            node.fx = p.x;
            node.fy = p.y;
            svg.setPointerCapture?.(event.pointerId);
            state.graphSimulation.pointerId = event.pointerId;
          });
        }
      }

      svg.addEventListener("pointerdown", (event) => {
        if (event.target.closest?.(".graph-node")) return;
        event.preventDefault();
        panning = { clientX: event.clientX, clientY: event.clientY, x: graphTransform.x, y: graphTransform.y };
        svg.setPointerCapture?.(event.pointerId);
        state.graphSimulation.pointerId = event.pointerId;
      });
      svg.addEventListener("pointermove", onPointerMove);
      svg.addEventListener("pointerup", onPointerUp);
      svg.addEventListener("pointercancel", onPointerUp);
      svg.addEventListener("wheel", (event) => {
        event.preventDefault();
        const p = pointerToGraph(event);
        const nextK = clampNumber(graphTransform.k * (event.deltaY > 0 ? 0.9 : 1.1), 0.35, 3.5, graphTransform.k);
        const view = pointerToView(event);
        graphTransform.k = nextK;
        graphTransform.x = view.x - p.x * nextK;
        graphTransform.y = view.y - p.y * nextK;
        applyViewport();
      }, { passive: false });

      state.graphSimulation = {
        stop: () => {
          svg.removeEventListener("pointermove", onPointerMove);
          svg.removeEventListener("pointerup", onPointerUp);
          svg.removeEventListener("pointercancel", onPointerUp);
          state.graphViewTransform = { x: graphTransform.x, y: graphTransform.y, k: graphTransform.k, width, height };
          if (!lockedLayout) {
            for (const node of nodes) {
              state.graphNodeState.set(node.id, { x: node.x, y: node.y, vx: node.vx, vy: node.vy });
            }
          }
        },
        pointerId: undefined,
      };
      applyViewport();
      if (largeGraph || reducedMotion || lockedLayout) {
        updateGraphDom(nodes, links);
      } else {
        // 逐帧力导动画会让靠左布局的节点（根、方面、假设）持续向右平移，表现为
        // “放大后画面不断漂移”；改为同步迭代到同一平衡态再绘制，画面保持静止。
        for (let step = 0; step < GRAPH_MAX_SIMULATION_FRAMES; step += 1) {
          frame += 1;
          stepGraphForces(nodes, links, width, height, frame, reducedMotion);
        }
        updateGraphDom(nodes, links);
      }
    }

    function fitGraphViewport(nodes, width, height, opts = {}) {
      if (!nodes.length) return { x: 0, y: 0, k: 1 };
      const padding = opts.padding ?? 80;
      const minScale = opts.minScale ?? 0.45;
      const maxScale = opts.maxScale ?? 2.4;
      const minX = Math.min(...nodes.map((node) => node.x - node.r));
      const maxX = Math.max(...nodes.map((node) => node.x + node.r));
      const minY = Math.min(...nodes.map((node) => node.y - node.r));
      const maxY = Math.max(...nodes.map((node) => node.y + node.r));
      const contentWidth = Math.max(1, maxX - minX);
      const contentHeight = Math.max(1, maxY - minY);
      const scaleX = (width - padding * 2) / contentWidth;
      const scaleY = (height - padding * 2) / contentHeight;
      const k = clampNumber(Math.min(scaleX, scaleY), minScale, maxScale, 1);
      const contentCenterX = (minX + maxX) / 2;
      const contentCenterY = (minY + maxY) / 2;
      return {
        x: width / 2 - contentCenterX * k,
        y: height / 2 - contentCenterY * k,
        k,
      };
    }

    function stopGraphSimulation() {
      if (state.graphSimulation?.stop) state.graphSimulation.stop();
      state.graphSimulation = null;
    }

    function stepGraphForces(nodes, links, width, height, frame, reducedMotion) {
      const centerX = width / 2;
      const centerY = height / 2;
      const linkDistance = (type) => type === "hierarchy" ? 110 : type === "task" ? 95 : type === "reportlet" ? 88 : type === "writeback" ? 112 : type === "cites" ? 132 : type === "gap" ? 86 : 145;
      const linkStrength = (type) => type === "hierarchy" ? 0.038 : type === "task" || type === "reportlet" ? 0.046 : type === "writeback" ? 0.030 : type === "contradicts" ? 0.022 : 0.018;
      for (const link of links) {
        const dx = link.target.x - link.source.x;
        const dy = link.target.y - link.source.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const force = (distance - linkDistance(link.type)) * linkStrength(link.type);
        const fx = (dx / distance) * force;
        const fy = (dy / distance) * force;
        if (link.source.fx === null) {
          link.source.vx += fx;
          link.source.vy += fy;
        }
        if (link.target.fx === null) {
          link.target.vx -= fx;
          link.target.vy -= fy;
        }
      }
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          const dx = b.x - a.x || 0.01;
          const dy = b.y - a.y || 0.01;
          const distanceSq = Math.max(36, dx * dx + dy * dy);
          const distance = Math.sqrt(distanceSq);
          const minDistance = a.r + b.r + 18;
          const charge = Math.min(1.25, 1600 / distanceSq);
          let force = -charge;
          if (distance < minDistance) force -= (minDistance - distance) * 0.025;
          const fx = (dx / distance) * force;
          const fy = (dy / distance) * force;
          if (a.fx === null) {
            a.vx += fx;
            a.vy += fy;
          }
          if (b.fx === null) {
            b.vx -= fx;
            b.vy -= fy;
          }
        }
      }
      for (const node of nodes) {
        if (node.fx !== null && node.fy !== null) {
          node.x = node.fx;
          node.y = node.fy;
          continue;
        }
        const wave = reducedMotion ? 0 : Math.sin(frame * 0.022 + node.pulse * Math.PI * 2) * 0.018;
        node.vx += (centerX - node.x) * 0.002 + wave;
        node.vy += (centerY - node.y) * 0.002 + Math.cos(frame * 0.019 + node.pulse * Math.PI * 2) * 0.014;
        node.vx *= reducedMotion ? 0.5 : 0.88;
        node.vy *= reducedMotion ? 0.5 : 0.88;
        node.x += node.vx;
        node.y += node.vy;
        const pad = node.r + 24;
        if (node.x < pad || node.x > width - pad) {
          node.x = clampNumber(node.x, pad, width - pad, centerX);
          node.vx *= -0.55;
        }
        if (node.y < pad || node.y > height - pad) {
          node.y = clampNumber(node.y, pad, height - pad, centerY);
          node.vy *= -0.55;
        }
      }
    }

    function updateGraphDom(nodes, links) {
      for (const link of links) {
        link.el.setAttribute("x1", link.source.x.toFixed(2));
        link.el.setAttribute("y1", link.source.y.toFixed(2));
        link.el.setAttribute("x2", link.target.x.toFixed(2));
        link.el.setAttribute("y2", link.target.y.toFixed(2));
      }
      for (const node of nodes) {
        node.el.setAttribute("transform", `translate(${node.x.toFixed(2)} ${node.y.toFixed(2)})`);
      }
    }

    function highlightGraphNeighborhood(nodeId, nodes, links) {
      const neighbors = new Set([nodeId]);
      for (const link of links) {
        if (link.source.id === nodeId) neighbors.add(link.target.id);
        if (link.target.id === nodeId) neighbors.add(link.source.id);
      }
      for (const link of links) {
        const active = link.source.id === nodeId || link.target.id === nodeId;
        link.el.style.opacity = active ? "0.92" : "0.08";
        link.el.style.strokeWidth = active ? "2.2" : "0.6";
      }
      for (const node of nodes) {
        node.el.style.opacity = neighbors.has(node.id) ? "1" : "0.18";
      }
    }

    function resetGraphHighlight(nodes, links) {
      for (const link of links) {
        link.el.style.opacity = "";
        link.el.style.strokeWidth = "";
      }
      for (const node of nodes) node.el.style.opacity = "";
    }

    function graphDegreeMap(edges) {
      const degree = new Map();
      for (const edge of edges) {
        degree.set(edge.source, (degree.get(edge.source) || 0) + 1);
        degree.set(edge.target, (degree.get(edge.target) || 0) + 1);
      }
      return degree;
    }

    function renderGraphInspector(node, graph) {
      const edges = graph.edges.filter((edge) => edge.source === node.id || edge.target === node.id);
      const style = graphTypeStyle(node.type);
      const sourceNodeIds = Array.isArray(node.sourceNodeIds) ? node.sourceNodeIds : [];
      return `<div class="detail-card graph-inspector" style="--node-fill:${style.fill};--node-stroke:${style.stroke}">
        <div class="graph-inspector-title">
          <span>${escapeHtml(node.label || node.id)}</span>
          <span class="graph-type-pill">${escapeHtml(graphNodeTypeLabel(node.type))}</span>
        </div>
        ${node.summary ? `<p class="graph-description">${escapeHtml(node.summary)}</p>` : ""}
        <div class="kv">
          <span>ID</span><strong>${escapeHtml(node.id)}</strong>
          <span>状态</span><strong>${escapeHtml(node.status || "-")}</strong>
          ${node.reportNodeId ? `<span>报告节点</span><strong>${escapeHtml(node.reportNodeId)}</strong>` : ""}
          ${node.branchId ? `<span>分支</span><strong>${escapeHtml(node.branchId)}</strong>` : ""}
          ${node.url ? `<span>URL</span><strong><a href="${escapeAttr(node.url)}" target="_blank" rel="noreferrer">${escapeHtml(oneLine(node.url, 120))}</a></strong>` : ""}
          ${sourceNodeIds.length > 1 ? `<span>合并来源</span><strong>${sourceNodeIds.length} 个资料节点</strong>` : ""}
          <span>连接</span><strong>${edges.length} 条</strong>
        </div>
        ${edges.length ? `<div class="detail-lines">${edges.slice(0, 14).map((edge) => renderGraphConnection(edge, node, graph)).join("")}</div>` : `<div class="empty">这个节点暂时没有可见连接。</div>`}
      </div>`;
    }

    function renderGraphConnection(edge, node, graph) {
      const otherId = edge.source === node.id ? edge.target : edge.source;
      const other = graph.nodes.find((item) => item.id === otherId);
      const label = other?.label || otherId;
      const confidence = edge.confidence ? `，置信度 ${edge.confidence.toFixed(2)}` : "";
      return `<button class="detail-line graph-list-item" type="button" data-graph-node-id="${escapeAttr(otherId)}">
        <strong>${escapeHtml(relationLabel(edge.type))} → ${escapeHtml(oneLine(label, 90))}</strong>
        <span>${escapeHtml(graphNodeTypeLabel(other?.type || ""))}${confidence}</span>
      </button>`;
    }

    function renderGraphFilter(key, label) {
      return `<button class="graph-filter${state.graphFilters[key] ? " active" : ""}" type="button" data-graph-filter="${escapeAttr(key)}">${escapeHtml(label)}</button>`;

    function renderLegendDot(color, label) {

    function renderLegendLine(color, label) {
      return `<span class="legend-item"><span class="legend-line" style="--legend-color:${escapeAttr(color)}"></span>${escapeHtml(label)}</span>`;

    function dedupeGraphEdges(edges) {
      const out = new Map();
      for (const edge of edges) out.set(edge.id || `${edge.source}_${edge.target}_${edge.type}`, edge);
      return Array.from(out.values());
    }

    function graphNodeText(node) {
      return [node.id, node.label, node.summary, node.url, node.status, node.branchId, node.reportNodeId, ...(node.sourceNodeIds || []), ...(node.sourceKeys || [])].filter(Boolean).join(" ");
    }

    function graphNodeClass(type) {
      if (type === "root") return "root";
      if (type === "aspect") return "aspect";
      if (type === "hypothesis") return "hypothesis";
      if (type === "task") return "task";
      if (type === "internalReportTask") return "internalReportTask";
      if (type === "reportlet") return "reportlet";
      if (type === "knowledge") return "knowledge";
      if (type === "gap") return "gap";
      return "unknown";
    }

    function graphNodeTypeLabel(type) {
      return {
        root: "根报告",
        aspect: "报告方面",
        hypothesis: "报告子分支",
        task: "Agent节点",
        internalReportTask: "报告任务",
        reportlet: "报告片段",
        knowledge: "资料节点",
        gap: "证据缺口",

      return {
        root: { fill: "#111827", stroke: "#111827" },
        aspect: { fill: "#eef6ff", stroke: "#4a90e2" },
        hypothesis: { fill: "#f3f0ff", stroke: "#7c6bd8" },
        task: { fill: "#e9fbf8", stroke: "#0f9f8f" },

    function relationLabel(value) {
      return {
        hierarchy: "结构包含",
        task: "派发Agent",
        reportlet: "写成片段",
        writeback: "回填合稿",
        cites: "引用资料",
        supports: "支持",
        contradicts: "反证",
        qualifies: "限定",
        background: "背景",
        gap: "待补缺口",
      }[value] || value || "关系";
    }

    function graphNodeSize(node, graph) {
      const degree = graph?.edges?.reduce((count, edge) => count + (edge.source === node.id || edge.target === node.id ? 1 : 0), 0) || 0;
      const base = node.type === "root" ? 14 : node.type === "aspect" ? 11 : node.type === "hypothesis" ? 9 : node.type === "task" ? 8 : node.type === "internalReportTask" ? 7.5 : node.type === "reportlet" ? 7.5 : node.type === "knowledge" ? 7 : 6;
      const r = Math.max(6, Math.min(24, base + Math.sqrt(degree + 1) * 2.2));
      return { w: r * 2, h: r * 2, r };
    }

    function seededVelocity(id, axis) {
      const value = parseInt(shortHash(`${id}:${axis}`).slice(0, 6), 16) || 1;
      return ((value % 2000) / 1000 - 1) * 0.6;
    }

    function wrapGraphLabel(value, maxChars, maxLines) {
      const clean = String(value || "").replace(/\s+/g, " ").trim();
      if (!clean) return [""];
      const chunks = [];
      let cursor = clean;
      while (cursor && chunks.length < maxLines) {
        chunks.push(cursor.slice(0, maxChars));
        cursor = cursor.slice(maxChars);
      }
      if (cursor && chunks.length) chunks[chunks.length - 1] = `${chunks[chunks.length - 1].slice(0, Math.max(0, maxChars - 1))}…`;
      return chunks;
    }

    function shortHash(value) {
      let hash = 2166136261;
      const text = String(value || "");
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(16);
    }

    function chatVariant(kind) {
      if (kind === "agent_thinking") return "thinking";
      if (kind === "tool_started" || kind === "tool_finished" || kind === "source_saved" || kind === "evidence_linked" || kind === "gap_opened") return "tool";
      if (kind === "error") return "error";
      return "assistant";
    }

    function chatSpeaker(agent, item, frame) {
      const actor = frame.visual?.actor || {};
      if (item.kind === "agent_thinking") return { title: "思考", initials: "思" };
      if (item.kind === "tool_started" || item.kind === "tool_finished") return { title: "工具", initials: "工" };
      if (item.kind === "source_saved") return { title: "资料", initials: "资" };
      if (item.kind === "evidence_linked") return { title: "证据", initials: "证" };
      if (item.kind === "gap_opened") return { title: "缺口", initials: "缺" };
      if (item.kind === "error") return { title: "错误", initials: "!" };
      if (actor.title) return { title: displayAgentTitle(actor.title), initials: initialsFor(displayAgentTitle(actor.title)) };
      return { title: displayAgentTitle(agent.title || "子代理"), initials: initialsFor(displayAgentTitle(agent.title || "子")) };
    }

    function iconOrInitial(kind, fallback) {
      if (kind === "tool_started" || kind === "tool_finished" || kind === "source_saved" || kind === "evidence_linked" || kind === "gap_opened" || kind === "error") {

    function selectGraphNode(nodeId, opts = {}) {
      if (!nodeId) return;
      state.selectedGraphNodeId = nodeId;
      state.mode = "graph";
      renderSide();
      if (opts.scrollInspector) {
        requestAnimationFrame(() => {
          const inspector = $("sideBody").querySelector(".graph-inspector");
          inspector?.scrollIntoView({ block: "start", behavior: "smooth" });
        });

    function bindClicks(root) {
      root.querySelectorAll("[data-agent-key]").forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedAgentKey = button.dataset.agentKey;
          const agent = state.agents.get(state.selectedAgentKey);
          const latestFrame = agent?.frames.at(-1);
          if (latestFrame) state.selectedFrameId = frameId(latestFrame);
          state.mode = "agent";
          renderSide();
          renderMessages();
        });
      });
      root.querySelectorAll("[data-run-id]").forEach((button) => {
        button.addEventListener("click", async () => {
          const runId = button.dataset.runId;
          if (!runId) return;
          await loadRun(runId).catch(pushClientError);
        });
      });
      root.querySelectorAll("[data-frame-id]").forEach((button) => {
        button.addEventListener("click", () => {
          const frame = state.frames.find((item) => frameId(item) === button.dataset.frameId);
          if (!frame) return;
          state.selectedFrameId = frameId(frame);
          state.selectedAgentKey = agentKey(frame);
          state.mode = "agent";
          renderSide();
          renderMessages();
        });
      });
      root.querySelectorAll("[data-panel-key]").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.panelKey;
          if (!key) return;
          state.sidePanels[key] = !state.sidePanels[key];
          localStorage.setItem(`deepresearch.panel.${key}`, String(state.sidePanels[key]));
          renderSide();
        });
      });
      root.querySelectorAll("[data-graph-node-id]").forEach((node) => {
        const select = () => {
          selectGraphNode(node.dataset.graphNodeId || "", { scrollInspector: true });
        };
        node.addEventListener("click", select);
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            select();
          }
        });
      });
      root.querySelectorAll("[data-graph-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.graphFilter;
          if (!key || !(key in state.graphFilters)) return;
          state.graphFilters[key] = !state.graphFilters[key];
          state.mode = "graph";
          renderSide();
        });
      });
      root.querySelectorAll("[data-graph-search]").forEach((input) => {
        input.addEventListener("input", () => {
          state.graphSearch = input.value || "";
          state.mode = "graph";
          renderSide();
          const nextInput = $("sideBody").querySelector("[data-graph-search]");
          if (nextInput) {
            nextInput.focus();
            const end = nextInput.value.length;
            nextInput.setSelectionRange(end, end);
          }
        });
      });
    }

      state.currentCycleTaskIds = [];
