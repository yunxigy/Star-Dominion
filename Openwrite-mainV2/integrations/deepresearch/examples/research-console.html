    function markRunningAgentsCancelled() {
      for (const agent of state.agents.values()) {
        if (!isClusterAgent(agent) || agent.done) continue;
        agent.done = true;
        agent.status = "cancelled";
        agent.completedSteps = Math.min(agent.maxSteps, Math.max(1, actualAgentSteps(agent)));
      }
    }

    function computeRunDiagnostics() {
      const lastFrame = state.frames.at(-1);
      const lastItem = lastFrame ? readableFrame(lastFrame) : null;
      const lastTimestamp = frameTimestamp(lastFrame) || state.runInfo?.updatedAt || "";
      const allAgents = Array.from(state.agents.values()).filter(isClusterAgent);
      const runningAgents = allAgents.filter((agent) => !agent.done);
      const failedAgents = allAgents.filter((agent) => agent.status === "failed");
      const reportletRecords = collectReportletRecords();
      const reportlets = collectReportletDebug(reportletRecords);
      const agentNodeParts = collectAgentNodePartDebug();
      const uncoveredEvidence = collectUncoveredEvidenceRisk(reportletRecords);
      const checkpoint = collectCheckpointDebug();
      const writerContext = collectWriterContextDebug();
      const errors = state.frames
        .map((frame) => ({ frame, item: readableFrame(frame) }))
        .filter(({ item }) => item.kind === "error");
      const lastError = errors.at(-1);
      const reflection = findLastFrameByEvent("reflection_scheduler_finished") || findLastFrameByEvent("cycle_reflection");
      const gate = findLastFrameByEvent("completion_gate") || findLastFrameByKind("gate_check");
      const lastPayload = lastFrame?.event?.payload || lastFrame?.visual?.payload || {};
      const idle = idleSeconds(lastTimestamp);
      const status = $("status").dataset.state || state.runInfo?.status || "idle";
      const problemCounts = {
        fetchErrors: countFrames((frame) => frame.event?.eventType === "full.fetch.error"),
        searchErrors: countFrames((frame) => frame.event?.eventType === "full.search.error"),
        gaps: countFrames((frame) => frame.event?.eventType === "full.kg.addOpenGap"),
        reportlets: reportlets.total,
        agentNodePartPlans: agentNodeParts.planEvents,
        internalReportTasks: agentNodeParts.plannedParts,
        uncoveredEvidenceLinks: uncoveredEvidence.uncoveredEvidenceLinks,
        writerRequests: writerContext.totalRequests,
      };
      const notes = [];
      const terminalReview = status === "needs_human_review" || state.runInfo?.status === "needs_human_review" || state.result?.status === "needs_human_review";
      const terminalStatus = terminalReview || ["succeeded", "failed", "cancelled", "interrupted"].includes(status) || ["succeeded", "failed", "cancelled", "interrupted"].includes(state.runInfo?.status || "");
      const runIsActive = !terminalStatus && (status === "running" || state.runInfo?.status === "running");
      if (!state.runId) {
        notes.push("还没有运行中的任务。");
      } else if (runIsActive && idle > 90) {
        notes.push(`可能卡住：${formatDuration(idle)} 没有新事件。最后阶段是 ${lastItem?.title || "未知"}。`);
      } else if (terminalReview) {
        const reviewQuestions = state.result?.humanReview?.questions || [];
        notes.push(reviewQuestions.length
          ? `运行正在等待你的决定，AI 已生成 ${reviewQuestions.length} 个需要回答的问题；这不是仍在运行。`
          : "运行已结束，结果进入人工处理状态；这不是仍在运行。可查看缺口、报告草稿或从 checkpoint 继续。");
        for (const [index, question] of reviewQuestions.slice(0, 5).entries()) {
          notes.push(`问题 ${index + 1}：${question.question} 回答格式：${question.answerFormat}`);
        }
      } else {
        notes.push("事件流仍在更新或已正常结束。");
      }
      if (runningAgents.length) notes.push(`还有 ${runningAgents.length} 个子代理未结束：${runningAgents.slice(0, 5).map((agent) => displayAgentTitle(agent.title)).join("、")}${runningAgents.length > 5 ? "等" : ""}。`);
      if (failedAgents.length) notes.push(`有 ${failedAgents.length} 个子代理失败，需要优先查看“最后错误”和对应子代理详情。`);
      if (problemCounts.fetchErrors || problemCounts.searchErrors) notes.push(`工具层出现异常：搜索失败 ${problemCounts.searchErrors} 次，网页读取失败 ${problemCounts.fetchErrors} 次。`);
      if (reportlets.total) notes.push(`已生成 ${reportlets.total} 个报告片段，覆盖 ${reportlets.uniqueCitedEvidenceLinkIds} 条证据链接、${reportlets.uniqueCitedKnowledgeNodeIds} 个资料节点。`);
      if (agentNodeParts.planEvents) notes.push(`检测到 ${agentNodeParts.planEvents} 次 Agent 节点内部计划，包含 ${agentNodeParts.plannedParts} 个报告任务。`);
      if (writerContext.totalRequests) notes.push(`写作代理请求 ${writerContext.totalRequests} 次，其中 ${writerContext.requestsWithReportlets} 次包含 reportlet 标记，${writerContext.requestsWithCitationMarkers} 次包含引用标记。`);
      if (uncoveredEvidence.uncoveredEvidenceLinks) notes.push(`存在 ${uncoveredEvidence.uncoveredEvidenceLinks} 条证据链接已关联到有 reportlet 的报告节点，但未被任何 reportlet 引用，写作时可能被折叠遗漏。`);
      if (gate && (gate.event?.payload || {}).debugPartial) notes.push("当前是单分支调试草稿：completion gate 只表示已探索分支可写，不表示原始完整任务已覆盖。");
      if (checkpoint.available) notes.push(`当前运行可从 checkpoint 恢复：${oneLine(checkpoint.path, 160)}`);
      if (reflection) notes.push(`最后全局反思：${oneLine(readableFrame(reflection).summary || reflection.line || "已返回决策", 180)}`);
      if (gate) notes.push(`最后完成度检查：${oneLine(readableFrame(gate).summary || gate.line || "已返回决策", 180)}`);
      if (lastError) notes.push(`最近错误：${oneLine(lastError.item.summary, 180)}`);
      if (!reflection && state.frames.length) notes.push("还没有看到全局反思完成事件，可能仍在探索或尚未进入反思阶段。");
      const lastReflection = reflection ? debugDecisionSummary(reflection) : null;
      const lastGate = gate ? debugDecisionSummary(gate) : null;
      return {
        runId: state.runId,
        status,
        idleFor: lastTimestamp ? formatDuration(idle) : "-",
        stuckLevel: runIsActive && idle > 180 ? "高风险" : runIsActive && idle > 90 ? "需要关注" : "正常",
        currentPhase: llmPhaseLabel(lastFrame?.phase || lastPayload.phase || ""),
        lastTitle: lastItem?.title || "无事件",
        lastSummary: lastItem?.summary || "-",
        lastEventType: eventTypeLabel(lastFrame?.event?.eventType || lastFrame?.visual?.kind || ""),
        lastTime: lastTimestamp ? formatDateTime(lastTimestamp) : "-",
        runningAgents,
        agentCounts: {
          total: allAgents.length,
          running: runningAgents.length,
          failed: failedAgents.length,
          completed: allAgents.filter((agent) => agent.done && agent.status !== "failed").length,
        },
        problemCounts,
        architecture: {
          reportlets,
          agentNodeParts,
          uncoveredEvidence,
          checkpoint,
          writerContext,
        },
        counts: {
          events: state.runInfo?.counts?.events || state.frames.length,
          frames: state.frames.length,
        },
        lastReflection,
        lastGate,
        lastError: lastError ? { time: lastError.item.time, summary: lastError.item.summary } : null,
        recentImportant: recentImportantFrames().map((frame) => {
          const item = readableFrame(frame);
          return `${shortTime(frameTimestamp(frame))} ${eventTypeLabel(frame.event?.eventType || item.kind)}：${oneLine(item.summary || item.title, 120)}`;
        }),
        notes,
      };
    }

    function debugPayload() {
      const diag = computeRunDiagnostics();
      const graphDebug = collectGraphDebug();
      return {
        "运行ID": state.runId,
        "回合ID": state.result?.episodeId || state.runInfo?.episodeId,
        "状态": statusLabel($("status").dataset.state),
        "任务": state.promptText,
        "计数": {
          "事件帧": state.frames.length,
          "子代理": Array.from(state.agents.values()).filter(isClusterAgent).length,
          "证据索引": state.evidenceIndex.length,
          "报告片段": diag.architecture.reportlets.total,
          "最小Agent内部计划事件": diag.architecture.agentNodeParts.planEvents,
          "报告任务": diag.architecture.agentNodeParts.plannedParts,
        },
        "诊断": {
          "空闲时长": diag.idleFor,
          "卡点级别": diag.stuckLevel,
          "当前阶段": diag.currentPhase,
          "最后事件": diag.lastTitle,
          "最后事件类型": diag.lastEventType,
          "最后摘要": diag.lastSummary,
          "判断": diag.notes,
          "子代理统计": {
            "总数": diag.agentCounts.total,
            "运行中": diag.agentCounts.running,
            "已完成": diag.agentCounts.completed,
            "失败": diag.agentCounts.failed,
          },
          "工具异常": {
            "搜索失败": diag.problemCounts.searchErrors,
            "网页读取失败": diag.problemCounts.fetchErrors,
            "记录缺口": diag.problemCounts.gaps,
          },
          "最后全局反思": diag.lastReflection,
          "最后完成度检查": diag.lastGate,
          "运行中子代理": diag.runningAgents.map((agent) => ({
            "标识": agent.key,
            "名称": displayAgentTitle(agent.title),
            "已用步骤": agent.completedSteps,
            "步骤上限": agent.maxSteps,
            "工具次数": agent.tools,
            "最后输出": agent.last,
            "最后时间": agent.lastAt,
          })),
          "最后错误": diag.lastError,
        },
        "写作链路诊断": {
          "报告片段": diag.architecture.reportlets,
          "最小Agent内部计划": diag.architecture.agentNodeParts,
          "写作请求上下文": diag.architecture.writerContext,
          "Checkpoint": diag.architecture.checkpoint,
          "未覆盖证据风险": diag.architecture.uncoveredEvidence,
          "图谱": graphDebug,
        },
        "产物路径": {
          "报告": state.result?.reportArtifactPath,
          "证据索引": state.result?.evidenceIndexPath,
        },
        "最近事件": state.frames.slice(-80).map((frame) => {
          const item = readableFrame(frame);
          return {
            "事件类型": eventTypeLabel(frame.event?.eventType || ""),
            "原始事件类型": frame.event?.eventType,
            "类别": labelForKind(item.kind),
            "标题": item.title,
            "摘要": item.summary,
            "时间": frameTimestamp(frame),
            "执行者": displayAgentTitle(frame.visual?.actor?.title || ""),
            "阶段": llmPhaseLabel(frame.phase || frame.event?.payload?.phase || ""),
          };
        }),
      };
    }

    function collectReportletRecords() {
      const records = new Map();
      for (const frame of state.frames) {
        const eventType = frame.event?.eventType || "";
        const payload = frame.event?.payload || frame.visual?.payload || {};
        if (eventType === "full.kg.upsertReportlet") {
          const reportlet = normalizeGraphReportlet(payload.reportlet, "", graphEventMeta(frame));
          if (!reportlet?.reportletId) continue;
          records.set(reportlet.reportletId, {
            ...reportlet,
            debugSource: "full.kg.upsertReportlet",
            debugFrameTime: frameTimestamp(frame),
          });
        }
        if (eventType === "report_node_draft_updated") {
          for (const item of debugArray(payload.reportlets)) {
            const reportlet = normalizeGraphReportlet(item, payload.reportNodeId || "", graphEventMeta(frame));
            if (!reportlet?.reportletId || records.has(reportlet.reportletId)) continue;
            records.set(reportlet.reportletId, {
              ...reportlet,
              debugSource: "report_node_draft_updated",
              debugFrameTime: frameTimestamp(frame),
            });
          }
        }
      }
      return Array.from(records.values());
    }

    function collectReportletDebug(reportlets = collectReportletRecords()) {
      const citedEvidenceLinkIds = reportlets.flatMap((reportlet) => debugStringArray(reportlet.citedEvidenceLinkIds));
      const citedKnowledgeNodeIds = reportlets.flatMap((reportlet) => debugStringArray(reportlet.citedKnowledgeNodeIds));
      return {
        total: reportlets.length,
        plannedReportletCount: reportlets.filter((reportlet) => reportlet.plannedReportlet).length,
        citedEvidenceLinkIds: citedEvidenceLinkIds.length,
        uniqueCitedEvidenceLinkIds: uniqueDebugStrings(citedEvidenceLinkIds).length,
        citedKnowledgeNodeIds: citedKnowledgeNodeIds.length,
        uniqueCitedKnowledgeNodeIds: uniqueDebugStrings(citedKnowledgeNodeIds).length,
        byReportNode: debugCountBy(reportlets, (reportlet) => reportlet.reportNodeId || "R_unknown"),
        byTask: debugCountBy(reportlets, (reportlet) => reportlet.taskId || "T_unknown"),
        recent: reportlets.slice(-12).map((reportlet) => ({
          reportletId: reportlet.reportletId,
          reportNodeId: reportlet.reportNodeId,
          taskId: reportlet.taskId,
          title: reportlet.title,
          citedEvidenceLinkIds: debugStringArray(reportlet.citedEvidenceLinkIds),
          citedKnowledgeNodeIds: debugStringArray(reportlet.citedKnowledgeNodeIds),
          plannedPartId: reportlet.plannedReportlet?.partId || "",
          plannedHeading: reportlet.plannedReportlet?.expectedHeading || "",
          markdownPreview: oneLine(reportlet.markdown, 260),
          time: reportlet.debugFrameTime || reportlet.updatedAt || reportlet.createdAt || "",
        })),
      };
    }

    function collectAgentNodePartDebug() {
      const plans = [];
      const writtenParts = new Map();
      for (const frame of state.frames) {
        const eventType = frame.event?.eventType || "";
        const payload = frame.event?.payload || frame.visual?.payload || {};
        if (eventType === "agent_node_parts_planned") {
          plans.push({
            reportNodeId: payload.reportNodeId || "",
            originalTaskId: payload.originalTaskId || payload.taskId || "",
            partCount: Number(payload.partCount) || debugArray(payload.parts).length,
            parts: debugArray(payload.parts).map((part) => ({
              partId: part.partId || "",
              expectedHeading: part.expectedHeading || "",
              researchQuestion: part.researchQuestion || "",
              searchGoal: part.searchGoal || "",
              writingGoal: part.writingGoal || "",
              evidenceNeeds: debugStringArray(part.evidenceNeeds),
            })),
            time: frameTimestamp(frame),
          });
        }
      }
      for (const reportlet of collectReportletRecords()) {
        const part = reportlet?.plannedReportlet;
        if (!reportlet?.taskId || !part?.partId) continue;
        const key = `${reportlet.taskId}:${part.partId}`;
        writtenParts.set(key, {
          taskId: reportlet.taskId,
          reportNodeId: reportlet.reportNodeId || part.parentReportNodeId || "",
          partId: part.partId,
          expectedHeading: part.expectedHeading || reportlet.title || "",
          reportletId: reportlet.reportletId || "",
          citedEvidenceLinkIds: debugStringArray(reportlet.citedEvidenceLinkIds),
          citedKnowledgeNodeIds: debugStringArray(reportlet.citedKnowledgeNodeIds),
          time: reportlet.debugFrameTime || reportlet.updatedAt || reportlet.createdAt || "",
        });
      }
      const writtenPartList = Array.from(writtenParts.values());
      const plannedParts = plans.reduce((sum, plan) => sum + plan.partCount, 0);
      return {
        planEvents: plans.length,
        plannedParts,
        writtenParts: writtenPartList.length,
        unwrittenParts: Math.max(0, plannedParts - writtenPartList.length),
        writtenPartCoverage: debugCountBy(writtenPartList, (part) => part.reportNodeId || "R_unknown"),
        recentPlans: plans.slice(-8),
        recentWrittenParts: writtenPartList.slice(-12),
      };
    }

    function collectEvidenceLinkRecords() {
      const links = new Map();
      for (const frame of state.frames) {
        const eventType = frame.event?.eventType || "";
        if (eventType !== "full.kg.upsertEvidenceLink" && eventType !== "full.kg.updateEvidenceLink") continue;
        const payload = frame.event?.payload || frame.visual?.payload || {};
        const link = payload.link || payload.evidenceLink;
        if (!link?.linkId) continue;
        links.set(link.linkId, {
          ...links.get(link.linkId),
          ...link,
          debugFrameTime: frameTimestamp(frame),
        });
      }
      return Array.from(links.values());
    }

    function collectUncoveredEvidenceRisk(reportlets = collectReportletRecords()) {
      const reportNodeIdsWithReportlets = new Set(reportlets.map((reportlet) => reportlet.reportNodeId).filter(Boolean));
      const citedEvidence = new Set(reportlets.flatMap((reportlet) => debugStringArray(reportlet.citedEvidenceLinkIds)));
      const relevantLinks = collectEvidenceLinkRecords().filter((link) => reportNodeIdsWithReportlets.has(link.reportNodeId));
      const uncovered = relevantLinks.filter((link) => !citedEvidence.has(link.linkId));
      return {
        reportNodesWithReportlets: reportNodeIdsWithReportlets.size,
        evidenceLinksOnReportletNodes: relevantLinks.length,
        coveredEvidenceLinks: relevantLinks.length - uncovered.length,
        uncoveredEvidenceLinks: uncovered.length,
        byReportNode: debugCountBy(uncovered, (link) => link.reportNodeId || "R_unknown"),
        samples: uncovered.slice(0, 20).map((link) => ({
          linkId: link.linkId,
          reportNodeId: link.reportNodeId,
          knowledgeNodeId: link.knowledgeNodeId,
          relation: link.relation || "",
          confidence: link.confidence,
          claimText: oneLine(link.claimText || link.reasoningSummary || "", 220),
          time: link.debugFrameTime || "",
        })),
      };
    }

    function collectCheckpointDebug() {
      const path = state.resumeCheckpointPath || checkpointFromRun(state.runInfo);
      const effectiveRunStatus = state.result?.status || $("status").dataset.state || state.runInfo?.status || "";
      return {
        available: Boolean(path),
        path,
        checkpointCursor: state.runInfo?.checkpointCursor || null,
        artifactBacked: Boolean(state.runInfo?.artifactBacked),
        resultStatus: state.result?.status || "",
        runStatus: effectiveRunStatus,
      };
    }

    function collectGraphDebug() {
      try {
        const graph = buildResearchGraph();
        const filtered = filterResearchGraph(graph);
        return {
          nodes: graph.nodes.length,
          edges: graph.edges.length,
          visibleNodes: filtered.nodes.length,
          visibleEdges: filtered.edges.length,
          counts: graph.counts,
          filters: { ...state.graphFilters },
          search: state.graphSearch,
          selectedNodeId: state.selectedGraphNodeId,
        };
      } catch (err) {
        return {
          error: errorText(err),
        };
      }
    }

    function collectWriterContextDebug() {
      const requests = [];
      for (const frame of state.frames) {
        const eventType = frame.event?.eventType || "";
        const payload = frame.event?.payload || frame.visual?.payload || {};
        const phase = frame.phase || payload.phase || "";
        if (eventType !== "full.llm.request" || !isWriterRequestFrame(frame, phase)) continue;
        const text = llmRequestDebugText(frame, payload);
        const reportletMatches = debugRegexCount(text, /\breportlets?\b|报告片段|Pre-written atomic reportlets|citedEvidenceLinkIds|citedKnowledgeNodeIds/gi);
        const citationMarkerMatches = debugRegexCount(text, /\[(?:C\d+|E:[A-Za-z0-9_-]+|E_[A-Za-z0-9_-]+)\]/g);
        const evidenceIdMatches = debugRegexCount(text, /\bE_[A-Za-z0-9_-]+\b/g);
        const knowledgeIdMatches = debugRegexCount(text, /\bK_[A-Za-z0-9_-]+\b/g);
        requests.push({
          phase: llmPhaseLabel(phase),
          rawPhase: phase,
          time: frameTimestamp(frame),
          actor: displayAgentTitle(frame.visual?.actor?.title || ""),
          taskId: frame.visual?.actor?.taskId || payload.taskId || "",
          reportNodeId: frame.visual?.actor?.reportNodeId || payload.reportNodeId || "",
          chars: text.length,
          clippedTranscript: hasClippedTranscript(frame),
          hasReportlets: reportletMatches > 0,
          hasAvailableCitations: /Available citations|可用引用|citationIds|citation map/i.test(text),
          hasEvidenceMarkers: evidenceIdMatches > 0 || citationMarkerMatches > 0,
          hasKnowledgeMarkers: knowledgeIdMatches > 0,
          reportletMentions: reportletMatches,
          citationMarkers: citationMarkerMatches,
          evidenceIdMarkers: evidenceIdMatches,
          knowledgeIdMarkers: knowledgeIdMatches,
          preview: oneLine(text, 260),
        });
      }
      return {
        totalRequests: requests.length,
        byPhase: debugCountBy(requests, (request) => request.rawPhase || request.phase || "unknown"),
        requestsWithReportlets: requests.filter((request) => request.hasReportlets).length,
        requestsWithAvailableCitations: requests.filter((request) => request.hasAvailableCitations).length,
        requestsWithCitationMarkers: requests.filter((request) => request.citationMarkers > 0).length,
        requestsWithEvidenceMarkers: requests.filter((request) => request.hasEvidenceMarkers).length,
        requestsWithKnowledgeMarkers: requests.filter((request) => request.hasKnowledgeMarkers).length,
        clippedTranscriptRequests: requests.filter((request) => request.clippedTranscript).length,
        recent: requests.slice(-12),
        largest: requests.slice().sort((a, b) => b.chars - a.chars).slice(0, 8),
      };
    }

    function isWriterRequestFrame(frame, phase) {
      const rawPhase = String(phase || "");
      if (rawPhase.startsWith("report.")) return true;
      const actor = frame.visual?.actor || {};
      if (actor.role === "reporter") return true;
      const title = String(actor.title || "");
      return title.includes("写作代理");
    }

    function llmRequestDebugText(frame, payload) {
      const request = payload.request || {};
      const parts = [
        request.system,
        request.user,
        request.prompt,
        request.content,
      ];
      if (Array.isArray(request.messages)) {
        parts.push(...request.messages.map((message) => message?.content));
      }
      if (Array.isArray(frame.messages)) {
        parts.push(...frame.messages.map((message) => message?.content));
      }
      return parts
        .map((part) => typeof part === "string" ? part : part == null ? "" : JSON.stringify(part))
        .filter(Boolean)
        .join("\n\n");
    }

    function debugRegexCount(text, regex) {
      return String(text || "").match(regex)?.length || 0;
    }

    function debugArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function debugStringArray(value) {
      return debugArray(value).filter((item) => typeof item === "string" && item.trim());
    }

    function debugNumberArray(value) {
      return debugArray(value)
        .map((item) => Number(item))
        .filter((item) => Number.isInteger(item) && item >= 0);
    }

    function uniqueDebugStrings(values) {
      return Array.from(new Set(debugStringArray(values)));
    }

    function debugCountBy(items, keyFn) {
      const counts = new Map();
      for (const item of items) {
        const key = String(keyFn(item) || "unknown");
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      return Array.from(counts.entries())
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], undefined, { numeric: true }))
        .map(([key, count]) => ({ key, count }));
    }

    function findLastFrameByEvent(eventType) {
      for (let i = state.frames.length - 1; i >= 0; i--) {
        if (state.frames[i]?.event?.eventType === eventType) return state.frames[i];
      }
      return null;
    }

    function findLastFrameByKind(kind) {
      for (let i = state.frames.length - 1; i >= 0; i--) {
        if ((state.frames[i]?.visual?.kind || state.frames[i]?.kind) === kind) return state.frames[i];
      }
      return null;
    }

    function countFrames(predicate) {
      return state.frames.reduce((count, frame) => count + (predicate(frame) ? 1 : 0), 0);
    }

    function recentImportantFrames() {
      return state.frames.filter((frame) => {
        const eventType = frame.event?.eventType || "";
        const kind = frame.visual?.kind || "";
        return kind === "error"
          || eventType.includes("reflection")
          || eventType.includes("completion_gate")
          || eventType.includes("publish_gate")
          || eventType === "dispatch_cycle_finished"
          || eventType === "agent_node_parts_planned"
          || eventType === "full.kg.upsertReportlet"
          || eventType === "report_node_draft_updated"
          || eventType === "full.fetch.error"
          || eventType === "full.search.error"
          || eventType === "writer_gap_repair";
      }).slice(-12);
    }

    function debugDecisionSummary(frame) {
      const payload = frame.event?.payload || frame.visual?.payload || {};
      const item = readableFrame(frame);
      const lines = [
        `事件：${eventTypeLabel(frame.event?.eventType || "")}`,
        `摘要：${item.summary || "-"}`,
      ];
      if (payload.continueDispatch !== undefined) lines.push(`是否继续分发：${boolLabel(payload.continueDispatch)}`);
      if (payload.createdTaskIds !== undefined) lines.push(`新建修复任务：${arraySummary(payload.createdTaskIds)}`);
      if (payload.queuedTaskIds !== undefined) lines.push(`剩余排队任务：${arraySummary(payload.queuedTaskIds)}`);
      if (payload.newTasks !== undefined) lines.push(`模型建议新任务：${arraySummary(payload.newTasks)}`);
      if (payload.taskUpdates !== undefined) lines.push(`任务状态更新：${arraySummary(payload.taskUpdates)}`);
      if (payload.skipReasons !== undefined) lines.push(`跳过原因：${arraySummary(payload.skipReasons)}`);
      if (payload.decision !== undefined) lines.push(`决策：${decisionLabel(payload.decision)}`);
      if (payload.reason) lines.push(`理由：${oneLine(payload.reason, 220)}`);
      if (payload.issues !== undefined) lines.push(`问题：${arraySummary(payload.issues)}`);
      return { time: shortTime(frameTimestamp(frame)), lines: lines.filter(Boolean) };
    }

    function pushClientError(err) {
      const message = String(err?.message || err);
      setStatus("error");
      addFrame({
        kind: "debug",
        line: message,
        visual: {
          eventId: `client-${Date.now()}`,
          timestamp: new Date().toISOString(),
          kind: "error",
          actor: { title: "浏览器", role: "system" },
          ui: { lane: "system", severity: "error", title: "客户端错误", summary: message },
          payload: { message },
        },
      });
    }

    function setStatus(value) {
      $("status").textContent = statusLabel(value);
      $("status").dataset.state = value;
    }

    function applySideLayout() {
      $("app").style.setProperty("--side-width", `${state.sideWidth}px`);
      $("app").classList.toggle("side-collapsed", state.sideCollapsed);
      $("sideToggle").title = state.sideCollapsed ? "展开详情" : "折叠详情";
      $("sideToggleIcon").innerHTML = state.sideCollapsed
        ? '<path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
        : '<path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
    }

    function isNearBottom(element) {
      return element.scrollHeight - element.scrollTop - element.clientHeight < 120;
    }

    function scrollToBottom(element) {
      element.scrollTop = element.scrollHeight;
    }

    function clampNumber(value, min, max, fallback) {
      return Number.isFinite(value) ? Math.max(min, Math.min(max, value)) : fallback;
    }

    function shouldEscape(value) {
      return value !== undefined && value !== null;
    }

    function frameId(frame) {
      return frame.visual?.eventId || frame.event?.eventId || `${frame.kind}-${state.frames.indexOf(frame)}`;
    }

    function agentKey(frame) {
      const actor = frame.visual?.actor || {};
      const ui = frame.visual?.ui || {};
      if (actor.role === "subagent" && actor.taskId) return actor.taskId;
      return actor.agentRunId || actor.taskId || actor.title || ui.lane || "system";
    }

    function transcriptText(frame) {
      return Array.isArray(frame.messages) && frame.messages.length
        ? frame.messages.map((msg) => `${roleLabel(msg.role)}${msg.clipped ? "（已截断）" : ""}：\n${localizeTranscriptContent(msg.content)}`).join("\n\n")
        : "";
    }

    function hasClippedTranscript(frame) {
      return Array.isArray(frame.messages) && frame.messages.some((msg) => msg.clipped);
    }

    function roleLabel(role) {
      return {
        system: "系统",
        user: "用户",
        assistant: "模型",
        subagent: "子代理",
        reporter: "写作代理",
        main_dispatcher: "主流程代理",
      }[role] || role;
    }

    function readableTimeline(agent) {
      return agent.frames.filter((frame) => {
        const eventType = frame.event?.eventType || "";
        const kind = frame.visual?.kind || "";
        if (eventType === "checkpoint_saved") return false;
        if (kind === "task_created") return false;
        return Boolean(readableFrame(frame).title);
      });
    }

    function readableFrame(frame) {
      const eventType = frame.event?.eventType || "";
      const visual = frame.visual || {};
      const ui = visual.ui || {};
      const payload = frame.event?.payload || visual.payload || {};
      const phase = frame.phase || payload.phase || "";
      const kind = visual.kind || frame.kind || eventType;
      const base = {
        kind,
        title: labelForKind(kind),
        summary: cleanAgentSummary(ui.summary || frame.line || ""),
        details: Array.isArray(frame.details) ? frame.details : [],
        time: shortTime(frame.event?.timestamp || visual.timestamp || ""),
        transcriptTitle: "代理对话片段",
      };

      if (eventType === "scout_sources_selected") {
        const candidates = Array.isArray(payload.candidates) ? payload.candidates : [];
        const selected = debugNumberArray(payload.selectedIndices);
        const demoted = debugNumberArray(payload.policyDemotedIndices);
        return {
          ...base,
          kind: "source_saved",
          title: "来源候选筛选完成",
          summary: `从 ${payload.candidateCount ?? candidates.length} 个候选中选择 ${selected.length} 个来源，规则降级 ${demoted.length} 个。`,
          details: compactDetails([], [
            `高可信：${debugNumberArray(payload.highConfidenceIndices).length}`,
            `回退候选：${debugNumberArray(payload.fallbackIndices).length}`,
            `规则降级：${demoted.length}`,
            payload.reasoningSummary ? `筛选理由：${oneLine(payload.reasoningSummary, 220)}` : "",
          ]),
        };
      }

      if (eventType === "full.llm.request") {
        return {
          ...base,
          kind: "agent_thinking",
          title: `思考：${llmPhaseLabel(phase)}`,
          summary: llmRequestSummary(payload) || "正在整理下一步行动。",
          details: compactDetails(frame.details, [`阶段：${llmPhaseLabel(phase)}`]),
          transcriptTitle: "给模型的输入",
        };
      }
      if (eventType === "full.llm.response") {
        return {
          ...base,
          kind: "agent_message",
          title: `输出：${llmPhaseLabel(phase)}`,
          summary: llmResponseSummary(payload) || base.summary || "模型已返回结果。",
          details: compactDetails(frame.details, usageDetails(payload)),
          transcriptTitle: "模型输出",
        };
      }
      if (eventType === "full.search.request") {
        return {
          ...base,
          kind: "tool_started",
          title: "调用搜索工具",
          summary: `搜索：${oneLine(payload.query || "", 120)}`,
          details: compactDetails(frame.details, [`阶段：${llmPhaseLabel(phase)}`]),
        };
      }
      if (eventType === "full.search.response") {
        return {
          ...base,
          kind: "tool_finished",
          title: "搜索返回结果",
          summary: `找到 ${Array.isArray(payload.results) ? payload.results.length : "?"} 条结果${payload.durationMs ? `，用时 ${payload.durationMs}ms` : ""}`,
          details: searchResultDetails(payload),
        };
      }
      if (eventType === "full.fetch.request") {
        return {
          ...base,
          kind: "tool_started",
          title: "打开网页全文",
          summary: sourceTitle(payload),
          details: compactDetails(frame.details, [`链接：${payload.url || "未知"}`]),
        };
      }
      if (eventType === "full.fetch.response") {
        return {
          ...base,
          kind: "tool_finished",
          title: "网页读取完成",
          summary: `${sourceTitle(payload)}${payload.contentChars ? `（${payload.contentChars} 字符）` : ""}`,
          details: compactDetails(frame.details, payload.contentPreview ? [`内容预览：${oneLine(payload.contentPreview, 180)}`] : []),
        };
      }
      if (eventType === "full.fetch.rejected") {
        return {
          ...base,
          kind: "tool_finished",
          title: "跳过来源",
          summary: `${sourceTitle(payload)}（${reasonLabel(payload.reason || "low_quality_source")}）`,
          details: compactDetails(frame.details, [
            payload.url ? `链接：${payload.url}` : "",
            `原因：${reasonLabel(payload.reason || "low_quality_source")}`,
          ]),
        };
      }
      if (eventType === "full.fetch.skipped") {
        return {
          ...base,
          kind: "tool_finished",
          title: "跳过网页读取",
          summary: `${sourceTitle(payload)}（${reasonLabel(payload.reason) || "无需读取全文"}）`,
          details: compactDetails(frame.details, [
            payload.url ? `链接：${payload.url}` : "",
            payload.reason ? `原因：${reasonLabel(payload.reason)}` : "",
          ]),
        };
      }
      if (eventType === "full.fetch.error") {
        return {
          ...base,
          kind: "error",
          title: "网页暂时无法读取",
          summary: `${sourceTitle(payload)}。已跳过该来源并继续。`,
          details: compactDetails(frame.details, [`底层错误：${oneLine(errorText(payload.error), 180)}`]),
        };
      }
      if (eventType === "full.search.skipped") {
        return {
          ...base,
          kind: "tool_finished",
          title: "跳过搜索",
          summary: reasonLabel(payload.reason) || oneLine(payload.reason || base.summary, 140),
          details: compactDetails(frame.details, payload.reason ? [`原因：${reasonLabel(payload.reason)}`] : []),
        };
      }
      if (eventType === "full.kg.skipKnowledgeNode") {
        return {
          ...base,
          kind: "tool_finished",
          title: "跳过来源",
          summary: `${sourceTitle(payload)}（${reasonLabel(payload.reason || "low_quality_source")}）`,
          details: compactDetails(frame.details, [
            payload.url ? `链接：${payload.url}` : "",
            `原因：${reasonLabel(payload.reason || "low_quality_source")}`,
          ]),
        };
      }
      if (eventType === "full.kg.upsertKnowledgeNode" || eventType === "full.kg.reuseKnowledgeNode") {
        const knowledge = payload.knowledge || {};
        return {
          ...base,
          kind: "source_saved",
          title: eventType.includes("reuse") ? "复用已有来源" : "保存资料节点",
          summary: sourceTitle(knowledge),
          details: compactDetails([], [
            knowledge.nodeId ? `节点：${knowledge.nodeId}` : "",
            knowledge.summary ? `概览：${oneLine(knowledge.summary, 220)}` : "",
          ]),
        };
      }
      if (eventType === "full.kg.upsertEvidenceLink" || eventType === "full.kg.updateEvidenceLink") {
        const link = payload.link || {};
        return {
          ...base,
          kind: "evidence_linked",
          title: "关联证据",
          summary: `${relationLabel(link.relation)}，置信度 ${formatNumber(link.confidence)}`,
          details: compactDetails([], [
            link.claimText ? `主张：${oneLine(link.claimText, 180)}` : "",
            link.reasoningSummary ? `理由：${oneLine(link.reasoningSummary, 220)}` : "",
          ]),
        };
      }
      if (eventType === "full.kg.upsertReportlet") {
        const reportlet = payload.reportlet || {};
        const citedEvidence = debugStringArray(reportlet.citedEvidenceLinkIds);
        const citedKnowledge = debugStringArray(reportlet.citedKnowledgeNodeIds);
        return {
          ...base,
          kind: "writer_draft",
          title: "保存报告片段",
          summary: `${oneLine(reportlet.title || reportlet.plannedReportlet?.expectedHeading || reportlet.reportletId || "报告片段", 120)}（证据 ${citedEvidence.length}，资料 ${citedKnowledge.length}）`,
          details: compactDetails([], [
            reportlet.reportletId ? `片段：${reportlet.reportletId}` : "",
            reportlet.reportNodeId ? `报告节点：${reportlet.reportNodeId}` : "",
            reportlet.taskId ? `任务：${reportlet.taskId}` : "",
            reportlet.plannedReportlet?.expectedHeading ? `计划小标题：${oneLine(reportlet.plannedReportlet.expectedHeading, 160)}` : "",
            reportlet.markdown ? `内容预览：${oneLine(reportlet.markdown, 220)}` : "",
          ]),
        };
      }
      if (eventType === "report_node_draft_updated") {
        return {
          ...base,
          kind: "writer_draft",
          title: "回填报告子分支草稿",
          summary: oneLine(payload.draftSummary || "已把报告任务片段合成到报告子分支。", 180),
          details: compactDetails([], [
            payload.reportNodeId ? `报告子分支：${payload.reportNodeId}` : "",
            Array.isArray(payload.reportletIds) ? `片段：${payload.reportletIds.join("、")}` : "",
          ]),
        };
      }
      if (eventType === "full.kg.addOpenGap") {
        const gap = payload.gap || {};
        return {
          ...base,
          kind: "gap_opened",
          title: "记录待补证缺口",
          summary: oneLine(gap.description || base.summary, 160),
          details: compactDetails([], gap.reason ? [`原因：${oneLine(gap.reason, 220)}`] : []),
        };
      }
      if (eventType === "evidence_agent_started") {
        return { ...base, kind: "agent_started", title: "子代理开始", summary: cleanAgentSummary(base.summary || "开始探索这个子任务。") };
      }
      if (eventType === "agent_node_parts_planned") {
        const parts = debugArray(payload.parts);
        return {
          ...base,
          kind: "task_created",
          title: "规划最小 Agent 内部任务",
          summary: `为 ${payload.originalTaskId || payload.taskId || "原任务"} 规划 ${payload.partCount || parts.length} 个报告任务。`,
          details: compactDetails([], [
            payload.reportNodeId ? `报告节点：${payload.reportNodeId}` : "",
            ...parts.slice(0, 6).map((part, index) => `${index + 1}. ${oneLine(part.expectedHeading || part.researchQuestion || part.partId, 160)}`),
          ]),
        };
      }
      if (eventType === "evidence_agent_finished") {
        return { ...base, kind: "agent_message", title: "子代理完成", summary: cleanAgentSummary(payload.actionSummary || base.summary || "探索完成。") };
      }
      if (eventType === "evidence_agent_failed" || kind === "error") {
        return { ...base, kind: "error", title: "子代理遇到问题", summary: cleanAgentSummary(payload.actionSummary || payload.reason || base.summary || "运行失败。") };
      }
      return {
        ...base,
        title: ui.title ? zhUiText(ui.title) : labelForKind(kind),
        summary: zhUiText(base.summary),
      };
    }

    function compactDetails(primary, fallback) {
      const lines = [...(Array.isArray(primary) ? primary : []), ...(Array.isArray(fallback) ? fallback : [])]
        .map((line) => cleanAgentSummary(line))
        .filter(Boolean);
      return Array.from(new Set(lines)).slice(0, 8);
    }

    function searchResultDetails(payload) {
      const results = Array.isArray(payload.results) ? payload.results : [];
      const titles = results.slice(0, 5).map((item, index) => `${index + 1}. ${sourceTitle(item)}`).filter(Boolean);
      return compactDetails([], [
        `查询：${oneLine(payload.query || "", 180)}`,
        `提供方：${providerLabel(payload.provider)}`,
        ...titles,
      ]);
    }

    function usageDetails(payload) {
      const usage = payload.response?.usage || {};
      return compactDetails([], [
        payload.durationMs ? `用时：${payload.durationMs}ms` : "",
        usage.totalTokens ? `令牌数：${usage.totalTokens}` : "",
      ]);
    }

    function llmRequestSummary(payload) {
      const request = payload.request || {};
      const user = String(request.user || "");
      const system = String(request.system || "");
      const text = user || system;
      if (!text) return "";
      return oneLine(text.replace(/Output schema:[\s\S]*$/i, "").replace(/输出格式[：:][\s\S]*$/i, ""), 180);
    }

    function llmResponseSummary(payload) {
      const response = payload.response || {};
      const content = String(response.reasoning || response.content || "");
      if (!content) return "";
      const parsed = parseJsonLoose(content);
      if (parsed?.reasoningSummary) return oneLine(parsed.reasoningSummary, 180);
      if (Array.isArray(parsed?.queries)) return `生成 ${parsed.queries.length} 个搜索查询：${oneLine(parsed.queries.join("；"), 160)}`;
      if (Array.isArray(parsed?.openGaps)) return `评估完成，发现 ${parsed.openGaps.length} 个缺口。`;
      if (parsed?.actionSummary) return oneLine(parsed.actionSummary, 180);
      return oneLine(content, 180);
    }

    function llmPhaseLabel(phase) {
      const value = String(phase || "");
      if (value.endsWith(".plan")) return `规划 ${value.replace(".plan", "")}`;
      if (value.endsWith(".assess")) return `评估 ${value.replace(".assess", "")}`;
      return {
        rubric: "生成研究标准",
        "architect-tree": "构建报告树",
        "cycle-reflection": "全局反思",
        "structure-review": "结构审查",
        "report.write": "撰写报告",
        "report.leaf.inspect": "选择需打开的来源",
        "report.leaf": "起草叶子小节",
        "report.section": "合成章节",
        "report.synthesize": "合成摘要和结论",
        "publish-gate": "发布检查",
      }[value] || value || "调用模型";
    }

    function labelForKind(kind) {
      return {

        debug: "调试",
        agent_started: "代理开始",

        agent_message: "代理输出",

        writer_draft: "写作",
        gate_check: "检查",

      }[kind] || kind || "事件";
    }

    function sourceTitle(payload) {
      const title = payload?.title || payload?.searchTitle;
      if (title) return oneLine(title, 140);
      const url = String(payload?.url || "");
      if (!url) return "未命名来源";
      try {
        const parsed = new URL(url);
        const leaf = parsed.pathname.split("/").filter(Boolean).at(-1);
        return oneLine(leaf ? `${parsed.hostname}/${leaf}` : parsed.hostname, 140);
      } catch {
        return oneLine(url, 140);
      }
    }

    function relationLabel(value) {
      return { supports: "支持", contradicts: "反驳", qualifies: "限定支持", background: "背景" }[value] || value || "关系未知";
    }

    function reasonLabel(value) {
      return {
        low_quality_source: "低质量来源",
        blocked_source_policy: "来源策略阻止",
        duplicate_source: "重复来源",
        already_fetched: "已读取过",
        fetch_failed_or_empty: "读取失败或内容为空",

      }[value] || value || "";

        "full.llm.request": "模型输入",

        "full.search.request": "搜索请求",
        "full.search.response": "搜索结果",
        "full.search.error": "搜索失败",
        "full.search.skipped": "跳过搜索",
        "full.fetch.request": "网页读取请求",
        "full.fetch.response": "网页读取结果",
        "full.fetch.error": "网页读取失败",
        "full.fetch.rejected": "来源被拒绝",
        "full.fetch.skipped": "跳过网页读取",
        "full.kg.upsertKnowledgeNode": "保存资料节点",
        "full.kg.reuseKnowledgeNode": "复用资料节点",
        "full.kg.upsertEvidenceLink": "关联证据",
        "full.kg.updateEvidenceLink": "更新证据",
        "full.kg.upsertReportlet": "保存报告片段",
        "full.kg.addOpenGap": "记录证据缺口",
        "full.kg.closeOpenGaps": "关闭证据缺口",
        "full.kg.skipKnowledgeNode": "跳过资料节点",
        "full.kg.acknowledgeOpenGaps": "确认开放缺口",

        "full.ledger.updateStatus": "更新任务状态",
        "full.agent.failed": "代理失败",
        "full.artifact.writeFile": "写入产物",
      }[value] || zhUiText(String(value || "事件"));
    }

    function severityLabel(value) {
      return { info: "信息", success: "成功", warning: "警告", error: "错误" }[value] || value || "";
    }

    function boolLabel(value) {
      if (value === true || value === "true") return "是";
      if (value === false || value === "false") return "否";
      return String(value ?? "");
    }

    function decisionLabel(value) {
      return {
        sufficient: "证据充分",
        need_more_work: "需要继续补充",
        publish: "可以发布",
        repair: "需要修复",
        apply: "应用",
        reject: "拒绝",
        redispatch: "重新分发",
      }[value] || zhUiText(String(value ?? ""));
    }

    function arraySummary(value) {
      if (!Array.isArray(value)) return String(value ?? "");
      if (value.length === 0) return "无";
      return value.slice(0, 6).map((item) => {
        if (typeof item === "string") return item;
        if (item && typeof item === "object") {
          return oneLine(item.title || item.taskId || item.gap || item.reason || JSON.stringify(item), 120);
        }
        return String(item);
      }).join("；") + (value.length > 6 ? `；另 ${value.length - 6} 项` : "");
    }

    function formatNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number.toFixed(2) : "?";
    }

    function errorText(error) {
      if (error && typeof error === "object") return error.message || JSON.stringify(error);
      return String(error || "");
    }

    function parseJsonLoose(value) {
      try {
        return JSON.parse(value);
      } catch {
        const match = String(value || "").match(/\{[\s\S]*\}/);
        if (!match) return null;
        try {
          return JSON.parse(match[0]);
        } catch {
          return null;
        }
      }
    }

    function oneLine(value, max = 120) {
      const clean = String(value || "").replace(/\s+/g, " ").trim();
      return clean.length <= max ? clean : `${clean.slice(0, Math.max(0, max - 3))}...`;
    }

    function shortTime(timestamp) {
      return String(timestamp || "").slice(11, 19) || "--:--:--";
    }

    function frameTimestamp(frame) {
      if (!frame) return "";
      return frame.event?.timestamp || frame.visual?.timestamp || "";
    }

    function formatDateTime(timestamp) {
      if (!timestamp) return "-";
      const date = new Date(timestamp);
      if (Number.isNaN(date.getTime())) return String(timestamp);
      const pad = (value) => String(value).padStart(2, "0");
      return `${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function durationBetween(start, end) {
      if (!start || !end) return "-";
      const seconds = Math.max(0, Math.round((new Date(end).getTime() - new Date(start).getTime()) / 1000));
      return formatDuration(seconds);
    }

    function idleSeconds(timestamp) {
      if (!timestamp) return 0;
      const time = new Date(timestamp).getTime();
      if (!Number.isFinite(time)) return 0;
      return Math.max(0, Math.round((Date.now() - time) / 1000));
    }

    function formatDuration(seconds) {
      const value = Math.max(0, Number(seconds) || 0);
      if (value < 60) return `${value} 秒`;
      const minutes = Math.floor(value / 60);
      const rest = value % 60;
      if (minutes < 60) return `${minutes} 分 ${rest} 秒`;
      const hours = Math.floor(minutes / 60);
      return `${hours} 小时 ${minutes % 60} 分`;
    }

    function statusLabel(status) {
      return {
        idle: "空闲",
        running: "运行中",
        succeeded: "成功",
        needs_human_review: "等待你的决定",
        failed: "失败",
        interrupted: "可继续",
        completed: "已完成",
        error: "错误",
        cancelled: "已取消",
        loaded: "已载入",
        finished: "已结束",
      }[status] || status || "未知";
    }

    function setRunHint(value) {
      $("runHint").textContent = value;
    }

    function renderRunHint() {
      if (!state.runId) {
        setRunHint(state.runHistory.length ? `${state.runHistory.length} 条历史` : "未开始");
        return;
      }
      const last = state.lastFrameAt || state.runInfo?.updatedAt || "";
      setRunHint(`${state.runId}${last ? ` · 最后 ${shortTime(last)}` : ""}`);
    }

    function detailsText(frame) {
      const item = readableFrame(frame);
      const payload = frame.event?.payload || frame.visual?.payload || {};
      return JSON.stringify({
        "事件类型": eventTypeLabel(frame.event?.eventType || ""),
        "原始事件类型": frame.event?.eventType || "",
        "时间": frameTimestamp(frame),
        "阶段": llmPhaseLabel(frame.phase || payload.phase || ""),
        "执行者": {
          "名称": displayAgentTitle(frame.visual?.actor?.title || frame.actor || ""),
          "角色": roleLabel(frame.visual?.actor?.role || ""),
          "任务ID": frame.visual?.actor?.taskId || frame.taskId || "",
          "报告节点": frame.visual?.actor?.reportNodeId || frame.reportNodeId || "",
          "代理运行ID": frame.visual?.actor?.agentRunId || frame.agentRunId || "",
        },
        "界面摘要": {
          "类别": labelForKind(item.kind),
          "标题": item.title,
          "摘要": item.summary,
          "严重程度": severityLabel(frame.visual?.ui?.severity || ""),
          "通道": labelForLane(frame.visual?.ui?.lane || ""),
        },
        "关键细节": item.details,
        "原始负载": payload,
      }, null, 2);
    }

    function labelForLane(lane) {
      return { main: "主流程", agent: "子代理", writer: "写作", gate: "检查", system: "系统" }[lane] || "未知通道";
    }

    function renderProgressDots(agent) {
      const total = Math.max(1, Math.min(180, Number(agent.maxSteps) || 24));
      const completed = Math.max(0, Math.min(total, Number(agent.completedSteps) || 0));
      return Array.from({ length: total }, (_, index) => {
        const cls = index < completed ? (agent.status === "failed" ? "failed" : agent.done ? "final" : "done") : "";
        return `<span${cls ? ` class="${cls}"` : ""}></span>`;
      }).join("");
    }

    function isClusterAgent(agent) {
      return agent
        && agent.lane === "agent"
        && agent.role === "subagent"
        && agent.taskId
        && agent.taskId !== "T_root";
    }

    function inferMaxSteps(frame, fallback) {
      const payload = frame.event?.payload || frame.visual?.payload || {};
      const candidates = [
        payload?.budget?.maxReactSteps,
        payload?.configuredBudget?.maxReactSteps,
        payload?.runtimeBudget?.maxReactSteps,
        frame.visual?.budget?.maxReactSteps,
        payload?.context?.contextPacket?.budget?.maxReactSteps,
        payload?.contextPacket?.budget?.maxReactSteps,
      ];
      const found = candidates.find((value) => Number.isFinite(Number(value)));
      return clampNumber(Number(found), 1, 240, fallback || 48);
    }

    function inferTargetSteps(frame, fallback, maxSteps) {
      const payload = frame.event?.payload || frame.visual?.payload || {};
      const candidates = [
        payload?.budget?.targetReactSteps,
        payload?.configuredBudget?.targetReactSteps,
        payload?.runtimeBudget?.targetReactSteps,
        frame.visual?.budget?.targetReactSteps,
        payload?.context?.contextPacket?.budget?.targetReactSteps,
        payload?.contextPacket?.budget?.targetReactSteps,
      ];
      const found = candidates.find((value) => Number.isFinite(Number(value)));
      const fallbackValue = Number.isFinite(Number(fallback)) ? Number(fallback) : Math.max(1, Math.floor((Number(maxSteps) || 48) / 2));
      return clampNumber(Number(found), 1, Number(maxSteps) || 240, fallbackValue);
    }

    function isAgentStartFrame(frame) {
      const eventType = frame.event?.eventType || "";
      const kind = frame.visual?.kind || frame.kind || "";
      const actor = frame.visual?.actor || {};
      const stateValue = frame.visual?.state || frame.event?.payload?.state;
      return actor.role === "subagent" && (
        eventType === "evidence_agent_started"
        || kind === "agent_started"
        || stateValue === "started"
        || stateValue === "running"
      );
    }

    function isAgentFinishedFrame(frame) {
      const kind = frame.visual?.kind || frame.kind || "";
      const ui = frame.visual?.ui || {};
      const actor = frame.visual?.actor || {};
      const stateValue = frame.visual?.state || frame.event?.payload?.state;
      return actor.role === "subagent" && (
        (kind === "agent_message" && ui.severity === "success")
        || kind === "agent_finished"
        || stateValue === "finished"
        || stateValue === "completed"
      );
    }

    function isAgentFailedFrame(frame) {
      const eventType = frame.event?.eventType || "";
      const kind = frame.visual?.kind || frame.kind || "";
      const actor = frame.visual?.actor || {};
      const stateValue = frame.visual?.state || frame.event?.payload?.state;
      return actor.role === "subagent" && (
        eventType === "evidence_agent_failed"
        || kind === "error"
        || stateValue === "failed"
        || stateValue === "cancelled"
      );
    }

    function agentStatusLabel(agent) {
      if (agent.status === "failed") return "失败";
      if (agent.status === "cancelled") return "已取消";
      if (agent.done) return "已完成";
      return "进行中";
    }

    function actualAgentSteps(agent) {
      const reactSteps = agent.frames.filter((frame) => {
        const eventType = frame.event?.eventType || "";
        const kind = frame.visual?.kind || "";
        return eventType === "full.llm.request" || eventType === "full.llm.response" || kind === "agent_thinking";
      }).length;
      return reactSteps || agent.thinking || 0;
    }

    function cleanAgentSummary(value) {
      return String(value || "")
        .replace(/^#+\s*/g, "")
        .replace(/^任务[：:]\s*/g, "")
        .replace(/Evidence agent ([^\s]+) finished without saving usable source evidence\./g, "子代理 $1 未保存可用来源，已记录待补证缺口。")
        .replace(/Evidence agent ([^\s]+) reached runtime budget without saving usable source evidence\./g, "子代理 $1 到达运行预算，未保存可用来源，已记录待补证缺口。")
        .replace(/Evidence agent failed:/g, "证据子代理失败：")
        .replace(/Agent runtime exceeded maxFetchCalls=(\d+)/g, "代理运行超过网页读取上限（$1 次）")
        .replace(/Agent runtime exceeded maxReactSteps=(\d+)/g, "代理运行超过思考步骤上限（$1 步）")
        .replace(/Agent runtime exceeded maxSearchCalls=(\d+)/g, "代理运行超过搜索上限（$1 次）")
        .replace(/Tool is not available in ReflectionSchedulerAgent:/g, "全局反思代理不可用工具：")
        .replace(/Collected initial source map from search provider\./g, "已从搜索提供方收集初始来源地图。")
        .replace(/Scout produced a plan but no search evidence was returned\./g, "初步探索已生成计划，但搜索没有返回证据。")
        .replace(/Choosing next action\./g, "正在选择下一步行动。")
        .replace(/Finish with/g, "最终输出")
        .replace(/Run only after/g, "仅在以下条件后运行")
        .replace(/Legacy reflection scheduler output\./g, "已生成全局反思调度结果。")
        .replace(/Legacy structure review output\./g, "已生成结构审查结果。")
        .replace(/\bcontinueDispatch=true\b/g, "继续分发=是")
        .replace(/\bcontinueDispatch=false\b/g, "继续分发=否")
        .replace(/\batCycleLimit=true\b/g, "到达轮次上限=是")
        .replace(/\batCycleLimit=false\b/g, "到达轮次上限=否")
        .replace(/\btrue\b/g, "是")
        .replace(/\bfalse\b/g, "否")
        .replace(/\bunknown\b/g, "未知")
        .replace(/\s+/g, " ")
        .trim();
    }

    function zhUiText(value) {
      return cleanAgentSummary(value)
        .replace(/LeafWriterAgent/g, "叶节点写作代理")
        .replace(/SectionWriterAgent/g, "章节写作代理")
        .replace(/SynthesisWriterAgent/g, "综合写作代理")
        .replace(/StructureReviewAgent/g, "结构审查代理")
        .replace(/StructureCriticAgent/g, "结构批评代理")
        .replace(/DeterministicPatchGuard/g, "补丁守卫")
        .replace(/MainPlannerAgent/g, "主规划代理")
        .replace(/ReflectionSchedulerAgent/g, "全局反思代理")
        .replace(/EvidenceAgent/g, "证据子代理")
        .replace(/WriterAgent/g, "写作代理")
        .replace(/\bOrchestrator\b/g, "编排器")
        .replace(/\bGate\b/g, "检查器")
        .replace(/\bBrowser\b/g, "浏览器")
        .replace(/Scout/g, "初步探索")
        .replace(/\bstarted\b/g, "开始")
        .replace(/\bfinished\b/g, "完成")
        .replace(/\bfailed\b/g, "失败")
        .replace(/\brunning\b/g, "运行中")
        .replace(/\bcompleted\b/g, "已完成")
        .replace(/\bsucceeded\b/g, "成功")
        .replace(/\berror\b/gi, "错误")
        .replace(/\bmessage\b/gi, "消息")
        .replace(/\bstarted\b/g, "开始")
        .replace(/\bfinished\b/g, "完成")
        .replace(/\bthinking\b/gi, "思考")
        .replace(/\btool\b/gi, "工具")
        .replace(/\bsearch\b/gi, "搜索")
        .replace(/\bfetch\b/gi, "读取网页");
    }

    function displayAgentTitle(value) {
      const text = zhUiText(String(value || ""));
      if (!text) return "代理";
      return text
        .replace(/^证据子代理\s+/, "证据子代理 ")
        .replace(/^Writer$/, "写作代理")
        .replace(/^AgentRuntime$/, "代理运行时");
    }

    function localizeTranscriptContent(value) {
      const text = String(value || "");
      return zhUiText(text)
        .replace(/You are now operating as a ReAct scheduling agent after all 证据子代理s in the current batch have settled\./g, "你现在是 ReAct 调度代理，需要在当前批次所有证据子代理结束后进行全局反思。")
        .replace(/You are now operating as a ReAct tree-adjustment agent after reflection\./g, "你现在是反思后的 ReAct 探索树调整代理。")
        .replace(/You are the scout agent for a deep research framework\./g, "你是深度研究框架的初步探索代理。")
        .replace(/Plan broad source discovery only\./g, "只规划广泛的来源发现。")
        .replace(/Do not write the report or create the report tree\./g, "不要撰写报告，也不要创建报告树。")
        .replace(/Finish with the reflection scheduler JSON/g, "最后输出全局反思调度 JSON")
        .replace(/Create at most (\d+) total new or requeued repair tasks/g, "最多创建或重新排队 $1 个修复任务")
        .replace(/Output schema/gi, "输出格式")
        .replace(/Acceptance criteria/gi, "验收标准")
        .replace(/available tools/gi, "可用工具")
        .replace(/toolName/g, "工具名")
        .replace(/description/g, "说明")
        .replace(/continueDispatch/g, "是否继续分发")
        .replace(/taskUpdates/g, "任务更新")
        .replace(/newTasks/g, "新增任务")
        .replace(/skipReasons/g, "跳过原因")
        .replace(/parentTaskId/g, "父任务ID")
        .replace(/reportNodeId/g, "报告节点ID")
        .replace(/objective/g, "目标")
        .replace(/priority/g, "优先级")
        .replace(/reasoningSummary/g, "推理摘要")
        .replace(/actionSummary/g, "行动摘要")
        .replace(/openGaps/g, "开放缺口")
        .replace(/queries/g, "查询")
        .replace(/sourceStrategy/g, "来源策略");
    }

    function providerLabel(value) {
      const provider = String(value || "");
      return provider ? zhUiText(provider) : "未知";
    }

    function initialsFor(value) {
      const text = String(value || "代").replace(/Agent/g, " Agent").trim();
      if (/[\u4e00-\u9fff]/.test(text)) return text.replace(/[^\u4e00-\u9fffA-Za-z0-9]/g, "").slice(0, 2) || "代";
      return text.split(/\s+/).slice(0, 2).map((item) => item[0]).join("").toUpperCase().slice(0, 3) || "代";
    }

    function iconSvg(kind) {
      if (kind === "agent_thinking") return '<svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 22h4M8.5 14.5A6 6 0 1 1 15.5 14c-.7.5-1.2 1.3-1.4 2.1H9.9c-.2-.7-.7-1.2-1.4-1.6Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      if (String(kind).startsWith("tool")) return '<svg viewBox="0 0 24 24" fill="none"><path d="M4 17l5-5-5-5M12 19h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      if (kind === "source_saved" || kind === "evidence_linked") return '<svg viewBox="0 0 24 24" fill="none"><path d="M7 3h7l4 4v14H7V3Z M14 3v5h5 M9 13h6M9 17h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      return '<svg viewBox="0 0 24 24" fill="none"><path d="M7 12h10M12 7v10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
    }

    function markdownToHtml(markdown) {
      const lines = markdown.split(/\r?\n/);
      const html = [];
      let listOpen = false;
      const closeList = () => {
        if (listOpen) {
          html.push("</ul>");
          listOpen = false;
        }
      };
      for (const line of lines) {
        if (/^###\s+/.test(line)) {
          closeList();
          html.push(`<h3>${inlineMarkdown(line.replace(/^###\s+/, ""))}</h3>`);
        } else if (/^##\s+/.test(line)) {
          closeList();
          html.push(`<h2>${inlineMarkdown(line.replace(/^##\s+/, ""))}</h2>`);
        } else if (/^#\s+/.test(line)) {
          closeList();
          html.push(`<h1>${inlineMarkdown(line.replace(/^#\s+/, ""))}</h1>`);
        } else if (/^[-*]\s+/.test(line)) {
          if (!listOpen) {
            html.push("<ul>");
            listOpen = true;
          }
          html.push(`<li>${inlineMarkdown(line.replace(/^[-*]\s+/, ""))}</li>`);
        } else if (line.trim()) {
          closeList();
          html.push(`<p>${inlineMarkdown(line)}</p>`);
        } else {
          closeList();
        }
      }
      closeList();
      return html.join("");
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
        .replace(/\[C(\d+)\]/g, '<code>[C$1]</code>');
    }

    function escapeHtml(value) {
      return String(shouldEscape(value) ? value : "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    render();
  </script>
</body>
