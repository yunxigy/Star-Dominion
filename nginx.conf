server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    listen [::]:80;
    listen [::]:443 ssl;
    listen [::]:443 quic;

    http2 on;

    server_name 110.40.174.239 zhumenggy.top;

    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/110.40.174.239/SD/dist;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/110.40.174.239.conf;
    #CERT-APPLY-CHECK--END

    include /www/server/panel/vhost/nginx/extension/110.40.174.239/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/110.40.174.239/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/110.40.174.239/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497 https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    #ERROR-PAGE-END

    #PHP-INFO-START
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/110.40.174.239.conf;
    #REWRITE-END

    # ========================================================
    # 安全防御
    # ========================================================
    location ~* (\.env|\.git|\.htaccess|\.user\.ini|\.svn|\.project|\.bak|\.sql|\.yaml|\.yml|\.py|\.sh|\.ini|\.conf)
    {
        return 403;
    }
    # ========================================================
    # STM32 API，反向代理到 Flask 8007
    # 前端请求 /stm32/api/data -> Flask /data
    # ========================================================
    location ^~ /stm32/api/ {
        proxy_pass http://127.0.0.1:8007/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ========================================================
    # STM32 前端页面
    # 注意：这里不是 components，而是 dist
    # ========================================================
    location = /stm32 {
        return 301 /stm32/;
    }

    location ^~ /stm32/ {
        alias /www/wwwroot/110.40.174.239/SD/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    # ========================================================
    # 1. Openwrite API，端口 8001
    # 前端请求 /ow-api/xxx 时，转发为后端 /api/xxx
    # ========================================================
    location ^~ /ow-api/ {
        rewrite ^/ow-api/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Openwrite WebSocket，端口 8001
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ========================================================
    # 全站统一认证服务，端口 8000
    # /auth-api/api/v1/... -> /api/v1/...
    # ========================================================
    location ^~ /auth-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # GitHub weekly research reports, public reads with authenticated admin writes.
    location ^~ /reports-api/ {
        proxy_pass http://127.0.0.1:8009/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 文档转换中心，端口 8010；支持单文件与批量上传
    location ^~ /document-api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 220m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 论文查重服务，端口 8005；允许两个不超过 10 MB 的文件。
    location ^~ /plagiarism-api/ {
        proxy_pass http://127.0.0.1:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 22m;
        proxy_read_timeout 600s;
    }

    # /stock/ 与 /stock-api/ 已由宝塔线上站点维护；部署时保留线上规则，
    # 不用本地参考文件覆盖它们。

    # ========================================================
    # 2. 守岸人 API，端口 8006
    # ========================================================
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # ========================================================
    # 3. 守岸人 3.0 前端，由 FastAPI 8006 托管
    # 访问地址：https://zhumenggy.top/wuwa/
    # ========================================================
    location = /wuwa {
        return 301 /wuwa/;
    }

    location ^~ /wuwa/ {
        proxy_pass http://127.0.0.1:8006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # ========================================================
    # 4. 守岸人静态资源，由 FastAPI 8006 托管
    # 重点：这些必须使用 ^~，否则会被后面的 js/css 正则缓存规则抢走
    # ========================================================
    location ^~ /css/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location ^~ /js/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # ========================================================
    # 5. 守岸人根路径 HTML 页面
    # 因为守岸人 HTML 里面写的是 /characters.html、/login.html 这种绝对路径
    # 所以这里需要把这些页面也代理到 8006
    # ========================================================
    location = /characters.html {
        proxy_pass http://127.0.0.1:8006/characters.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /stories.html {
        proxy_pass http://127.0.0.1:8006/stories.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /group-chat.html {
        proxy_pass http://127.0.0.1:8006/group-chat.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /story-play.html {
        proxy_pass http://127.0.0.1:8006/story-play.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /voice-chat.html {
        proxy_pass http://127.0.0.1:8006/voice-chat.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /memory.html {
        proxy_pass http://127.0.0.1:8006/memory.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /admin.html {
        proxy_pass http://127.0.0.1:8006/admin.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /login.html {
        proxy_pass http://127.0.0.1:8006/login.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /register.html {
        proxy_pass http://127.0.0.1:8006/register.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========================================================
    # 6. Openwrite 前端静态文件
    # 访问地址：https://zhumenggy.top/openwrite/
    # 你的 index.html 已经引用 /openwrite/assets/xxx，说明 base 已经正确
    # ========================================================
    location = /openwrite {
        return 301 /openwrite/;
    }

    location ^~ /openwrite/ {
        alias /www/wwwroot/110.40.174.239/Openwrite-main/static/;
        index index.html;
        try_files $uri $uri/ /openwrite/index.html;
    }

    # ========================================================
    # 7. ACME / Let's Encrypt 验证目录
    # ========================================================
    location ~ \.well-known {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 静态资源缓存
    # MediaPipe runtime: browsers require the WASM MIME type. These files are
    # version-pinned at build time and may be cached immutably.
    location ~* \.wasm$
    {
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ~* \.tflite$
    {
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ========================================================
    # 8. 普通静态资源缓存
    # 注意：前面的 ^~ /openwrite/、^~ /css/、^~ /js/、^~ /static/
    # 已经阻止这些请求进入下面的正则 location
    # ========================================================
    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|svg|webp|mp4|mp3|woff|woff2|ttf|eot)$
    {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~* \.(js|css)$
    {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/110.40.174.239.log;
    error_log   /www/wwwlogs/110.40.174.239.error.log;
}
