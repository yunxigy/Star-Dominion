server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    http2 on;
    listen [::]:80;
    server_name 110.40.174.239 zhumenggy.top;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/110.40.174.239/SD/dist;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/110.40.174.239.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/110.40.174.239/*.conf;

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/110.40.174.239/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/110.40.174.239/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    #ERROR-PAGE-END

    #PHP-INFO-START
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/110.40.174.239.conf;
    #REWRITE-END

    # ========================================================
    # 安全防御
    # ========================================================
    location ~* (\.env|\.git|\.htaccess|\.user\.ini|\.svn|\.project|\.bak|\.sql|\.yaml|\.yml|\.json|\.py|\.sh|\.ini|\.conf)
    {
        return 403;
    }

    # ========================================================
    # 1. Openwrite API (端口 8001) — 最高优先级
    # ========================================================
    location /ow-api/ {
        rewrite ^/ow-api/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Openwrite WebSocket (端口 8001)
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
    # GitHub weekly research reports, public reads with authenticated admin writes.
    location ^~ /reports-api/ {
        proxy_pass http://127.0.0.1:8009/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ========================================================
    # 2. 守岸人 API (端口 8000)
    # ========================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # ========================================================
    # 3. 守岸人前端 (端口 8000) — /wuwa/ 代理
    # ========================================================
    location /wuwa {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # ========================================================
    # 4. Openwrite 前端（静态文件）
    # ========================================================
    location /openwrite/ {
        alias /www/wwwroot/110.40.174.239/Openwrite-main/static/;
        try_files $uri $uri/ /openwrite/index.html;
    }

    # ========================================================
    # 5. SD 工具箱（静态文件）— 根路径，优先级最低
    # ========================================================
    location / {
        root /www/wwwroot/110.40.174.239/SD/dist;
        try_files $uri $uri/ /index.html;
    }

    location ~ \.well-known{
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 静态资源缓存
    location ~* \.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }
    location ~* \.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/110.40.174.239.log;
    error_log  /www/wwwlogs/110.40.174.239.error.log;
}
