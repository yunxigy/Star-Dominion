[project]
name = "star-dominion-site-auth"
version = "0.1.0"
description = "Unified authentication service for Star Dominion"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
site-auth-admin = "site_auth.cli:main"

[tool.setuptools.packages.find]
include = ["site_auth*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
