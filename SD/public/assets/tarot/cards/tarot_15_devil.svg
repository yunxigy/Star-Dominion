      <stop offset=".45" stop-color="#c05c32" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-devil">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .11"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow-devil" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#130c08" flood-opacity=".52"/>
    </filter>
  </defs>

