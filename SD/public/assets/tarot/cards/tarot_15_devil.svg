      <stop offset=".24" stop-color="#765a3d"/>
      <stop offset=".52" stop-color="#3a1e24"/>
      <stop offset=".78" stop-color="#342019"/>
      <stop offset="1" stop-color="#111516"/>
    </linearGradient>
