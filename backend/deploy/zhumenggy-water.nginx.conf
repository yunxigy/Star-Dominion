# Add ONLY these locations inside the EXISTING zhumenggy.top HTTPS server block.
# Keep the site's current certificates, root, /api/ and all other locations.
# Run the vending backend on this same server, HTTP 127.0.0.1:38080 / TCP 9001.

location = /water {
    return 301 /water/;
}

location ^~ /water/ {
    # The trailing slash strips /water/ and preserves upstream /api/.
    proxy_pass http://127.0.0.1:38080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
}
