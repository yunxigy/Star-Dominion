<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Manager</title><link rel="stylesheet" href="/css/main.css"><style>.prompt-grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:18px}.panel{padding:18px;border:1px solid rgba(255,255,255,.15);border-radius:12px}.stack{display:grid;gap:10px}.item{padding:10px;border-bottom:1px solid rgba(255,255,255,.12)}label{display:grid;gap:5px}@media(max-width:800px){.prompt-grid{grid-template-columns:1fr}}</style></head>
<body><main class="page-container"><header class="page-header"><h1>Prompt Manager</h1><nav><a href="/personas.html">Persona</a> · <a href="/characters.html">角色库</a></nav></header><p id="prompt-status" aria-live="polite"></p>
<div class="prompt-grid">
<section class="panel stack"><h2>预设</h2><div id="preset-list"></div><label>名称<input id="preset-name" maxlength="120"></label><label>Token 预算<input id="preset-budget" type="number" min="64" max="65536" value="4096"></label><button id="save-preset" type="button">新建预设</button></section>
<section class="panel stack"><h2>Prompt 块</h2><div id="block-list"></div><label>名称<input id="block-name" maxlength="120"></label><label>类型<select id="block-kind"><option value="system">系统</option><option value="author_note">Author's Note</option><option value="final">最终指令</option></select></label><label>角色<select id="block-role"><option value="system">system</option><option value="user">user</option><option value="assistant">assistant</option></select></label><label>排序<input id="block-order" type="number" min="-10000" max="10000" value="0"></label><label><input id="block-enabled" type="checkbox" checked>启用</label><label>内容<textarea id="block-content" maxlength="100000"></textarea></label><div><button id="save-block" type="button">保存块</button><button id="delete-block" type="button">删除块</button><button id="reorder-blocks" type="button">按数值排序</button></div></section>
<section class="panel stack"><h2>模型档案</h2><div id="model-profile-list"></div><label>名称<input id="profile-name"></label><label>Provider<input id="profile-provider"></label><label>模型<input id="profile-model"></label><label>Temperature<input id="profile-temperature" type="number" min="0" max="2" step="0.1" value="0.8"></label><button id="save-profile" type="button">添加档案</button></section>
<section class="panel"><h2>安全预览</h2><button id="run-preview" type="button">生成预览</button><pre id="prompt-preview"></pre><div id="preview-trace" aria-live="polite"></div></section>
</div></main><script src="/js/auth.js"></script><script src="/js/api.js"></script><script src="/js/prompt-manager.js"></script></body></html>
